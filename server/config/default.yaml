# Конфигурация движка SignalAI.
#
# Источник чисел — SIGNAL_AI_TRADING_ENGINE_TZ_v1.0 §27. Где engine-ТЗ и
# UX-ТЗ v2 расходятся, старше engine-ТЗ (решение владельца от 29.07.2026);
# расхождения перечислены в docs/TZ_PRIORITY.md.
#
# Ни одно число торговой логики не зашивается в код (§0.8). Хэш этого файла
# сохраняется в каждой идее и в каждом прогоне бэктеста (§27), поэтому любую
# выдачу можно связать с параметрами, при которых она получена.

version: "2.0-risk-exit"

capital:
  investment_share: 0.80
  risk_share: 0.20
  presets:
    cautious: {investment: 0.90, risk: 0.10}
    base: {investment: 0.80, risk: 0.20}
    active: {investment: 0.70, risk: 0.30}

risk:
  # Выбранный владельцем капитал риск-контура FORTS + crypto. Абсолютные
  # ограничения ниже Risk Engine v2 НЕ увеличивает: он умеет только урезать
  # разрешённый бюджет внутри этих потолков.
  equity_rub: 300000
  base_risk_per_trade: 0.005
  max_risk_per_trade: 0.0075
  max_total_open_risk: 0.02
  max_cluster_risk: 0.01
  daily_loss_limit: 0.015
  weekly_loss_limit: 0.035
  monthly_loss_limit: 0.06
  max_crypto_leverage: 3.0
  min_liquidation_distance_ratio: 2.5
  paper_only: true
  drawdown_scaling:
    - {max_dd: 0.04, multiplier: 1.00}
    - {max_dd: 0.07, multiplier: 0.75}
    - {max_dd: 0.10, multiplier: 0.50}
    - {max_dd: 1.00, multiplier: 0.00}
  clusters:
    - rub_fx
    - ru_equity_index
    - energy
    - metals
    - crypto_majors
    - crypto_beta
  dynamic_correlation_window_days: 60
  high_correlation_threshold: 0.70
  management:
    # Legacy fallback для уже выпущенных до v2 идей. Новая идея подписывает
    # один из профилей ниже, и PaperTrade хранит именно его доли.
    tp_shares: [0.40, 0.40, 0.20]
    tp1_close_fraction: 0.40
    max_reentries: 1
    policy_version: "risk-exit-v2.0"

    # Low-confidence/нестабильный WinRate → defensive. Доказанный устойчивый
    # edge → conviction. Ни один risk_multiplier не может быть > 1.0.
    profiles:
      defensive:
        risk_multiplier: 0.65
        tp_shares: [0.50, 0.35, 0.15]
        runner_enabled: true
        runner_activation_r: 3.0
        atr_multiplier: 1.8
        min_trail_r: 0.70
        mfe_giveback: 0.25
        tp1_stop_lock_r: 0.00
        tp2_stop_lock_r: 1.00
        time_stop_hours: 36
      balanced:
        risk_multiplier: 0.90
        tp_shares: [0.35, 0.30, 0.35]
        runner_enabled: true
        runner_activation_r: 3.0
        atr_multiplier: 2.4
        min_trail_r: 0.90
        mfe_giveback: 0.35
        tp1_stop_lock_r: -0.15
        tp2_stop_lock_r: 0.50
        time_stop_hours: 48
      conviction:
        risk_multiplier: 1.00
        tp_shares: [0.20, 0.25, 0.55]
        runner_enabled: true
        runner_activation_r: 3.0
        atr_multiplier: 3.0
        min_trail_r: 1.20
        mfe_giveback: 0.45
        tp1_stop_lock_r: -0.25
        tp2_stop_lock_r: 0.25
        time_stop_hours: 72

    optimizer:
      # Запускается внутри того же последовательного scheduler, а не вторым
      # daemon/process. При малой выборке только пишет «данных мало».
      cadence_days: 7
      min_samples: 80
      min_oos_expectancy_improvement_r: 0.03
      # Bounded candidate set: optimizer не сочиняет неограниченные числа.
      # baseline совпадает с profiles. Остальные меняют только exit geometry;
      # абсолютный риск сделки остаётся profile risk_multiplier + hard caps.
      candidates:
        - id: baseline
          profiles:
            defensive: {tp_shares: [0.50, 0.35, 0.15], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 1.8, min_trail_r: 0.70, mfe_giveback: 0.25, tp1_stop_lock_r: 0.00, tp2_stop_lock_r: 1.00, time_stop_hours: 36}
            balanced: {tp_shares: [0.35, 0.30, 0.35], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 2.4, min_trail_r: 0.90, mfe_giveback: 0.35, tp1_stop_lock_r: -0.15, tp2_stop_lock_r: 0.50, time_stop_hours: 48}
            conviction: {tp_shares: [0.20, 0.25, 0.55], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 3.0, min_trail_r: 1.20, mfe_giveback: 0.45, tp1_stop_lock_r: -0.25, tp2_stop_lock_r: 0.25, time_stop_hours: 72}
        - id: runner_wide
          profiles:
            defensive: {tp_shares: [0.48, 0.32, 0.20], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 2.2, min_trail_r: 0.85, mfe_giveback: 0.32, tp1_stop_lock_r: 0.00, tp2_stop_lock_r: 0.85, time_stop_hours: 40}
            balanced: {tp_shares: [0.30, 0.25, 0.45], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 2.8, min_trail_r: 1.10, mfe_giveback: 0.42, tp1_stop_lock_r: -0.15, tp2_stop_lock_r: 0.40, time_stop_hours: 54}
            conviction: {tp_shares: [0.15, 0.20, 0.65], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 3.4, min_trail_r: 1.35, mfe_giveback: 0.50, tp1_stop_lock_r: -0.25, tp2_stop_lock_r: 0.20, time_stop_hours: 84}
        - id: harvest_early
          profiles:
            defensive: {tp_shares: [0.55, 0.30, 0.15], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 1.6, min_trail_r: 0.65, mfe_giveback: 0.22, tp1_stop_lock_r: 0.00, tp2_stop_lock_r: 1.00, time_stop_hours: 32}
            balanced: {tp_shares: [0.40, 0.30, 0.30], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 2.1, min_trail_r: 0.80, mfe_giveback: 0.30, tp1_stop_lock_r: -0.10, tp2_stop_lock_r: 0.60, time_stop_hours: 44}
            conviction: {tp_shares: [0.25, 0.25, 0.50], runner_enabled: true, runner_activation_r: 3.0, atr_multiplier: 2.7, min_trail_r: 1.00, mfe_giveback: 0.38, tp1_stop_lock_r: -0.20, tp2_stop_lock_r: 0.35, time_stop_hours: 64}

ideas:
  max_daily_cards: 5
  active_probability_min: 0.54
  active_expected_r_min: 0.20
  min_rr_tp2: 2.0
  min_confidence: 0.50
  watch_probability_min: 0.47
  ranking:
    expected_value: 0.35
    confidence_adjusted_p: 0.25
    score: 0.15
    liquidity: 0.10
    diversification: 0.10
    execution: 0.05

scoring:
  weights:
    regime_fit: 0.16
    market_structure: 0.14
    setup_quality: 0.14
    trigger_quality: 0.12
    derivatives_confirmation: 0.10
    volume_confirmation: 0.08
    liquidity_quality: 0.07
    volatility_fit: 0.06
    level_confluence: 0.06
    risk_reward_quality: 0.04
    execution_quality: 0.03
  data_quality_floor: 0.5
  data_quality_ceiling: 1.0
  fib_max_contribution: 0.08
  elliott_max_contribution: 0.05

probability:
  rule_prior_cap: 0.68
  min_oos_trades_for_model: 100
  shrinkage_k: 20
  confidence_weights:
    sample_adequacy: 0.30
    calibration: 0.25
    data_completeness: 0.20
    regime_similarity: 0.15
    stability: 0.10
  confidence_bands:
    low_below: 0.45
    high_above: 0.70

regime:
  ema_fast: 50
  ema_slow: 200
  adx_period: 14
  adx_trend_min: 18
  adx_range_max: 20
  trend_score_uptrend_min: 3
  trend_score_downtrend_max: -3
  trend_score_range_abs_max: 1
  volatility_percentile_window: 252
  volatility_bands: {low: 30, normal: 75, high: 90}

structure:
  pivot_confirm_bars: 2
  bos_min_atr: 0.10
  sweep_atr_min: 0.05
  sweep_atr_max: 0.75
  fvg_min_atr: 0.10
  order_block_min_body_atr: 0.80
  order_block_min_volume_z: 0.50
  impulse_min_atr: 2.0
  fib_levels: [0.382, 0.5, 0.618, 0.786]
  fib_extensions: [1.272, 1.618]

strategies:
  trend_pullback:
    enabled: true
    min_trend_score: 3
    min_adx: 18
    fib_zone: [0.382, 0.618]
    max_retracement: 0.786
    stop_atr_buffer: 0.10
    min_stop_ticks: 2
    # Двойной setup-конфлюэнс сохраняем: качество не размениваем на поток.
    # Исправление recovery в другом: setup без финального trigger теперь
    # становится WATCH и получает шанс подтвердиться следующим H1-баром.
    min_zones: 2
    min_triggers: 1
    reversal_body_atr: 0.60
    volume_z_min: 0.50
    tp1_r_min: 1.0
    tp1_r_max: 1.3
    tp2_r_min: 2.0
    tp3_r_min: 3.0
  breakout_retest:
    enabled: true
    min_range_bars: 20
    range_width_atr: [2.0, 8.0]
    min_boundary_touches: 2
    bb_width_percentile_max: 35
    breakout_atr: 0.15
    breakout_body_atr: 0.70
    breakout_volume_z: 1.0
    max_retest_bars: 6
    retest_max_depth_atr: 0.35
    tp1_r_min: 1.0
    tp2_rr_min: 2.0
  wyckoff_reversal:
    enabled: true
    min_prior_move_atr: 3.0
    min_range_bars: 25
    sweep_atr_min: 0.10
    sweep_atr_max: 0.70
    spring_impulse_atr: 0.80
    stop_atr_buffer: 0.10
    tp2_rr_min: 2.2
    risk_multiplier: 0.75

horizons:
  short:   {days: [1, 3],  context: "1D",    setup: "4H", trigger: "1H"}
  medium:  {days: [4, 7],  context: "1W+1D", setup: "4H", trigger: "1H"}
  long:    {days: [8, 14], context: "1W",    setup: "1D", trigger: "4H"}

universe:
  futures:
    min_median_daily_notional_rub: 100000000
    min_median_oi_notional_rub: 500000000
    max_median_relative_spread: 0.0015
    min_closed_hourly_bars: 250
    min_days_to_expiry: 5
  crypto:
    mandatory: ["BTCUSDT", "ETHUSDT"]
    min_median_daily_notional_usdt: 25000000
    # Для текущего 1D/4H/1H движка 180 дней дают большой запас к минимуму
    # 60 D1 + 120 H1, но не отрезают ликвидные новые crypto-beta на целый год.
    min_history_days: 180
    max_active: 30
  investments:
    min_history_days: 120
    max_equities: 40
    max_funds: 15
    max_bonds: 20
    min_daily_turnover_rub: 20000000
    min_bond_turnover_rub: 5000000
    min_fund_turnover_rub: 3000000
  options:
    dte_range: [7, 45]
    max_relative_spread: 0.07
    min_open_interest: 500

portfolio:
  crypto_max_weight: 0.05
  drift_min_pp: 0.02
  drift_relative: 0.20
  # No broker fee/cost-basis/tax policy is approved yet.  All three values
  # must be configured together before a rebalance draft can be actionable.
  rebalance_economics:
    policy_id: ""
    fee_bps: null
    capital_gain_tax_rate: null
  packages:
    simple: [3, 5]
    balanced: [5, 8]
    max_potential: [7, 12]

# Measurement-only supplemental assumptions for Shadow crypto carry. These do
# not change order sizing, admission, risk caps or live execution. They are
# explicit here so every Shadow observation is tied to an auditable cost hash.
shadow:
  crypto_carry:
    # Conservative full entry+exit taker friction for the hedged perpetual leg.
    execution_cost_bps: 11.0
    # Additional hedge/capital carry haircut per funding interval.
    hedge_carry_bps_per_interval: 2.0
    # Guard against the next funding print differing from the observed median.
    funding_uncertainty_bps_per_interval: 2.0

backtest:
  walk_forward:
    min_history_months: 36
    train_months: 24
    validation_months: 6
    test_months: 3
    step_months: 3
  paper_gate:
    min_aggregate_trades: 200
    min_trades_per_setup: 40
    min_oos_profit_factor: 1.20
    min_oos_expectancy_r: 0.12
    max_top5_contribution: 0.30
  live_gate:
    min_paper_trades: 100
    min_paper_days: 60

execution:
  mode: PAPER
  protection_sla_seconds: 30
  weekend_slippage_multiplier: 1.5

data:
  max_bar_age_seconds:
    crypto: 120
    moex: 300
  data_confidence_without_algopack: 0.85
