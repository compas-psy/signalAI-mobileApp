# Конфигурация движка SignalAI.
#
# Источник чисел — SIGNAL_AI_TRADING_ENGINE_TZ_v1.0 §27. Где engine-ТЗ и
# UX-ТЗ v2 расходятся, старше engine-ТЗ (решение владельца от 29.07.2026);
# расхождения перечислены в docs/TZ_PRIORITY.md.
#
# Ни одно число торговой логики не зашивается в код (§0.8). Хэш этого файла
# сохраняется в каждой идее и в каждом прогоне бэктеста (§27), поэтому любую
# выдачу можно связать с параметрами, при которых она получена.

version: "1.0"

# ─── Капитал (§2) ─────────────────────────────────────────────────────────
capital:
  investment_share: 0.80
  risk_share: 0.20
  # Пресеты §2. Стартовый — базовый.
  presets:
    cautious: {investment: 0.90, risk: 0.10}
    base: {investment: 0.80, risk: 0.20}
    active: {investment: 0.70, risk: 0.30}

# ─── Риск (§17) ───────────────────────────────────────────────────────────
#
# Внимание: эти лимиты строже, чем в UX-ТЗ §20 (там 3/5/10% и кластер 1,25%).
# Engine-ТЗ старше — см. docs/TZ_PRIORITY.md.
risk:
  base_risk_per_trade: 0.005
  max_risk_per_trade: 0.0075      # A-grade; 1% из UX-ТЗ не используется
  max_total_open_risk: 0.02
  max_cluster_risk: 0.01
  daily_loss_limit: 0.015
  weekly_loss_limit: 0.035
  monthly_loss_limit: 0.06
  max_crypto_leverage: 3.0
  # Ниже стопа не входим: ликвидация должна быть дальше стопа (§13).
  min_liquidation_distance_ratio: 2.5
  paper_only: true

  # Снижение размера по просадке (§17). Границы включают левый край.
  drawdown_scaling:
    - {max_dd: 0.04, multiplier: 1.00}
    - {max_dd: 0.07, multiplier: 0.75}
    - {max_dd: 0.10, multiplier: 0.50}
    - {max_dd: 1.00, multiplier: 0.00}   # >10% — halt

  # Кластеры корреляции (§17.2). Динамический расчёт добавляется поверх.
  clusters:
    - rub_fx
    - ru_equity_index
    - energy
    - metals
    - crypto_majors
    - crypto_beta
  dynamic_correlation_window_days: 60
  high_correlation_threshold: 0.70

  # Сопровождение позиции (§17.3).
  management:
    tp1_close_fraction: 0.50        # UX-ТЗ §21.1 даёт 0.4/0.4/0.2 — не применяем
    max_reentries: 1

# ─── Отбор идей дня (§16) ─────────────────────────────────────────────────
ideas:
  max_daily_cards: 3
  active_probability_min: 0.56
  active_expected_r_min: 0.20
  min_rr_tp2: 2.0
  min_confidence: 0.50
  watch_probability_min: 0.50
  # Веса ранжирования §16.7
  ranking:
    expected_value: 0.35
    confidence_adjusted_p: 0.25
    score: 0.15
    liquidity: 0.10
    diversification: 0.10
    execution: 0.05

# ─── Оценка (§15.1) ───────────────────────────────────────────────────────
#
# Двенадцатый компонент data_quality не складывается, а умножает итог.
scoring:
  weights:
    regime_fit: 0.16
    market_structure: 0.14
    setup_quality: 0.14
    trigger_quality: 0.12
    derivatives_confirmation: 0.10
    volume_confirmation: 0.08
    liquidity_quality: 0.07
    volatility_fit: 0.06
    level_confluence: 0.06
    risk_reward_quality: 0.04
    execution_quality: 0.03
  data_quality_floor: 0.5
  data_quality_ceiling: 1.0
  # Потолки вклада вспомогательных методов (§8.1, §8.2)
  fib_max_contribution: 0.08
  elliott_max_contribution: 0.05

# ─── Вероятность и уверенность (§15.3, §15.4) ─────────────────────────────
probability:
  # До накопления статистики оценка не может притворяться точной (§15.3).
  rule_prior_cap: 0.68
  min_oos_trades_for_model: 100
  shrinkage_k: 20
  confidence_weights:
    sample_adequacy: 0.30
    calibration: 0.25
    data_completeness: 0.20
    regime_similarity: 0.15
    stability: 0.10
  confidence_bands:
    low_below: 0.45
    high_above: 0.70

# ─── Классификатор режима (§9) ────────────────────────────────────────────
regime:
  ema_fast: 50
  ema_slow: 200
  adx_period: 14
  adx_trend_min: 18
  adx_range_max: 20
  trend_score_uptrend_min: 3
  trend_score_downtrend_max: -3
  trend_score_range_abs_max: 1
  volatility_percentile_window: 252
  volatility_bands: {low: 30, normal: 75, high: 90}

# ─── Формализация методов (§8) ────────────────────────────────────────────
structure:
  pivot_confirm_bars: 2            # pivot не подтверждён, пока нет k баров (§8.3)
  bos_min_atr: 0.10
  sweep_atr_min: 0.05
  sweep_atr_max: 0.75
  fvg_min_atr: 0.10
  order_block_min_body_atr: 0.80
  order_block_min_volume_z: 0.50
  impulse_min_atr: 2.0             # для построения фибо (§8.1)
  fib_levels: [0.382, 0.5, 0.618, 0.786]
  fib_extensions: [1.272, 1.618]

# ─── Стратегии (§10–§12) ──────────────────────────────────────────────────
strategies:
  trend_pullback:
    enabled: true
    min_trend_score: 3
    min_adx: 18
    fib_zone: [0.382, 0.618]
    max_retracement: 0.786
    stop_atr_buffer: 0.10
    min_stop_ticks: 2
    min_zones: 2                   # коррекция входит минимум в две зоны (§10.2)
    min_triggers: 2                # минимум два триггера (§10.3)
    reversal_body_atr: 0.60
    volume_z_min: 0.50
    tp1_r_min: 1.0
    tp1_r_max: 1.3
    tp2_r_min: 2.0
    tp3_r_min: 3.0
  breakout_retest:
    enabled: true
    min_range_bars: 20
    range_width_atr: [2.0, 8.0]
    min_boundary_touches: 2
    bb_width_percentile_max: 35
    breakout_atr: 0.15
    breakout_body_atr: 0.70
    breakout_volume_z: 1.0
    max_retest_bars: 6
    retest_max_depth_atr: 0.35
    tp1_r_min: 1.0
    tp2_rr_min: 2.0
  wyckoff_reversal:
    enabled: true
    min_prior_move_atr: 3.0
    min_range_bars: 25
    sweep_atr_min: 0.10
    sweep_atr_max: 0.70
    spring_impulse_atr: 0.80
    stop_atr_buffer: 0.10
    tp2_rr_min: 2.2
    risk_multiplier: 0.75

# ─── Мультитаймфрейм (§7) ─────────────────────────────────────────────────
horizons:
  short:   {days: [1, 3],  context: "1D",    setup: "4H", trigger: "1H"}
  medium:  {days: [4, 7],  context: "1W+1D", setup: "4H", trigger: "1H"}
  long:    {days: [8, 14], context: "1W",    setup: "1D", trigger: "4H"}

# ─── Вселенная (§5) ───────────────────────────────────────────────────────
universe:
  futures:
    min_median_daily_notional_rub: 100000000
    min_median_oi_notional_rub: 500000000
    max_median_relative_spread: 0.0015
    min_closed_hourly_bars: 250
    min_days_to_expiry: 5
  crypto:
    mandatory: ["BTCUSDT", "ETHUSDT"]
    min_median_daily_notional_usdt: 100000000
    min_history_days: 365
    max_active: 12
  investments:
    min_history_days: 120
    # Верхние границы вселенной. Не «сколько бумаг нравится», а сколько
    # оптимизатор способен различить: на трёхстах рядах он находит связи,
    # которых нет, а загрузка упирается в лимиты биржи.
    max_equities: 40
    max_funds: 15
    max_bonds: 20
    min_daily_turnover_rub: 20000000
    min_bond_turnover_rub: 5000000
    # У биржевых фондов оборот на порядок меньше, чем у голубых фишек, и это
    # свойство инструмента, а не признак неликвидности: фонд создаётся и
    # погашается маркет-мейкером, а не только торгуется в стакане. Общий
    # порог в 20 млн ₽ отсекал их все — во вселенной не оказалось ни одного
    # фонда, а вместе с ними ни денежного рынка, ни облигационных фондов.
    # Без них консервативный профиль не соберётся никогда: его потолок на
    # акции не даёт набрать 100%.
    min_fund_turnover_rub: 3000000
  options:
    dte_range: [7, 45]
    max_relative_spread: 0.07
    min_open_interest: 500

# ─── Портфель (§6) ────────────────────────────────────────────────────────
portfolio:
  crypto_max_weight: 0.05
  drift_min_pp: 0.02
  drift_relative: 0.20
  packages:
    simple: [3, 5]
    balanced: [5, 8]
    max_potential: [7, 12]

# ─── Бэктест и допуски (§19) ──────────────────────────────────────────────
backtest:
  walk_forward:
    min_history_months: 36
    train_months: 24
    validation_months: 6
    test_months: 3
    step_months: 3
  paper_gate:
    min_aggregate_trades: 200
    min_trades_per_setup: 40
    min_oos_profit_factor: 1.20
    min_oos_expectancy_r: 0.12
    max_top5_contribution: 0.30
  live_gate:
    min_paper_trades: 100
    min_paper_days: 60

# ─── Исполнение (§21) ─────────────────────────────────────────────────────
execution:
  mode: PAPER                      # ANALYTICS_ONLY | PAPER | LIVE_CONFIRM_EACH | LIVE_AUTO
  protection_sla_seconds: 30
  weekend_slippage_multiplier: 1.5

# ─── Данные (§4) ──────────────────────────────────────────────────────────
data:
  max_bar_age_seconds:
    crypto: 120
    moex: 300
  # Без ALGOPACK система обязана работать, но с пониженной уверенностью (§4.1)
  data_confidence_without_algopack: 0.85
