# Развёртывание MVP (engine-ТЗ §3, §29.1).
#
# Секретов в файле нет: пароли и ключи приходят из /etc/signalai/.env,
# который создаёт bootstrap на сервере с правами 0600 (§21).
#
# Наружу открыт только api, и только на localhost: снаружи к нему пускает
# reverse proxy с TLS. База и Redis не имеют публикуемых портов вовсе —
# ходить к ним можно лишь из этой сети.

# Все долгоживущие контейнеры ограничивают локальные json-логи. Это
# профилактика дискового давления: вместо аварийного удаления Docker storage
# старые chunks ротируются самим Docker. Named volumes этим не затрагиваются.
x-signalai-logging: &signalai-bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *signalai-bounded-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нужен POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-signalai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *signalai-bounded-logging
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data

  api:
    build: .
    restart: unless-stopped
    logging: *signalai-bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SIGNALAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signalai}
      SIGNALAI_REDIS_URL: redis://redis:6379/0
      # Тот же токен зашивается в sideload APK. Без него внешний API должен
      # закрыться, а не работать публично.
      SIGNALAI_DEVICE_TOKEN: ${SIGNALAI_DEVICE_TOKEN:?нужен SIGNALAI_DEVICE_TOKEN}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHATID: ${TELEGRAM_CHATID:-}
      # api модель не опрашивает — он только показывает её состояние в
      # диагностике. Настройки те же, чтобы «настроено» и «работает»
      # проверялись по одному источнику правды.
      SIGNALAI_LLM_BASE_URL: ${SIGNALAI_LLM_BASE_URL:-}
      SIGNALAI_LLM_MODEL: ${SIGNALAI_LLM_MODEL:-qwen3.5:4b}
      SIGNALAI_LLM_TIMEOUT_SECONDS: ${SIGNALAI_LLM_TIMEOUT_SECONDS:-180}
      SIGNALAI_LLM_NUM_CTX: ${SIGNALAI_LLM_NUM_CTX:-4096}
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # scheduler использует condition: service_healthy. Без собственного
    # healthcheck API никогда не становится healthy, даже если uvicorn уже
    # отвечает, и планировщик либо не стартует, либо compose отклоняет граф.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Локальная модель для критика (ТЗ §15, §26.2). Контейнером, а не службой
  # на хосте, по одной причине: служба, слушающая 127.0.0.1, из контейнера
  # недоступна в принципе — трафик приходит с адреса docker-моста, а не с
  # петли. Чинить это пришлось бы либо открытием 0.0.0.0 (порт без
  # авторизации на публичном интерфейсе), либо привязкой к адресу моста,
  # который меняется вместе с сетью compose. Здесь ни того, ни другого:
  # портов наружу нет вовсе, а api и планировщик ходят по имени сети.
  #
  # Профиль означает выключено по умолчанию. Модель весит гигабайты и ест
  # ту же память, что Postgres; включать её на сервере, где её не ждут, —
  # решение владельца, а не побочный эффект выкладки. Включается строкой
  # COMPOSE_PROFILES=llm в /etc/signalai/.env.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *signalai-bounded-logging
    profiles: ["llm"]
    environment:
      # Один запрос за раз и одна модель в памяти. На четырёх ядрах вторая
      # одновременная генерация не ускоряет ничего: обе упираются в те же
      # ядра, а память уходит в своп — вместе с базой.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "32"
      # Полминуты, а не пять: критик зовёт модель пачкой раз в несколько
      # часов, и всё остальное время веса в памяти не нужны никому. Пять
      # минут после первого живого прогона удержали ~3 ГБ ровно тогда,
      # когда рядом Postgres, nginx и планировщик, — хост ушёл в своп, и
      # TLS-рукопожатия стали обрываться. Снаружи это выглядело как
      # «сервер пропал» через десять минут после зелёного деплоя.
      OLLAMA_KEEP_ALIVE: "30s"
      OLLAMA_CONTEXT_LENGTH: "${SIGNALAI_LLM_NUM_CTX:-4096}"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      - ollama:/root/.ollama
    # Предел памяти стоит намеренно ниже свободной. Без него неудачно
    # подобранная модель вытеснит Postgres, и «медленно» превратится в
    # «база упала» — то есть в поломку, которую никто не свяжет с моделью.
    deploy:
      resources:
        limits:
          # Три гигабайта, не пять: 4b-модель в четырёхбитном кванте с
          # контекстом 4096 и q8-кэшем влезает, а пять рядом с базой и
          # прокси на восьми общих — уже своп для всех.
          memory: ${SIGNALAI_LLM_MEMORY_LIMIT:-3g}
          # Половина ядер. Генерация на всех четырёх душит TLS-рукопожатия
          # прокси: они тоже считаются на CPU, и «модель думает» снаружи
          # неотличимо от «сервер упал».
          cpus: "2"

  # Планировщик §26: вселенная, загрузка, допуск, скан. Отдельный процесс, а
  # не фон внутри api: несколько воркеров uvicorn подняли бы столько же копий
  # расписания, и каждая пошла бы грузить биржу. Портов не публикует.
  scheduler:
    build: .
    restart: unless-stopped
    logging: *signalai-bounded-logging
    depends_on:
      postgres:
        condition: service_healthy
      # Миграции накатывает api — планировщик не должен стартовать раньше
      # схемы, иначе первый же тик упадёт на отсутствующей таблице.
      api:
        condition: service_healthy
    environment:
      SIGNALAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signalai}
      SIGNALAI_REDIS_URL: redis://redis:6379/0
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHATID: ${TELEGRAM_CHATID:-}
      SIGNALAI_UNIVERSE_EVERY_MINUTES: ${SIGNALAI_UNIVERSE_EVERY_MINUTES:-360}
      SIGNALAI_INGEST_EVERY_MINUTES: ${SIGNALAI_INGEST_EVERY_MINUTES:-15}
      SIGNALAI_REVIEW_EVERY_MINUTES: ${SIGNALAI_REVIEW_EVERY_MINUTES:-360}
      SIGNALAI_SCAN_EVERY_MINUTES: ${SIGNALAI_SCAN_EVERY_MINUTES:-15}
      # Пакеты капитала (§6). Реже остальных намеренно: состав держится
      # месяцами, а прогон — сотня оптимизаций на каждый вариант. Пересчёт
      # каждые пятнадцать минут не сделал бы состав точнее, а нагрузку
      # поднял бы на порядок.
      SIGNALAI_PORTFOLIO_EVERY_MINUTES: ${SIGNALAI_PORTFOLIO_EVERY_MINUTES:-60}
      # Пустой адрес означает «модели нет», и критик честно называет это
      # блокером. Догадка о запущенном сервисе стоила бы планировщику
      # таймаута на каждом прогоне разведки.
      SIGNALAI_LLM_BASE_URL: ${SIGNALAI_LLM_BASE_URL:-}
      SIGNALAI_LLM_MODEL: ${SIGNALAI_LLM_MODEL:-qwen3.5:4b}
      SIGNALAI_LLM_TIMEOUT_SECONDS: ${SIGNALAI_LLM_TIMEOUT_SECONDS:-180}
      SIGNALAI_LLM_NUM_CTX: ${SIGNALAI_LLM_NUM_CTX:-4096}
    command: ["python", "-m", "app.scheduler"]
    # Проверка здоровья из образа здесь неприменима: она стучится в
    # http://127.0.0.1:8000/health, а у планировщика нет входящих портов по
    # построению. Контейнер поэтому вечно числился «unhealthy» — то есть
    # красный статус не значил ничего и заодно скрывал бы настоящую поломку,
    # случись она. Красное без содержания хуже отсутствия статуса.
    healthcheck:
      disable: true

  # Исполнение вынесено в отдельный контейнер (UX-ТЗ §16.1, §19.1): у него
  # нет входящих портов, и только он видит exec-токены брокеров. Пока движок
  # исполнения не написан, сервис объявлен, но не поднимается (профиль).
  execution:
    build: .
    restart: unless-stopped
    logging: *signalai-bounded-logging
    profiles: ["execution"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SIGNALAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-signalai}
      SIGNALAI_ROLE: execution
    command: ["python", "-m", "app.execution.worker"]

volumes:
  pgdata:
  redisdata:
  # Веса модели переживают пересборку. Иначе каждая выкладка тянула бы
  # несколько гигабайт заново — и первый прогон разведки после деплоя
  # выглядел бы как «модель не отвечает».
  ollama:
