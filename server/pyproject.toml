[project]
name = "signalai-engine"
version = "0.1.0"
description = "SignalAI — инвестиционный и торговый движок (SIGNAL_AI_TRADING_ENGINE_TZ_v1.0)"
requires-python = ">=3.11"

# Версии зафиксированы верхней границей: engine-ТЗ §3 требует lock-файла, а
# движок, который после `pip install -U` начинает считать иначе, непригоден
# для торговли.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=2.0,<3.0",
    "python-dateutil>=2.9,<3.0",
    "redis>=5.2,<9.0",
    # Trading dependency is exact-pinned because its bundled native signer and
    # wire contract are part of the SAI-076 execution safety boundary.
    "lighter-sdk==1.1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
