name: Apply Rosstat live fix

on:
  push:
    branches:
      - fix/4-rosstat-live-reachability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4-rosstat-live-reachability
          fetch-depth: 1
      - name: Apply exact source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          rosstat = Path('server/app/research/adapters/rosstat_prices.py')
          text = rosstat.read_text()

          old = '''import posixpath
          import re
          import xml.etree.ElementTree as ET
          from dataclasses import dataclass
          from datetime import date
          from decimal import Decimal, InvalidOperation
          from html.parser import HTMLParser
          from io import BytesIO
          from urllib.parse import urljoin, urlparse
          from zipfile import BadZipFile, ZipFile
          '''
          new = '''import posixpath
          import re
          import ssl
          import xml.etree.ElementTree as ET
          from dataclasses import dataclass
          from datetime import date
          from decimal import Decimal, InvalidOperation
          from html.parser import HTMLParser
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from zipfile import BadZipFile, ZipFile
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''_ALLOWED_HOSTS = {"rosstat.gov.ru", "www.rosstat.gov.ru"}
          _OKPD2 = re.compile(r"^\\d{2}(?:\\.\\d{1,3}){1,4}$")
          '''
          new = '''_ALLOWED_HOSTS = {"rosstat.gov.ru", "www.rosstat.gov.ru"}
          _CURRENT_WORKBOOK = re.compile(
              r"^Proizvoditeli_Cena_\\d{2}-\\d{4}\\.xlsx$", re.IGNORECASE
          )
          _CA_BUNDLE = Path(__file__).parent / "certs" / "rosstat-russian-trusted-ca.pem"
          _OKPD2 = re.compile(r"^\\d{2}(?:\\.\\d{1,3}){1,4}$")
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''def discover_workbook(html: str) -> str:
              """Return the one exact current XLSX target from Rosstat's price page.

              Similar producer-price datasets are deliberately ignored. If Rosstat
              changes the title or temporarily publishes duplicate exact links, collection
              stops visibly instead of silently feeding the wrong series into SPREAD.
              """
              parser = _Links()
              parser.feed(html)

              matches = {
                  url
                  for href, title in parser.links
                  if title == DATASET_TITLE
                  if (url := _usable_xlsx(href)) is not None
              }
              if not matches:
                  raise DatasetNotFound(DATASET_TITLE)
              if len(matches) != 1:
                  raise AmbiguousDataset(DATASET_TITLE)
              return matches.pop()
          '''
          new = '''def tls_context() -> ssl.SSLContext:
              """Strict trust context for Rosstat's Ministry-issued TLS chain only."""
              return ssl.create_default_context(cafile=str(_CA_BUNDLE))


          def tls_context_for(url: str) -> ssl.SSLContext | None:
              """Return the pinned context only for official Rosstat HTTPS hosts."""
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname not in _ALLOWED_HOSTS:
                  return None
              return tls_context()


          def discover_workbook(html: str) -> str:
              """Return the one exact current producer-price XLSX from the price page.

              Rosstat's current page renders XLSX anchors with an icon-only label, so the
              live contract is the narrow `Proizvoditeli_Cena_MM-YYYY.xlsx` filename.
              The historical exact title remains accepted for compatibility. Any second
              distinct matching URL fails closed instead of guessing which vintage is data.
              """
              parser = _Links()
              parser.feed(html)

              matches: set[str] = set()
              for href, title in parser.links:
                  url = _usable_xlsx(href)
                  if url is None:
                      continue
                  filename = posixpath.basename(urlparse(url).path)
                  if title == DATASET_TITLE or _CURRENT_WORKBOOK.fullmatch(filename):
                      matches.add(url)

              if not matches:
                  raise DatasetNotFound(DATASET_TITLE)
              if len(matches) != 1:
                  raise AmbiguousDataset(DATASET_TITLE)
              return matches.pop()
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    "parse_workbook",
          ]'''
          new = '''    "parse_workbook",
              "tls_context",
              "tls_context_for",
          ]'''
          assert old in text
          text = text.replace(old, new, 1)
          rosstat.write_text(text)

          collector = Path('server/app/research/collector.py')
          text = collector.read_text()
          old = '''def _get(url: str, moment: datetime) -> Fetched | None:
              request = urllib.request.Request(
                  url, headers={"User-Agent": USER_AGENT, "Accept": "*/*"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
                      return Fetched(
          '''
          new = '''def _urlopen(request: urllib.request.Request):
              context = rosstat_prices.tls_context_for(request.full_url)
              if context is None:
                  return urllib.request.urlopen(request, timeout=TIMEOUT)
              return urllib.request.urlopen(request, timeout=TIMEOUT, context=context)


          def _get(url: str, moment: datetime) -> Fetched | None:
              request = urllib.request.Request(
                  url, headers={"User-Agent": USER_AGENT, "Accept": "*/*"}
              )
              try:
                  with _urlopen(request) as response:
                      return Fetched(
          '''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    try:
                  with urllib.request.urlopen(request, timeout=TIMEOUT) as response:
                      return response.read(1024 * 1024).decode("utf-8", errors="replace")
              except Exception:  # noqa: BLE001
          '''
          new = '''    try:
                  with _urlopen(request) as response:
                      return response.read(1024 * 1024).decode("utf-8", errors="replace")
              except Exception:  # noqa: BLE001
          '''
          assert old in text
          text = text.replace(old, new, 1)
          collector.write_text(text)
          PY
      - name: Remove one-shot workflow and push production-only diff
        run: |
          rm .github/workflows/apply-rosstat-live-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/app/research/adapters/rosstat_prices.py server/app/research/collector.py server/app/research/certs/rosstat-russian-trusted-ca.pem .github/workflows/apply-rosstat-live-fix.yml
          git diff --cached --check
          git commit -m 'fix: restore live Rosstat reachability'
          git push origin HEAD:fix/4-rosstat-live-reachability
