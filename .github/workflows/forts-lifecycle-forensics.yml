name: FORTS lifecycle forensics

on:
  push:
    branches:
      - agent/forts-lifecycle-forensics
    paths:
      - .github/workflows/forts-lifecycle-forensics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare read-only SSH access
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$KEY"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_forensics
          chmod 600 ~/.ssh/id_forensics
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect PXU6 and production risk source
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_forensics -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "PRODUCTION_SOURCE_SHA=$(cat "$HOME/signalai/.source_sha" 2>/dev/null || echo missing)"
          cd "$HOME/signalai/server"
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO docker compose --env-file /etc/signalai/.env exec -T api python - <<'PY'
          from datetime import UTC, datetime, timedelta
          from sqlalchemy import select
          from app.db import get_session_factory
          from app.models import Account, Bar, IdeaEvent, Instrument, PaperTrade, RiskSnapshot, TradeIdea
          from app.models.enums import Timeframe

          def val(x):
              return getattr(x, 'value', str(x)) if x is not None else None

          session = get_session_factory()()
          try:
              print('NOW_UTC', datetime.now(UTC).isoformat())
              risk_accounts = list(session.execute(
                  select(Account).where(Account.circuit == 'risk').order_by(Account.synced_at.desc())
              ).scalars())
              print('RISK_ACCOUNTS', [
                  {
                      'id': str(a.id), 'broker': a.broker, 'external_id': a.external_id,
                      'title': a.title, 'currency': a.currency, 'equity': str(a.equity),
                      'free_margin': None if a.free_margin is None else str(a.free_margin),
                      'synced_at': a.synced_at.isoformat() if a.synced_at else None,
                  }
                  for a in risk_accounts
              ])
              snapshots = list(session.execute(
                  select(RiskSnapshot).order_by(RiskSnapshot.taken_at.desc()).limit(5)
              ).scalars())
              print('RISK_SNAPSHOTS', [
                  {
                      'taken_at': r.taken_at.isoformat() if r.taken_at else None,
                      'risk_equity': str(r.risk_equity), 'open_risk': str(r.open_risk),
                      'day_pnl_pct': str(r.day_pnl_pct), 'week_pnl_pct': str(r.week_pnl_pct),
                      'month_pnl_pct': str(r.month_pnl_pct), 'binding': r.binding_limit,
                  }
                  for r in snapshots
              ])

              row = session.execute(
                  select(TradeIdea, Instrument)
                  .join(Instrument, Instrument.instrument_id == TradeIdea.instrument_id)
                  .where(Instrument.symbol == 'PXU6')
                  .order_by(TradeIdea.signal_time.desc())
                  .limit(1)
              ).first()
              if row is None:
                  print('PXU6_NOT_FOUND')
              else:
                  idea, instrument = row
                  exp = idea.explanation_json or {}
                  print('PXU6_IDEA', {
                      'id': str(idea.id), 'instrument_id': idea.instrument_id,
                      'symbol': instrument.symbol, 'title': instrument.title,
                      'status': val(idea.status), 'quality_status': val(idea.quality_status),
                      'was_presented': idea.was_presented, 'presentation_rank': idea.presentation_rank,
                      'signal_time': idea.signal_time.isoformat() if idea.signal_time else None,
                      'expires_at': idea.expires_at.isoformat() if idea.expires_at else None,
                      'score': str(idea.score), 'risk_pct': str(idea.risk_pct),
                      'risk_amount': str(idea.risk_amount), 'quantity': str(idea.quantity),
                      'risk_per_unit': str(idea.risk_per_unit),
                      'entry_low': str(idea.entry_low), 'entry_high': str(idea.entry_high),
                      'entry_reference': str(idea.entry_reference), 'stop': str(idea.stop),
                      'tp1': str(idea.tp1), 'tp2': str(idea.tp2), 'tp3': str(idea.tp3),
                      'admission': exp.get('admission'),
                      'admission_failed': exp.get('admission_failed'),
                      'sizing_note': exp.get('sizing_note'),
                      'binding_limit': exp.get('binding_limit'),
                      'trigger_note': next((x.get('summary') for x in exp.get('timeframes', []) if x.get('role') == 'trigger'), None),
                  })
                  events = list(session.execute(
                      select(IdeaEvent).where(IdeaEvent.idea_id == idea.id).order_by(IdeaEvent.sequence)
                  ).scalars())
                  print('PXU6_EVENTS', [
                      {
                          'seq': e.sequence, 'old': val(e.old_status), 'new': val(e.new_status),
                          'reason': e.reason_code, 'detail': e.reason_detail,
                          'at': e.occurred_at.isoformat() if e.occurred_at else None,
                          'snapshot': e.market_snapshot,
                      }
                      for e in events
                  ])
                  papers = list(session.execute(
                      select(PaperTrade).where(PaperTrade.idea_id == idea.id)
                  ).scalars())
                  print('PXU6_PAPER_COUNT', len(papers))
                  since = idea.signal_time - timedelta(hours=2)
                  bars = list(session.execute(
                      select(Bar)
                      .where(
                          Bar.instrument_id == idea.instrument_id,
                          Bar.timeframe == Timeframe.H1,
                          Bar.is_closed.is_(True),
                          Bar.open_time >= since,
                      )
                      .order_by(Bar.open_time.desc())
                      .limit(12)
                  ).scalars())
                  bars.reverse()
                  print('PXU6_H1', [
                      {
                          't': b.open_time.isoformat(), 'o': str(b.open), 'h': str(b.high),
                          'l': str(b.low), 'c': str(b.close)
                      }
                      for b in bars
                  ])
          finally:
              session.close()
          PY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: shred -u ~/.ssh/id_forensics 2>/dev/null || rm -f ~/.ssh/id_forensics
