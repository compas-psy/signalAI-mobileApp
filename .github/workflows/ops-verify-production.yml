name: Ops verify production after milestone deploy

on:
  push:
    branches:
      - ops/verify-production-db012078-20260814

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_verify
          chmod 600 ~/.ssh/id_verify
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Verify source, universe and scheduler
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_verify -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE=/etc/signalai/.env
          echo "SOURCE_SHA=$(cat "$HOME/signalai/.signalai-source-sha")"
          echo '--- application DB verification ---'
          docker compose --env-file "$ENV_FILE" exec -T api python - <<'PY'
          from sqlalchemy import func, select
          from app.db import session_scope
          from app.models import Instrument
          from app.models.enums import AssetClass

          short = (AssetClass.FUTURES, AssetClass.CRYPTO_PERPETUAL)
          with session_scope() as session:
              totals = session.execute(
                  select(Instrument.venue, Instrument.asset_class, func.count())
                  .where(Instrument.in_universe.is_(True), Instrument.asset_class.in_(short))
                  .group_by(Instrument.venue, Instrument.asset_class)
                  .order_by(Instrument.venue, Instrument.asset_class)
              ).all()
              print('UNIVERSE')
              for venue, asset, count in totals:
                  print(f'{venue.value}|{asset.value}|{count}')

              tradable = session.execute(
                  select(Instrument.venue, Instrument.asset_class, func.count())
                  .where(
                      Instrument.in_universe.is_(True),
                      Instrument.is_tradable.is_(True),
                      Instrument.asset_class.in_(short),
                  )
                  .group_by(Instrument.venue, Instrument.asset_class)
                  .order_by(Instrument.venue, Instrument.asset_class)
              ).all()
              print('TRADABLE')
              for venue, asset, count in tradable:
                  print(f'{venue.value}|{asset.value}|{count}')

              print('SYMBOLS')
              rows = session.execute(
                  select(
                      Instrument.instrument_id,
                      Instrument.symbol,
                      Instrument.in_universe,
                      Instrument.is_tradable,
                  )
                  .where(Instrument.symbol.in_(['GKU6', 'BTCUSDT', 'DOGEUSDT']))
                  .order_by(Instrument.symbol)
              ).all()
              for instrument_id, symbol, in_universe, is_tradable in rows:
                  print(f'{instrument_id}|{symbol}|{in_universe}|{is_tradable}')
          PY
          echo '--- latest scheduler cycle ---'
          docker compose --env-file "$ENV_FILE" logs --tail=220 --no-color scheduler \
            | grep -E 'universe:|ingest:|review:|supervise:|scan:' | tail -20
          REMOTE
      - name: Remove SSH key
        if: always()
        run: shred -u ~/.ssh/id_verify 2>/dev/null || rm -f ~/.ssh/id_verify
