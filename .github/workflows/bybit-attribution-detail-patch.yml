name: Align Bybit rejection detail contract

on:
  push:
    branches:
      - fix/bybit-acceptance-hardening-20260830

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bybit-acceptance-hardening-20260830
          fetch-depth: 1
      - name: Align single-rejection detail
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server/app/scheduler/runner.py')
          text = path.read_text()
          old = '''    stage = "REGIME_REJECTED" if all_regime else "SETUP_REJECTED"\n    return stage, primary_code, " | ".join(parts)\n'''
          new = '''    stage = "REGIME_REJECTED" if all_regime else "SETUP_REJECTED"\n    detail = rows[0].rejection.reason if len(rows) == 1 else " | ".join(parts)\n    return stage, primary_code, detail\n'''
          if old not in text:
              raise SystemExit('rejection detail anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/bybit-attribution-detail-patch.yml
          python3 -m compileall -q server/app
          git diff --check
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'signalai-ci'
          git config user.email 'signalai-ci@users.noreply.github.com'
          git add server/app/scheduler/runner.py .github/workflows/bybit-attribution-detail-patch.yml
          git commit -m 'fix(bybit): preserve human rejection detail'
          git push origin HEAD:fix/bybit-acceptance-hardening-20260830
