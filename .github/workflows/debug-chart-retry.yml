name: Patch chart retry
on:
  push:
    branches: [fix/chart-retry-current-20260814]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-retry-current-20260814
      - name: Patch controller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/state/app_controller.dart')
          s = p.read_text()
          s = s.replace('''    if (failed) {\n      _ideaChartsFailed.remove(key);\n      _chartFailureReason.remove(key);\n      notifyListeners();\n    }\n''', '''    if (failed) {\n      _ideaChartsFailed.remove(key);\n      _chartFailureReason.remove(key);\n    }\n''', 1)
          marker = '    await Future<void>.microtask(() {});\n'
          s = s.replace(marker, marker + '    if (failed) notifyListeners();\n', 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name signalai-ci
          git config user.email actions@users.noreply.github.com
          git add lib/state/app_controller.dart
          git rm .github/workflows/debug-chart-retry.yml
          git commit -m "fix: defer chart retry notification past build"
          git push origin HEAD:fix/chart-retry-current-20260814
