name: Debug chart retry failures

on:
  push:
    branches:
      - fix/chart-retry-current-20260814

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Targeted chart retry tests
        run: flutter test test/idea_chart_controller_retry_test.dart test/idea_chart_retry_test.dart
      - name: Isolate failing test files
        shell: bash
        run: |
          failed=0
          while IFS= read -r file; do
            echo "==> $file"
            if ! flutter test "$file" --reporter compact >/tmp/one-test.log 2>&1; then
              failed=1
              echo "::error file=$file,title=Flutter test file failed::$file"
              echo "--- $file output ---"
              tail -n 120 /tmp/one-test.log
            fi
          done < <(find test -type f -name '*_test.dart' | sort)
          exit "$failed"
