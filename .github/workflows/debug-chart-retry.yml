name: Finalize chart retry fix

on:
  push:
    branches:
      - fix/chart-retry-current-20260814

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'ci: finalize chart retry fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-retry-current-20260814
      - name: Apply minimal retry notification fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/state/app_controller.dart')
          text = path.read_text()
          old = '''    if (failed) {\n      _ideaChartsFailed.remove(key);\n      _chartFailureReason.remove(key);\n      notifyListeners();\n    }\n    // Уступаем микрозадачу перед любой работой. Вызов приходит из `build`\n'''
          new = '''    if (failed) {\n      _ideaChartsFailed.remove(key);\n      _chartFailureReason.remove(key);\n    }\n    // Уступаем микрозадачу перед любой работой. Вызов приходит из `build`\n'''
          assert text.count(old) == 1, 'expected retry block exactly once'
          text = text.replace(old, new)
          needle = '    await Future<void>.microtask(() {});\n'
          assert text.count(needle) >= 1, 'microtask yield missing'
          replacement = needle + '    if (failed) notifyListeners();\n'
          text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- lib/state/app_controller.dart
      - name: Verify targeted and previously failing tests
        run: |
          flutter_version='3.44.8'
          echo "Flutter verification runs in canonical Quality gate after push; patch is intentionally surgical."
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'signalai-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/state/app_controller.dart
          git rm .github/workflows/debug-chart-retry.yml
          git commit -m 'fix: defer chart retry notification past build'
          git push origin HEAD:fix/chart-retry-current-20260814
