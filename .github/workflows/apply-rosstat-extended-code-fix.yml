name: Apply Rosstat extended-code fix

on:
  push:
    branches:
      - fix/4-rosstat-live-reachability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4-rosstat-live-reachability
          fetch-depth: 1
      - name: Apply exact parser fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('server/app/research/adapters/rosstat_live_prices.py')
          text = live.read_text()
          old = '''    if not _OKPD2.fullmatch(okpd2):
                  raise WorkbookSchemaError(f"invalid live Rosstat OKPD2: {okpd2!r}")
              raw_name = _at(row, header.name_col).strip()
          '''
          new = '''    if not _OKPD2.fullmatch(okpd2):
                  # Rosstat also publishes source-specific extended identifiers such as
                  # `05.10.10.101.АГ` in the same column. They are not valid base OKPD2
                  # identities for this research model, so ignore them instead of
                  # translating or letting an unrelated row block the workbook.
                  return None
              raw_name = _at(row, header.name_col).strip()
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        if okpd2:
                      if not _OKPD2.fullmatch(okpd2):
                          raise WorkbookSchemaError(f"invalid live Rosstat OKPD2: {okpd2!r}")
                      okei = units.get(okpd2)
          '''
          new = '''        if okpd2:
                      if not _OKPD2.fullmatch(okpd2):
                          pending_regional_product = None
                          continue
                      okei = units.get(okpd2)
          '''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          live.write_text(text)

          prices = Path('server/app/research/adapters/rosstat_prices.py')
          text = prices.read_text()
          old = '''        raise WorkbookSchemaError(
                      "Rosstat workbook has no supported OKPD2 producer-price monthly layout"
                  )'''
          new = '''        raise WorkbookSchemaError(
                      "Rosstat workbook has no supported ОКПД2/OKPD2 producer-price monthly layout"
                  )'''
          assert text.count(old) == 1
          prices.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow and push surgical fix
        run: |
          rm .github/workflows/apply-rosstat-extended-code-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/app/research/adapters/rosstat_live_prices.py server/app/research/adapters/rosstat_prices.py .github/workflows/apply-rosstat-extended-code-fix.yml
          git diff --cached --check
          git commit -m 'fix: skip unsupported Rosstat extended product codes'
          git push origin HEAD:fix/4-rosstat-live-reachability
