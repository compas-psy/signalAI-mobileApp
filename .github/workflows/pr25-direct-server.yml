name: PR25 direct server gate

on:
  pull_request:
    branches: [claude/release-y40hk5]
    paths:
      - server/**
      - .github/workflows/pr25-direct-server.yml

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalai
          POSTGRES_PASSWORD: signalai_local_dev
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U signalai -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen --extra test
      - name: Compile and import
        env:
          SIGNALAI_DATABASE_URL: postgresql+psycopg://signalai:signalai_local_dev@127.0.0.1:5432/postgres
          SIGNALAI_DEVICE_TOKEN: ci-device-token
        run: |
          .venv/bin/python -m compileall -q app alembic
          .venv/bin/python -c 'from app.main import app; assert app is not None'
      - name: Migration parity
        env:
          SIGNALAI_DATABASE_URL: postgresql+psycopg://signalai:signalai_local_dev@127.0.0.1:5432/postgres
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
      - name: Tests
        env:
          SIGNALAI_ADMIN_DSN: postgresql+psycopg://signalai:signalai_local_dev@127.0.0.1:5432/postgres
          SIGNALAI_DEVICE_TOKEN: ci-device-token
        run: .venv/bin/python -m pytest
