name: Apply Control carry UI

on:
  push:
    branches:
      - fix/bybit-carry-acceptance-20260831
    paths:
      - .github/workflows/apply-control-carry-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply narrow metric-aware patch
        run: python scripts/apply_control_carry_ui.py
      - run: flutter pub get
      - name: Control carry acceptance
        run: flutter test test/control_bybit_transparency_acceptance_test.dart
      - name: Analyzer guard
        run: flutter analyze
      - name: Commit GREEN implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/screens/server_control_screen.dart
          git diff --cached --check
          git commit -m "fix(control): render carry evidence in bps"
          git push origin HEAD:fix/bybit-carry-acceptance-20260831
