name: Dispatch source-bundle VPS deployment

on:
  pull_request:
    branches:
      - claude/ux-prototype-dark-theme-sv0euq
    types:
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.head_ref == 'codex/thin-client-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical deploy for verified source-bundle SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ff8aa1f57642d2b547633af31fe4a2bf150d1af8
        run: |
          set -euo pipefail
          gh workflow run deploy-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/thin-client-v1 \
            -f source_ref="$SOURCE_SHA"
          echo "Dispatched canonical deploy for $SOURCE_SHA"
