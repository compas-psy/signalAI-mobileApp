name: Temporary sideload dispatch bridge

on:
  push:
    branches:
      - 'sideload-run-*'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch verified sideload build
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-sideload.yml',
              ref: 'claude/release-y40hk5',
              inputs: {
                source_ref: '73aa8b8b0c946c60a5d0cb06a2e4234885e76256',
                api_base_url: '',
                backup_api_base_url: '',
                mode: 'thin',
              },
            });
            core.notice('Dispatched sideload for 73aa8b8b0c946c60a5d0cb06a2e4234885e76256');
