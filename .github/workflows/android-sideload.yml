name: Android sideload APK
run-name: Sideload · ${{ inputs.source_ref || github.ref_name }}

# Personal delivery channel.  It is intentionally not triggered by ordinary
# pushes: the stable download URL must never start pointing at an arbitrary
# intermediate commit.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact branch, tag or commit to build (required; shown in release metadata)'
        required: true
        type: string
      api_base_url:
        description: 'Engine URL (empty = repository secret or production default)'
        required: false
        default: ''
        type: string
      mode:
        description: 'thin = server ideas, paper lifecycle and background work; demo = UI fixtures'
        required: true
        default: thin
        type: choice
        options:
          - thin
          - demo
  push:
    tags:
      - 'sideload-*'

# There is one mutable sideload channel.  Two builds must not race to replace
# the same release asset, even when they originate from different refs.
concurrency:
  group: signalai-sideload-publish
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  resolve:
    name: Resolve source ref once
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      short_sha: ${{ steps.source.outputs.short_sha }}
      safe_ref: ${{ steps.source.outputs.safe_ref }}
      display_ref: ${{ steps.source.outputs.display_ref }}
      requested_ref: ${{ steps.source.outputs.requested_ref }}
    steps:
      - name: Reject an empty source ref
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
        run: |
          test -n "$REQUESTED_REF" || {
            echo '::error::source_ref must not be empty'
            exit 1
          }
      - name: Check out the explicitly selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          fetch-depth: 1

      - name: Resolve immutable source identity
        id: source
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}
          DISPLAY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref_name }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD^{commit})"
          short_sha="$(git rev-parse --short=12 HEAD)"
          safe_ref="$(printf '%s' "$DISPLAY_REF" \
            | tr -cs 'A-Za-z0-9._-' '-' \
            | sed 's/^-*//; s/-*$//' \
            | cut -c1-48)"
          test -n "$safe_ref" || safe_ref=detached

          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$source_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag resolved to $source_sha, but the event points to $GITHUB_SHA"
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "safe_ref=$safe_ref" >> "$GITHUB_OUTPUT"
          echo "display_ref=$DISPLAY_REF" >> "$GITHUB_OUTPUT"
          echo "requested_ref=$REQUESTED_REF" >> "$GITHUB_OUTPUT"

          {
            echo '### Sideload source'
            echo
            echo "- requested ref: \`$REQUESTED_REF\`"
            echo "- resolved commit: \`$source_sha\`"
            echo "- workflow definition: \`$GITHUB_WORKFLOW_REF\`"
            echo '- QA and APK receive this exact commit SHA.'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality gate for selected ref
    needs: resolve
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_sha }}

  build:
    name: Signed APK and provenance
    needs:
      - resolve
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the immutable source verified by QA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify checked-out provenance
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::QA verified $EXPECTED_SHA, but build checked out $actual_sha"
            exit 1
          fi
          echo "Building QA-verified commit $actual_sha"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      # A cache is not a signing-key backup.  Use the dedicated SIDELOAD_*
      # secrets when sideload and Play should have different identities; the
      # existing ANDROID_* secrets remain a compatible fallback for installs
      # already signed by the release key.  Missing or partial secrets fail.
      - name: Restore permanent signing identity
        env:
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077

          if [ -n "$SIDELOAD_KEYSTORE_BASE64$SIDELOAD_KEYSTORE_PASSWORD$SIDELOAD_KEY_PASSWORD$SIDELOAD_KEY_ALIAS" ]; then
            KEYSTORE_BASE64="$SIDELOAD_KEYSTORE_BASE64"
            STORE_PASSWORD="$SIDELOAD_KEYSTORE_PASSWORD"
            KEY_PASSWORD="$SIDELOAD_KEY_PASSWORD"
            KEY_ALIAS="$SIDELOAD_KEY_ALIAS"
            secret_family=SIDELOAD
          else
            KEYSTORE_BASE64="$RELEASE_KEYSTORE_BASE64"
            STORE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            secret_family=ANDROID
          fi

          missing=''
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing keystore"
          [ -n "$STORE_PASSWORD" ] || missing="$missing store-password"
          [ -n "$KEY_PASSWORD" ] || missing="$missing key-password"
          [ -n "$KEY_ALIAS" ] || missing="$missing alias"
          if [ -n "$missing" ]; then
            echo "::error::Permanent $secret_family signing secrets are incomplete:$missing"
            echo "Configure the complete SIDELOAD_KEYSTORE_* set (preferred) or the complete ANDROID_KEYSTORE_* set."
            echo "An Actions cache or a generated debug key is never used as signing identity."
            exit 1
          fi

          keystore="${RUNNER_TEMP}/signalai-sideload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          cat > android/key.properties <<PROPERTIES
          storeFile=$keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build APK without a compiled bearer token
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.SIGNALAI_API_BASE_URL || 'https://api.ilyamartynov.ru' }}
          MODE: ${{ inputs.mode || 'thin' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            thin)
              [ -n "$API_BASE_URL" ] || {
                echo "::error::Engine URL is required for a thin APK."
                exit 1
              }
              ;;
            demo)
              echo "::warning::Demo APK uses fixtures and must not be used for trading."
              ;;
            *)
              echo "::error::Unsupported delivery mode '$MODE'. Personal builds allow only thin or demo."
              exit 1
              ;;
          esac

          # Never add SIGNALAI_DEVICE_TOKEN here.  Dart defines are plaintext
          # inside the APK; device authorization is provisioned at runtime.
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=SIGNALAI_MODE="$MODE" \
            --dart-define=SIGNALAI_API_BASE_URL="$API_BASE_URL"

      - name: Verify signer and prepare traceable artifacts
        id: artifact
        env:
          SOURCE_REF: ${{ needs.resolve.outputs.display_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
          SAFE_REF: ${{ needs.resolve.outputs.safe_ref }}
          MODE: ${{ inputs.mode || 'thin' }}
        run: |
          set -euo pipefail
          source_apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$source_apk"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -r | head -1)"
          test -n "$apksigner"
          signer="$($apksigner verify --verbose --print-certs "$source_apk")"
          printf '%s\n' "$signer"
          if printf '%s\n' "$signer" | grep -q 'CN=Android Debug'; then
            echo "::error::APK was signed with the debug key"
            exit 1
          fi
          signer_sha256="$(printf '%s\n' "$signer" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -1)"
          test -n "$signer_sha256"

          stable_apk=signalai-sideload.apk
          exact_apk="signalai-sideload-${SAFE_REF}-${SHORT_SHA}.apk"
          cp "$source_apk" "$stable_apk"
          cp "$source_apk" "$exact_apk"
          apk_sha256="$(sha256sum "$stable_apk" | awk '{print $1}')"

          export SOURCE_REF SOURCE_SHA SHORT_SHA MODE signer_sha256 apk_sha256 exact_apk
          python3 - <<'PY'
          import json
          import os
          from datetime import UTC, datetime

          metadata = {
              "schema_version": 1,
              "channel": "sideload",
              "source_ref": os.environ["SOURCE_REF"],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_sha_is_authoritative": True,
              "source_ref_is_advisory": True,
              "source_short_sha": os.environ["SHORT_SHA"],
              "mode": os.environ["MODE"],
              "server_runtime_required": os.environ["MODE"] == "thin",
              "local_scanner_enabled": False,
              "paper_lifecycle_owner": "server" if os.environ["MODE"] == "thin" else "fixture",
              "bearer_token_compiled": False,
              "build_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "built_at": datetime.now(UTC).isoformat(),
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "run_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
              "stable_apk": "signalai-sideload.apk",
              "traceable_apk": os.environ["exact_apk"],
              "apk_sha256": os.environ["apk_sha256"],
              "signer_certificate_sha256": os.environ["signer_sha256"],
          }
          with open("signalai-sideload.json", "w", encoding="utf-8") as output:
              json.dump(metadata, output, ensure_ascii=False, indent=2)
              output.write("\n")
          PY

          echo "exact_apk=$exact_apk" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$signer_sha256" >> "$GITHUB_OUTPUT"

          {
            echo
            echo "- APK SHA-256: \`$apk_sha256\`"
            echo "- signer SHA-256: \`$signer_sha256\`"
            echo "- traceable asset: \`$exact_apk\`"
            echo "- mode: \`$MODE\` (local scanner disabled)"
            echo '- bearer token compiled: `false`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish stable sideload channel
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ needs.resolve.outputs.display_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          EXACT_APK: ${{ steps.artifact.outputs.exact_apk }}
          APK_SHA256: ${{ steps.artifact.outputs.apk_sha256 }}
          SIGNER_SHA256: ${{ steps.artifact.outputs.signer_sha256 }}
          MODE: ${{ inputs.mode || 'thin' }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Personal sideload channel. The stable APK link is preserved and points to this exact build.

          - authoritative source commit: \`$SOURCE_SHA\`
          - requested ref (advisory label only): \`$SOURCE_REF\`
          - mode: \`$MODE\`
          - APK SHA-256: \`$APK_SHA256\`
          - signer SHA-256: \`$SIGNER_SHA256\`
          - bearer token compiled into APK: \`false\`
          - workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Delivery modes are restricted to `thin` and UI-only `demo`; legacy `local`
          cannot be selected. In `thin`, ideas, paper lifecycle and background work run
          on the server, and the local scanner is disabled.

          Install the stable asset \`signalai-sideload.apk\`, or use \`$EXACT_APK\`
          when the source identity must also be visible in the filename.
          The mutable \`sideload\` release tag is only a channel pointer; the source SHA above is the source of truth.
          NOTES

          if gh release view sideload >/dev/null 2>&1; then
            gh release edit sideload \
              --prerelease \
              --title 'SignalAI sideload' \
              --notes-file release-notes.md
          else
            gh release create sideload \
              --target "$SOURCE_SHA" \
              --prerelease \
              --title 'SignalAI sideload' \
              --notes-file release-notes.md
          fi
          gh release upload sideload \
            signalai-sideload.apk \
            "$EXACT_APK" \
            signalai-sideload.json \
            --clobber

      - name: Upload short-lived Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: signalai-sideload-${{ needs.resolve.outputs.safe_ref }}-${{ needs.resolve.outputs.short_sha }}
          path: |
            signalai-sideload.apk
            ${{ steps.artifact.outputs.exact_apk }}
            signalai-sideload.json
          retention-days: 3

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties
          shred -u "${RUNNER_TEMP}/signalai-sideload.jks" 2>/dev/null \
            || rm -f "${RUNNER_TEMP}/signalai-sideload.jks"
