name: Android sideload APK

# Быстрая сборка APK «поставить себе на телефон» — без keystore и без секретов.
#
# Зачем отдельно от android-release.yml: тот намеренно падает без ключа подписи,
# потому что релизный артефакт обязан быть подписан своим ключом. Здесь задача
# другая — получить рабочий APK сразу, ничего предварительно не настраивая.
#
# Подпись отладочная (см. fallback в android/app/build.gradle.kts). Отсюда два
# последствия, о которых надо знать заранее:
#   * при установке Android покажет предупреждение Play Protect — его можно
#     пропустить («Всё равно установить»);
#   * applicationId тот же (ru.signalai.app), поэтому поставить сверху нормально
#     подписанный релиз не выйдет — сначала удалить эту сборку.
#
# Для Play Console и для раздачи кому-то ещё — только android-release.yml.

# Сборка по требованию, а не на каждый коммит.
#
# Раньше стоял push на любую ветку. Получалось так: APK нужен изредка, а
# прогон запускался на каждый промежуточный коммит — и когда раннеры
# недоступны, каждый такой коммит рисует красный крест, за которым нет ни
# одной строки логов. Красное без содержания хуже отсутствия статуса: оно
# приучает не смотреть на статусы вообще.
#
# Теперь APK собирается тогда, когда за ним пришли: кнопкой «Run workflow»
# в Actions либо тегом. Промежуточные коммиты проверяются локально —
# flutter analyze, flutter test и tool/build_apk.sh.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Адрес движка (пусто — возьмётся секрет SIGNALAI_API_BASE_URL)'
        required: false
        default: ''
      mode:
        # Идеи считает движок (§18); на устройстве они не собираются. Значит
        # без адреса движка лента пуста по построению — и посмотреть на ней
        # нечего, даже когда сам интерфейс готов. Демо-режим существует ровно
        # для этого случая: данные макета, без сети и без сервера. Сборка
        # называет себя полосой «ДЕМО» на каждом экране — выдуманные уровни
        # обязаны быть отличимы от рыночных.
        description: 'Данные: local — считает устройство, demo — макет (для просмотра интерфейса)'
        required: false
        default: local
        type: choice
        options: [local, demo, server]
  push:
    tags:
      - 'sideload-*'

# Пуш поверх незавершённого прогона отменяет предыдущий: артефакт нужен от
# последнего коммита, а не от всех подряд.
#
# ВНИМАНИЕ ТОМУ, КТО ПУШИТ. Сборка занимает 7–8 минут. Пуш раньше — и
# предыдущий прогон умирает, не доехав до APK. 29 июля так подряд погибли
# шесть прогонов: пушили каждые 4–8 минут, артефакта не получилось ни разу,
# а минуты аккаунта сгорели все. Правило простое: накопить изменения и
# запушить один раз, потом ждать. Хотите промежуточную проверку — она
# делается локально: flutter analyze, flutter test и сборка под веб.
concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write — для публикации APK в pre-release «sideload»:
    # квота хранилища артефактов Actions на аккаунте исчерпана, а ассеты
    # релизов в неё не входят.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # key.properties в .gitignore — в репозитории его быть не должно никогда.
      # Проверка на случай, если файл окажется там по ошибке: это утечка ключа.
      - name: Проверка, что ключа подписи в репозитории нет
        run: |
          if [ -f android/key.properties ]; then
            echo "::error::android/key.properties в репозитории — приватный ключ подписи утёк в git"
            exit 1
          fi

      # Ключ подписи обязан быть одним и тем же от сборки к сборке.
      #
      # Раньше его не было вовсе, и Gradle уходил на отладочный ключ. Отладочный
      # keystore создаётся заново на каждом раннере, то есть каждая сборка была
      # подписана ДРУГИМ ключом — Android отказывается ставить такую поверх
      # предыдущей, и приложение приходилось удалять вместе со всеми данными:
      # журналом сделок, настройками и скачанной историей свечей.
      #
      # Кэш Actions привязан к ветке и вытесняется после недели простоя. Если
      # он потеряется, ключ сгенерируется заново и обновление снова упрётся —
      # поэтому постоянное решение это секреты (см. docs/ANDROID_SIGNING.md):
      # заданы ANDROID_KEYSTORE_* — берём их и кэш не трогаем.
      # Проверка секрета вынесена в шаг: контекст secrets в step-level `if`
      # доступен не на всех версиях раннера, а выход шага — всегда.
      - name: Есть ли постоянный ключ в секретах
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "from_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "from_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Кэш ключа подписи sideload
        if: steps.signing.outputs.from_secrets == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.signalai-sideload
          key: sideload-keystore-v1

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          KEY_DIR="${HOME}/.signalai-sideload"
          KEYSTORE="${KEY_DIR}/sideload.jks"

          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "Подпись из секретов репозитория."
            mkdir -p "${KEY_DIR}"
            echo "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"
            STORE_PASS="${STORE_PASSWORD}"
            KEY_PASS="${KEY_PASSWORD}"
            ALIAS="${KEY_ALIAS}"
          else
            # Пароль постоянный и несекретный намеренно: он защищает не ключ, а
            # файл, и лежит ровно там же, где файл. Смысл этого ключа один —
            # непрерывность обновлений; для Play Console нужен настоящий,
            # заведённый через секреты.
            STORE_PASS="sideload"
            KEY_PASS="sideload"
            ALIAS="sideload"
            if [ -f "${KEYSTORE}" ]; then
              echo "Ключ восстановлен из кэша — обновление встанет поверх."
            else
              echo "::warning::Ключа sideload не было, создаю новый. Эту сборку придётся ставить с удалением предыдущей — один раз. Чтобы ключ не терялся, задайте секреты ANDROID_KEYSTORE_* (docs/ANDROID_SIGNING.md)."
              mkdir -p "${KEY_DIR}"
              keytool -genkeypair -v \
                -keystore "${KEYSTORE}" \
                -storepass "${STORE_PASS}" -keypass "${KEY_PASS}" \
                -alias "${ALIAS}" \
                -keyalg RSA -keysize 4096 -validity 10000 \
                -dname "CN=SignalAI Sideload, OU=Personal, O=SignalAI, C=RU"
            fi
          fi

          cat > android/key.properties <<PROPS
          storeFile=${KEYSTORE}
          storePassword=${STORE_PASS}
          keyAlias=${ALIAS}
          keyPassword=${KEY_PASS}
          PROPS

      - name: Сборка APK
        # Номер версии растёт с каждой сборкой: установка поверх всегда
        # выглядит обновлением, а не переустановкой той же версии — у части
        # прошивок «та же версия» вызывает лишние вопросы установщика.
        #
        # Адрес движка передаётся в сборку. Без него приложение показывает
        # «движок не ответил» и не может показать ни одной идеи: считает их
        # сервер (§18), а адрес зашивается на этапе сборки, чтобы ни его, ни
        # токен устройства не лежало в репозитории.
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.SIGNALAI_API_BASE_URL }}
          DEVICE_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
          MODE: ${{ inputs.mode || 'local' }}
        run: |
          echo "Режим данных: ${MODE}"
          if [ "$MODE" = "demo" ]; then
            echo "::warning::Демо-сборка: данные из макета, не с рынка. Для просмотра интерфейса, не для торговли."
          elif [ -z "$API_BASE_URL" ]; then
            echo "::warning::Адрес движка не задан — APK соберётся, но идей не покажет."
            echo "Задайте секрет SIGNALAI_API_BASE_URL либо параметр api_base_url."
          else
            # Значение не печатается: адрес не тайна, но и в логах публичного
            # репозитория ему делать нечего.
            echo "Адрес движка задан (${#API_BASE_URL} символов)."
          fi
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SIGNALAI_MODE="$MODE" \
            --dart-define=SIGNALAI_API_BASE_URL="$API_BASE_URL" \
            --dart-define=SIGNALAI_DEVICE_TOKEN="$DEVICE_TOKEN"

      # Отпечаток ключа печатается в лог намеренно: если он вдруг изменился,
      # обновление поверх не встанет — и это видно здесь, а не на телефоне.
      - name: Кто подписал APK
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          rm -f android/key.properties

      # Основной канал доставки — pre-release «sideload»: квота хранилища
      # артефактов Actions на аккаунте исчерпана (пересчёт у GitHub раз в
      # 6–12 часов), а ассеты релизов в неё не входят. Тег один и тот же,
      # APK перезаписывается — свежая сборка всегда по стабильной ссылке
      # releases/tag/sideload.
      - name: Публикация APK в pre-release «sideload»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk signalai-sideload.apk
          gh release view sideload >/dev/null 2>&1 || \
            gh release create sideload \
              --prerelease \
              --title "SignalAI sideload" \
              --notes "Автосборка с последнего пуша. Подпись постоянная: свежая сборка ставится поверх предыдущей, данные приложения сохраняются. Play Protect может предупредить при установке — сборка не из Google Play, это ожидаемо."
          gh release upload sideload signalai-sideload.apk --clobber

      # Артефакт Actions оставлен как запасной канал: пока квота не
      # пересчитана, шаг падает — на итог прогона не влияет.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: signalai-sideload-apk
          path: signalai-sideload.apk
          # Короткий срок: это сборка «поставить и посмотреть», а место под
          # артефакты на аккаунте общее и кончается быстро.
          retention-days: 3
