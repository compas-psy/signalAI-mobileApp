name: Deploy server package
run-name: Server package · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact branch, tag or commit to deploy'
        required: true
        type: string

concurrency:
  group: signalai-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve requested source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - id: source
        name: Pin source to immutable commit
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD^{commit})"
          test "${#source_sha}" -eq 40
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Deploy source: $source_sha" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality gate before code mutation
    needs: resolve
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_sha }}

  deploy:
    name: Package server source and update VPS
    needs: [resolve, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify immutable source and package server
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_SHA"
          test -f server/docker-compose.yml
          tar -czf /tmp/signalai-server.tar.gz server
          test -s /tmp/signalai-server.tar.gz

      - name: Validate secrets and prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 }}
          DEVICE_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo '::error::VPS host is missing'; exit 1; }
          test -n "$KEY" || { echo '::error::VPS SSH key is missing'; exit 1; }
          test -n "$HOST_KEY_SHA256" || { echo '::error::VPS_SSH_HOST_KEY_SHA256 is missing'; exit 1; }
          test -n "$DEVICE_TOKEN" || { echo '::error::SIGNALAI_DEVICE_TOKEN is missing'; exit 1; }
          [ "${#DEVICE_TOKEN}" -ge 32 ] || { echo '::error::device token too short'; exit 1; }
          case "$DEVICE_TOKEN" in
            *[!A-Za-z0-9._~-]*) echo '::error::device token must be URL-safe'; exit 1 ;;
          esac
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"
          printf '%s' "$DEVICE_TOKEN" | base64 -w0 > /tmp/signalai-device-token.b64

      - name: Copy verified source package to VPS
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            /tmp/signalai-server.tar.gz \
            /tmp/signalai-device-token.b64 \
            "$USER_NAME@$HOST:/tmp/"

      - name: Build, migrate, restart and verify
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_SOURCE_SHA='$SOURCE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="${SIGNALAI_SOURCE_SHA:?source sha required}"
          ROOT="$HOME/signalai"
          NEXT="$HOME/signalai-server-next"
          PREV="$HOME/signalai-server-prev"
          ENV_FILE='/etc/signalai/.env'
          TOKEN_FILE='/tmp/signalai-device-token.b64'
          PACKAGE='/tmp/signalai-server.tar.gz'
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo

          test -s "$PACKAGE"
          test -s "$TOKEN_FILE"
          mkdir -p "$ROOT"
          rm -rf "$NEXT"
          mkdir -p "$NEXT"
          tar -xzf "$PACKAGE" -C "$NEXT"
          test -f "$NEXT/server/docker-compose.yml"

          token="$(base64 -d < "$TOKEN_FILE")"
          $SUDO sed -i '/^SIGNALAI_DEVICE_TOKEN=/d' "$ENV_FILE"
          printf 'SIGNALAI_DEVICE_TOKEN=%s\n' "$token" | $SUDO tee -a "$ENV_FILE" >/dev/null
          unset token
          $SUDO chmod 600 "$ENV_FILE"
          rm -f "$TOKEN_FILE" "$PACKAGE"

          rm -rf "$PREV"
          if [ -d "$ROOT/server" ]; then
            mv "$ROOT/server" "$PREV"
          fi
          mv "$NEXT/server" "$ROOT/server"
          rm -rf "$NEXT"
          printf '%s\n' "$SOURCE_SHA" > "$ROOT/.source_sha"

          $SUDO bash "$ROOT/server/deploy/ensure_runtime_secrets.sh" "$ENV_FILE"
          cd "$ROOT/server"
          echo '── build new images ──'
          $SUDO docker compose --env-file "$ENV_FILE" build api scheduler </dev/null
          echo '── migrate ──'
          $SUDO docker compose --env-file "$ENV_FILE" run --rm -T api alembic upgrade head </dev/null
          echo '── restart ──'
          $SUDO docker compose --env-file "$ENV_FILE" up -d </dev/null
          echo '── containers ──'
          $SUDO docker compose --env-file "$ENV_FILE" ps </dev/null

          echo '── wait for health ──'
          ok=0
          for _ in $(seq 1 18); do
            if curl -fsS --max-time 10 http://127.0.0.1:8000/health > /tmp/signalai-health.json; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo 'health check failed' >&2; exit 1; }
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/signalai-health.json'))
          assert h.get('status') == 'ok', h
          assert h.get('database') == 'ok', h
          print('health:', h.get('status'), 'paper_only:', h.get('paper_only'), 'kill_switch:', h.get('kill_switch'))
          PY

          actual="$(cat "$ROOT/.source_sha")"
          [ "$actual" = "$SOURCE_SHA" ] || { echo "source receipt mismatch $actual" >&2; exit 1; }
          echo "deployed source: $actual"

          # Reconcile Portfolio → Signals immediately after deployment using
          # the same fresh-closed-D1 policy as the scheduler. This avoids both
          # a first-open wait and an accidental stale same-day rebuild.
          echo '── reconcile equity ranking ──'
          $SUDO docker compose --env-file "$ENV_FILE" run --rm -T api \
            python -c "from app.db import get_session_factory; from app.portfolio.equity_ranking_refresh import refresh; s=get_session_factory()(); print(refresh(s)); s.commit(); s.close()" </dev/null \
            || echo '::warning::equity ranking reconciliation failed; scheduler will retry'

          echo '── scheduler tail ──'
          $SUDO docker compose --env-file "$ENV_FILE" logs --tail 30 scheduler </dev/null || true
          rm -rf "$PREV"
          REMOTE

      - name: Cleanup sensitive material
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          shred -u /tmp/signalai-device-token.b64 2>/dev/null || rm -f /tmp/signalai-device-token.b64
          rm -f /tmp/signalai-server.tar.gz
