name: Recover short-term admission and scan

on:
  push:
    branches:
      - ops/verify-forts-hotfix-20260814

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_recover
          chmod 600 ~/.ssh/id_recover
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Re-run short-term admission and one scan
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_recover -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE='/etc/signalai/.env'
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'
          $SUDO docker compose --env-file "$ENV_FILE" exec -T scheduler python - <<'PY'
          from sqlalchemy import select
          from app.db import get_session_factory
          from app.market.universe import review_universe
          from app.models import Instrument
          from app.models.enums import AssetClass
          from app.pipeline.scan import scan

          short = {AssetClass.FUTURES, AssetClass.CRYPTO_PERPETUAL}
          session = get_session_factory()()
          try:
              # review_universe currently also traverses investment instruments.
              # Preserve their state exactly: this incident recovery is allowed
              # to change only the short-term FORTS/crypto admission flags.
              preserved = {
                  row.instrument_id: (
                      row.is_tradable,
                      row.universe_note,
                      dict(row.metadata_json or {}),
                  )
                  for row in session.execute(
                      select(Instrument).where(Instrument.in_universe.is_(True))
                  ).scalars()
                  if row.asset_class not in short
              }

              report = review_universe(session)
              for instrument_id, (tradable, note, metadata) in preserved.items():
                  row = session.get(Instrument, instrument_id)
                  if row is not None:
                      row.is_tradable = tradable
                      row.universe_note = note
                      row.metadata_json = metadata
              session.commit()

              rows = list(session.execute(
                  select(Instrument).where(
                      Instrument.in_universe.is_(True),
                      Instrument.asset_class.in_(list(short)),
                  )
              ).scalars())
              futures = [x for x in rows if x.asset_class is AssetClass.FUTURES and x.is_tradable]
              crypto = [x for x in rows if x.asset_class is AssetClass.CRYPTO_PERPETUAL and x.is_tradable]
              print(f'admission_checked={report.checked} shortterm_tradable={len(futures)+len(crypto)} futures={len(futures)} crypto={len(crypto)}')
              print('FORTS=' + ','.join(sorted(x.instrument_id for x in futures)))
              print('CRYPTO=' + ','.join(sorted(x.instrument_id for x in crypto)))

              result = scan(session)
              session.commit()
              print(f'scan_scanned={result.scanned} produced={result.produced} skipped={len(result.skipped)} rejections={len(result.rejections)}')
          except Exception:
              session.rollback()
              raise
          finally:
              session.close()
          PY
          REMOTE
