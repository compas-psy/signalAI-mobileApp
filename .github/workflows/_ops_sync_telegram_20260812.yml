name: OPS · send historical Telegram idea

on:
  pull_request:
    branches: [claude/release-y40hk5]

permissions:
  contents: read

concurrency:
  group: signalai-production-deploy
  cancel-in-progress: false

jobs:
  send-example:
    if: github.head_ref == 'ops/sync-telegram-20260812'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        run: |
          set -euo pipefail
          [ -n "$HOST" ] && [ -n "$KEY" ]
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Send one expired idea through production Telegram formatter
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHA='0484a46efe92877bbb8e16abf68bb12b16af0c42'
          DIR="$HOME/signalai"
          ENV_FILE='/etc/signalai/.env'
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'
          [ "$(cat "$DIR/.signalai-source-sha")" = "$EXPECTED_SHA" ]
          cd "$DIR/server"
          $SUDO docker compose --env-file "$ENV_FILE" exec -T scheduler python - <<'PY'
          from datetime import UTC, datetime
          from sqlalchemy import select
          from app.db import get_session_factory
          from app.models import TradeIdea
          from app.notification_outbox import NotificationEvent
          from app.telegram_chart import render_idea_chart
          from app.telegram_notifications import _send_idea

          session = get_session_factory()()
          try:
              ideas = session.execute(
                  select(TradeIdea)
                  .where(TradeIdea.expires_at <= datetime.now(UTC))
                  .order_by(TradeIdea.signal_time.desc())
                  .limit(100)
              ).scalars()
              for idea in ideas:
                  try:
                      render_idea_chart(session, idea)
                  except RuntimeError:
                      continue
                  event = NotificationEvent(
                      id=0,
                      created_at=datetime.now(UTC),
                      key=f'test:historical:{idea.id}',
                      kind='IDEA',
                      title='Historical idea test',
                      body='',
                      payload=f'idea:{idea.id}',
                  )
                  _send_idea(session, event)
                  print(
                      'TELEGRAM_HISTORICAL_IDEA_SENT '
                      f'idea={idea.id} status={idea.status} signal_time={idea.signal_time.isoformat()}'
                  )
                  break
              else:
                  raise RuntimeError('no expired idea with H1 chart found')
          finally:
              session.close()
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
