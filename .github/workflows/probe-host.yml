name: Проверить доступность сервера

# Разведка перед развёртыванием: доходит ли раннер GitHub до сервера.
#
# Секретов не требует и ничего не меняет. Адрес передаётся параметром, а не
# секретом: IP сервера не тайна, он и так виден любому, кто откроет сайт.
#
# Смысл в том, что Codespaces и Actions живут в разных сетях. Блокировка
# одной из них ничего не говорит о другой, а гадать об этом дороже, чем
# проверить за минуту.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'IP или домен сервера'
        required: true
      ports:
        description: 'Порты через пробел'
        required: false
        default: '22 80 443'

concurrency:
  group: probe-host
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Откуда идёт проверка
        run: |
          echo "Адрес раннера: $(curl -s --max-time 10 https://api.ipify.org || echo 'определить не удалось')"
          echo "Это понадобится, если сервер пускает только доверенные адреса."

      - name: Имя и адрес
        env:
          HOST: ${{ inputs.host }}
        run: |
          # Если передали домен — покажем, во что он разрешается. Расхождение
          # с ожидаемым адресом объясняет ситуацию быстрее любых догадок.
          if printf '%s' "$HOST" | grep -qE '^[0-9.]+$'; then
            echo "Передан IP-адрес: $HOST"
          else
            echo "Домен: $HOST"
            getent hosts "$HOST" || echo "имя не разрешается"
            echo "--- полный ответ DNS ---"
            timeout 15 getent ahosts "$HOST" || true
          fi

      - name: Порты
        env:
          HOST: ${{ inputs.host }}
          PORTS: ${{ inputs.ports }}
        run: |
          fail=0
          for p in $PORTS; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/$p" 2>/dev/null; then
              echo "порт $p: ОТКРЫТ"
            else
              echo "порт $p: закрыт или молчит"
              [ "$p" = "22" ] && fail=1
            fi
          done
          echo "SSH_BLOCKED=$fail" >> "$GITHUB_ENV"

      - name: Баннер SSH
        env:
          HOST: ${{ inputs.host }}
        run: |
          # Баннер приходит до всякой аутентификации: если он есть, значит
          # сеть до sshd проходит, и дело будет только в ключе.
          #
          # Читаем ОДНУ СТРОКУ, а не фиксированное число байт. Приветствие
          # sshd вида "SSH-2.0-OpenSSH_9.6" короче шестидесяти символов, и
          # `head -c 60` вставал в ожидании недостающих — открытый порт
          # выглядел как недоступный.
          banner="$(timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/22 && IFS= read -r -t 5 line <&3 && printf '%s' \"\$line\"" 2>/dev/null || true)"
          if [ -n "$banner" ]; then
            echo "sshd отвечает: $banner"
          else
            echo "баннера нет — до sshd не доходит"
          fi

      - name: HTTP и сертификат
        env:
          HOST: ${{ inputs.host }}
        run: |
          # Диагностика TLS отдельно от «порт открыт»: 443 бывает открыт, а
          # сертификата на нём нет или он не тот. Разница видна только здесь.
          echo "--- HTTP (порт 80) ---"
          curl -sS --max-time 15 -o /dev/null \
            -w 'код %{http_code}, редирект → %{redirect_url}\n' \
            "http://$HOST/health" || echo "порт 80 не ответил"

          echo
          echo "--- ACME-путь (по нему certbot подтверждает домен) ---"
          # certbot кладёт файл в /.well-known/acme-challenge/. Если этот путь
          # не доходит до nginx, выпуск сертификата не пройдёт никогда — и
          # именно так выглядит «сертификат не прописался».
          curl -sS --max-time 15 -o /dev/null \
            -w 'код %{http_code} (ожидается 404 от nginx, а не таймаут)\n' \
            "http://$HOST/.well-known/acme-challenge/probe" \
            || echo "путь недоступен — certbot не сможет подтвердить домен"

          echo
          echo "--- HTTPS (порт 443) ---"
          curl -sSk --max-time 15 -o /dev/null \
            -w 'код %{http_code}\n' "https://$HOST/health" \
            || echo "порт 443 не ответил"

          echo
          echo "--- сертификат ---"
          cert="$(timeout 20 openssl s_client -connect "$HOST:443" -servername "$HOST" \
                    </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || true)"
          if [ -n "$cert" ]; then
            echo "$cert"
            if printf '%s' "$cert" | grep -qi "let's encrypt"; then
              echo "::notice::Сертификат выпущен Let's Encrypt — TLS настроен."
            else
              echo "::warning::Сертификат есть, но выпущен не Let's Encrypt — вероятно самоподписанный."
            fi
          else
            echo "::warning::Сертификата на 443 нет — TLS не настроен."
          fi

      - name: Что это значит
        run: |
          if [ "${SSH_BLOCKED:-1}" = "0" ]; then
            echo "::notice::Раннер видит порт 22 — развёртывание через Actions возможно."
          else
            echo "::warning::Раннер не видит порт 22. Нужен либо доступ с адреса раннера, либо другой путь."
          fi
