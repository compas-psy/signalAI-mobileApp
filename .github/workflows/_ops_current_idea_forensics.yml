name: Ops current idea forensics

on:
  pull_request:

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.head_ref == 'ops/current-idea-forensics-20260811' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'compas-psy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HOST"; test -n "$KEY"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_forensics
          chmod 600 ~/.ssh/id_forensics
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect latest BTCUSDT DOGEUSDT GKU6
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_forensics -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          echo '--- SOURCE RECEIPT ---'
          [ -f "$HOME/signalai/.source_sha" ] && { printf 'source='; cat "$HOME/signalai/.source_sha"; }
          $SUDO docker compose --env-file /etc/signalai/.env exec -T api python - <<'PY'
          from datetime import UTC, datetime
          from sqlalchemy import select
          from app.db import get_session_factory
          from app.models import IdeaEvent, Instrument, PaperTrade, TradeIdea
          from app.api.v1.ideas import today, get_idea

          SYMBOLS = ('BTCUSDT', 'DOGEUSDT', 'GKU6')
          def val(x): return getattr(x, 'value', str(x)) if x is not None else None

          db = get_session_factory()()
          try:
              print('NOW', datetime.now(UTC).isoformat())
              daily = today(db)
              print('TODAY_TRADE_NOW', [
                  {'id': str(x.id), 'instrument_id': x.instrument_id,
                   'status': val(x.status), 'quality': val(x.quality_status), 'score': str(x.score)}
                  for x in daily.trade_now
              ])
              print('TODAY_WAIT', [
                  {'id': str(x.id), 'instrument_id': x.instrument_id,
                   'status': val(x.status), 'quality': val(x.quality_status), 'score': str(x.score)}
                  for x in daily.wait_for_trigger
              ])

              for symbol in SYMBOLS:
                  row = db.execute(
                      select(TradeIdea, Instrument)
                      .join(Instrument, Instrument.instrument_id == TradeIdea.instrument_id)
                      .where(Instrument.symbol == symbol)
                      .order_by(TradeIdea.signal_time.desc())
                      .limit(1)
                  ).first()
                  print('=== SYMBOL', symbol, '===')
                  if row is None:
                      print('MISSING')
                      continue
                  idea, inst = row
                  exp = idea.explanation_json or {}
                  print('RAW', {
                      'id': str(idea.id), 'instrument_id': idea.instrument_id,
                      'direction': val(idea.direction), 'time': idea.signal_time.isoformat(),
                      'expires': idea.expires_at.isoformat(), 'status': val(idea.status),
                      'quality': val(idea.quality_status), 'presented': idea.was_presented,
                      'rank': idea.presentation_rank, 'score': str(idea.score),
                      'entry_low': str(idea.entry_low), 'entry_high': str(idea.entry_high),
                      'entry_reference': str(idea.entry_reference), 'stop': str(idea.stop),
                      'tp1': str(idea.tp1), 'tp2': str(idea.tp2), 'tp3': str(idea.tp3),
                      'quantity': str(idea.quantity), 'risk_amount': str(idea.risk_amount),
                      'risk_per_unit': str(idea.risk_per_unit),
                      'quote_currency': exp.get('quote_currency'),
                      'quote_rate_rub': exp.get('quote_rate_rub'),
                      'sizing_note': exp.get('sizing_note'),
                      'admission': exp.get('admission'),
                      'admission_failed': exp.get('admission_failed'),
                  })
                  try:
                      d = get_idea(idea.id, db).model_dump(mode='json')
                      print('DETAIL_OK', {
                          'plan': d.get('plan'), 'sizing': d.get('sizing'),
                          'evidence_count': len(d.get('evidence') or []),
                          'annotation_count': len(d.get('annotations') or []),
                      })
                  except Exception as exc:
                      print('DETAIL_ERROR', {'type': type(exc).__name__, 'message': str(exc)})
                  events = db.execute(
                      select(IdeaEvent).where(IdeaEvent.idea_id == idea.id).order_by(IdeaEvent.sequence)
                  ).scalars().all()
                  print('EVENTS', [
                      {'seq': e.sequence, 'new': val(e.new_status), 'reason': e.reason_code,
                       'detail': e.reason_detail, 'at': e.occurred_at.isoformat()} for e in events
                  ])
                  papers = db.execute(select(PaperTrade).where(PaperTrade.idea_id == idea.id)).scalars().all()
                  print('PAPER', [
                      {'id': str(p.id), 'status': val(p.status), 'entry': str(p.entry)} for p in papers
                  ])
          finally:
              db.close()
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_forensics
