name: Apply scoped SPREAD status quarter patch

on:
  push:
    branches:
      - feature/4-rual-spread-basket

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/4-rual-spread-basket
          fetch-depth: 1
      - name: Make SPREAD status use engine-usable complete quarters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/app/api/v1/research.py')
          text = path.read_text()

          old = 'from ...research.spread_runtime import PRODUCTION_BASKETS\n'
          new = 'from ...research.spread_runtime import PRODUCTION_BASKETS, prepare_periods\n'
          assert text.count(old) == 1, 'SPREAD runtime import changed unexpectedly'
          text = text.replace(old, new)

          old = '''    total, periods, last_seen = rows
              if key == "SPREAD" and not PRODUCTION_BASKETS:
                  return {
                      "wired": True,
                      "observations": int(total or 0),
                      "unique_periods": int(periods or 0),
                      "last_seen_at": last_seen,
                      "history_ready": False,
                      "history_note": "production baskets not configured",
                  }
              frequency = DEMAND_FREQUENCY if key == "DEMAND" else "quarterly"
              enough, why = history_verdict(int(periods or 0), frequency)
              return {
                  "wired": True,
                  "observations": int(total or 0),
                  "unique_periods": int(periods or 0),
                  "last_seen_at": last_seen,
                  "history_ready": enough,
                  "history_note": why,
              }
          '''
          new = '''    total, periods, last_seen = rows
              if key == "SPREAD":
                  if not PRODUCTION_BASKETS:
                      return {
                          "wired": True,
                          "observations": int(total or 0),
                          "unique_periods": 0,
                          "last_seen_at": last_seen,
                          "history_ready": False,
                          "history_note": "production baskets not configured",
                      }

                  # SPREAD consumes complete quarter averages for every configured
                  # leg. Counting raw monthly period_end values here made six months
                  # look like six quarters and could report false readiness. Reuse
                  # the exact runtime preparation path instead of duplicating its
                  # completeness/tradable_at/unit rules in diagnostics.
                  moment = datetime.now(UTC)
                  prepared = [
                      (basket, prepare_periods(session, basket, as_of=moment))
                      for basket in PRODUCTION_BASKETS
                  ]
                  complete = max(
                      (len(preparation.periods) for _, preparation in prepared),
                      default=0,
                  )
                  states = [
                      (basket, preparation, history_verdict(
                          len(preparation.periods), "quarterly"
                      ))
                      for basket, preparation in prepared
                  ]
                  ready = any(enough for _, _, (enough, _) in states)
                  notes: list[str] = []
                  for basket, preparation, (enough, why) in states:
                      if enough:
                          continue
                      reasons = ",".join(preparation.reason_codes)
                      note = (
                          f"{basket.basket_id}: {len(preparation.periods)} "
                          f"complete quarters; {why}"
                      )
                      if reasons:
                          note += f"; {reasons}"
                      notes.append(note)
                  return {
                      "wired": True,
                      "observations": int(total or 0),
                      "unique_periods": complete,
                      "last_seen_at": last_seen,
                      "history_ready": ready,
                      "history_note": "; ".join(notes),
                  }

              frequency = DEMAND_FREQUENCY if key == "DEMAND" else "quarterly"
              enough, why = history_verdict(int(periods or 0), frequency)
              return {
                  "wired": True,
                  "observations": int(total or 0),
                  "unique_periods": int(periods or 0),
                  "last_seen_at": last_seen,
                  "history_ready": enough,
                  "history_note": why,
              }
          '''
          assert text.count(old) == 1, 'engine facts block changed unexpectedly'
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/apply-spread-status-quarter-patch.yml
          git config user.name "signalai-patch-bot"
          git config user.email "signalai-patch-bot@users.noreply.github.com"
          git add server/app/api/v1/research.py .github/workflows/apply-spread-status-quarter-patch.yml
          git diff --cached --check
          git commit -m "fix: derive SPREAD readiness from complete quarters"
          git push origin HEAD:feature/4-rual-spread-basket
