name: PXU6 trusted forensic comment

on:
  pull_request_target:
    branches: [claude/release-y40hk5]
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  inspect:
    if: github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$KEY"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_probe
          chmod 600 ~/.ssh/id_probe
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect production and sandbox
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set +e
          : > /tmp/report.txt
          ssh -i ~/.ssh/id_probe -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" 'bash -s' >> /tmp/report.txt 2>&1 <<'REMOTE'
          set +e
          cd "$HOME/signalai/server" || { echo 'PROBE_ERROR server directory missing'; exit 0; }
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO docker compose --env-file /etc/signalai/.env exec -T api python - <<'PY'
          import json, traceback, uuid
          from collections import Counter
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from sqlalchemy import select, func
          from app.db import get_session_factory
          from app.integration_secrets import configured_slots, load_secret
          from app.models import Bar, IdeaEvent, Instrument, PaperTrade, TradeIdea
          from app.models.enums import Timeframe

          def val(x): return getattr(x, 'value', str(x)) if x is not None else None
          def run_section(name, fn):
              print(f'\n## {name}')
              try: fn()
              except Exception as exc:
                  print('ERROR', type(exc).__name__, str(exc))
                  traceback.print_exc(limit=2)

          db = get_session_factory()()
          now = datetime.now(UTC)
          print('NOW', now.isoformat())
          print('CONFIGURED_SLOTS', sorted(configured_slots(db)))
          latest_pxu6 = [None]

          def pxu6():
              rows = db.execute(
                  select(TradeIdea, Instrument)
                  .join(Instrument, Instrument.instrument_id == TradeIdea.instrument_id)
                  .where(Instrument.symbol == 'PXU6')
                  .order_by(TradeIdea.signal_time.desc()).limit(5)
              ).all()
              print('COUNT', len(rows))
              for idea, inst in rows:
                  if latest_pxu6[0] is None:
                      latest_pxu6[0] = (idea, inst)
                  exp = idea.explanation_json or {}
                  print('IDEA', {
                      'id': str(idea.id), 'time': idea.signal_time.isoformat(),
                      'status': val(idea.status), 'quality': val(idea.quality_status),
                      'presented': idea.was_presented, 'rank': idea.presentation_rank,
                      'score': str(idea.score), 'entry': str(idea.entry_reference),
                      'stop': str(idea.stop), 'tp1': str(idea.tp1), 'tp2': str(idea.tp2),
                      'tp3': str(idea.tp3), 'quantity': str(idea.quantity),
                      'risk_amount': str(idea.risk_amount), 'risk_pct': str(idea.risk_pct),
                      'risk_per_unit': str(idea.risk_per_unit),
                      'sizing_note': exp.get('sizing_note'),
                      'admission': exp.get('admission'),
                      'admission_failed': exp.get('admission_failed'),
                      'tick_size': str(inst.tick_size), 'tick_value': str(inst.tick_value),
                      'quantity_step': str(inst.quantity_step), 'min_quantity': str(inst.min_quantity),
                  })
                  events = db.execute(
                      select(IdeaEvent).where(IdeaEvent.idea_id == idea.id).order_by(IdeaEvent.sequence)
                  ).scalars().all()
                  print('EVENTS', [
                      {'seq': e.sequence, 'new': val(e.new_status), 'reason': e.reason_code,
                       'detail': e.reason_detail, 'at': e.occurred_at.isoformat()}
                      for e in events
                  ])
                  trades = db.execute(select(PaperTrade).where(PaperTrade.idea_id == idea.id)).scalars().all()
                  print('PAPER', [
                      {'id': str(t.id), 'status': val(t.status), 'entry': str(t.entry)} for t in trades
                  ])
          run_section('PXU6', pxu6)

          def venues():
              since = now - timedelta(hours=48)
              rows = db.execute(
                  select(TradeIdea, Instrument)
                  .join(Instrument, Instrument.instrument_id == TradeIdea.instrument_id)
                  .where(TradeIdea.signal_time >= since)
                  .order_by(TradeIdea.signal_time.desc())
              ).all()
              totals, presented, actionable = Counter(), Counter(), Counter()
              terminal = {'CLOSED','STOPPED','TARGET_REACHED','CANCELLED','REJECTED','MISSED','EXPIRED','TIMED_OUT','SKIPPED'}
              live = Counter()
              for idea, inst in rows:
                  kind = 'BYBIT' if idea.instrument_id.startswith('CRYPTO:') else ('FORTS' if idea.instrument_id.startswith('MOEX:FUT:') else val(inst.venue))
                  totals[kind] += 1
                  if idea.was_presented: presented[kind] += 1
                  if val(idea.quality_status) == 'ACTIVE' and val(idea.status) == 'TRIGGERED': actionable[kind] += 1
                  if val(idea.status) not in terminal and idea.expires_at > now: live[kind] += 1
                  print('ROW', {
                      'time': idea.signal_time.isoformat(), 'symbol': inst.symbol, 'kind': kind,
                      'status': val(idea.status), 'quality': val(idea.quality_status),
                      'presented': idea.was_presented, 'rank': idea.presentation_rank,
                      'score': str(idea.score), 'quantity': str(idea.quantity),
                  })
              print('TOTALS', dict(totals))
              print('PRESENTED', dict(presented))
              print('ACTIONABLE', dict(actionable))
              print('LIVE', dict(live))
              for prefix, label in [('CRYPTO:%', 'BYBIT'), ('MOEX:FUT:%', 'FORTS')]:
                  latest = db.execute(
                      select(func.max(Bar.open_time)).where(
                          Bar.instrument_id.like(prefix), Bar.timeframe == Timeframe.H1, Bar.is_closed.is_(True)
                      )
                  ).scalar_one_or_none()
                  fresh = db.execute(
                      select(func.count()).select_from(Bar).where(
                          Bar.instrument_id.like(prefix), Bar.timeframe == Timeframe.H1,
                          Bar.is_closed.is_(True), Bar.open_time >= now - timedelta(hours=6)
                      )
                  ).scalar_one()
                  print('FRESHNESS', label, latest.isoformat() if latest else None, 'bars6h', fresh)
          run_section('VENUES_48H', venues)

          def sandbox():
              secret = load_secret(db, 'tinvest_sandbox')
              if not secret:
                  print('RESULT NOT_CONFIGURED')
                  return
              if latest_pxu6[0] is None:
                  print('RESULT NO_PXU6')
                  return
              idea, _ = latest_pxu6[0]
              token = secret['token']
              base = 'https://sandbox-invest-public-api.tbank.ru/rest'
              def quotation(value):
                  d = Decimal(str(value)); units = int(d)
                  return {'units': str(units), 'nano': int((d - Decimal(units)) * Decimal(1_000_000_000))}
              def post(path, body):
                  req = Request(base + path, data=json.dumps(body).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + token,
                      'Content-Type': 'application/json', 'Accept': 'application/json',
                      'x-app-name': 'signalai-personal',
                  })
                  try:
                      with urlopen(req, timeout=25) as response:
                          return json.loads(response.read().decode() or '{}')
                  except HTTPError as exc:
                      raise RuntimeError(f'HTTP {exc.code} {path}: ' + exc.read().decode(errors='replace')[:900])

              found = post('/tinkoff.public.invest.api.contract.v1.InstrumentsService/FindInstrument', {
                  'query': 'PXU6', 'instrumentKind': 'INSTRUMENT_TYPE_FUTURES',
                  'apiTradeAvailableFlag': True,
              })
              matches = [x for x in found.get('instruments', []) if x.get('ticker') == 'PXU6']
              print('FOUND', [{k: x.get(k) for k in ('ticker','classCode','uid','name','apiTradeAvailableFlag')} for x in matches])
              if not matches:
                  print('RESULT PXU6_NOT_FOUND'); return
              instrument = matches[0]
              instrument_id = instrument.get('uid') or f"{instrument.get('ticker')}_{instrument.get('classCode')}"
              accounts = post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxAccounts', {'status':'ACCOUNT_STATUS_OPEN'}).get('accounts', [])
              account = next((a for a in accounts if (a.get('name') or '').startswith('SignalAI PXU6')), None)
              created = False
              if account is None:
                  opened = post('/tinkoff.public.invest.api.contract.v1.SandboxService/OpenSandboxAccount', {'name':'SignalAI PXU6 tech-test'})
                  account_id = opened.get('accountId') or opened.get('account_id'); created = True
              else:
                  account_id = account.get('id') or account.get('accountId')
              print('ACCOUNT', {'suffix': account_id[-6:] if account_id else None, 'created': created})
              if not account_id:
                  raise RuntimeError('sandbox account id not returned')
              if created:
                  post('/tinkoff.public.invest.api.contract.v1.SandboxService/SandboxPayIn', {
                      'accountId': account_id, 'amount': {'currency':'rub','units':'1000000','nano':0}
                  })
                  print('PAYIN PASS')
              preview = post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxOrderPrice', {
                  'accountId': account_id, 'instrumentId': instrument_id,
                  'price': quotation(idea.entry_reference), 'direction':'ORDER_DIRECTION_SELL', 'quantity':'1'
              })
              print('PRICE_CHECK', bool(preview))
              request_id = str(uuid.uuid4())
              placed = post('/tinkoff.public.invest.api.contract.v1.SandboxService/PostSandboxOrder', {
                  'instrumentId': instrument_id, 'quantity':'1', 'price': quotation(idea.entry_reference),
                  'direction':'ORDER_DIRECTION_SELL', 'accountId': account_id,
                  'orderType':'ORDER_TYPE_LIMIT', 'orderId': request_id,
                  'timeInForce':'TIME_IN_FORCE_DAY', 'priceType':'PRICE_TYPE_POINT',
                  'confirmMarginTrade': True,
              })
              order_id = placed.get('orderId') or placed.get('order_id') or request_id
              print('POST', {
                  'status': placed.get('executionReportStatus'), 'requested': placed.get('lotsRequested'),
                  'executed': placed.get('lotsExecuted'), 'order_suffix': str(order_id)[-8:]
              })
              state = None
              try:
                  state = post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxOrderState', {
                      'accountId': account_id, 'orderId': order_id, 'priceType':'PRICE_TYPE_POINT',
                      'orderIdType':'ORDER_ID_TYPE_EXCHANGE'
                  })
              except Exception:
                  state = post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxOrderState', {
                      'accountId': account_id, 'orderId': request_id, 'priceType':'PRICE_TYPE_POINT',
                      'orderIdType':'ORDER_ID_TYPE_REQUEST'
                  })
              status = state.get('executionReportStatus')
              print('STATE', {'status': status, 'executed': state.get('lotsExecuted')})
              if status in {'EXECUTION_REPORT_STATUS_NEW','EXECUTION_REPORT_STATUS_PARTIALLYFILL'}:
                  try:
                      post('/tinkoff.public.invest.api.contract.v1.SandboxService/CancelSandboxOrder', {
                          'accountId': account_id, 'orderId': order_id, 'orderIdType':'ORDER_ID_TYPE_EXCHANGE'
                      })
                  except Exception:
                      post('/tinkoff.public.invest.api.contract.v1.SandboxService/CancelSandboxOrder', {
                          'accountId': account_id, 'orderId': request_id, 'orderIdType':'ORDER_ID_TYPE_REQUEST'
                      })
                  print('CANCEL PASS')
              elif status == 'EXECUTION_REPORT_STATUS_FILL':
                  neutral = post('/tinkoff.public.invest.api.contract.v1.SandboxService/PostSandboxOrder', {
                      'instrumentId': instrument_id, 'quantity':'1', 'direction':'ORDER_DIRECTION_BUY',
                      'accountId': account_id, 'orderType':'ORDER_TYPE_MARKET',
                      'orderId': str(uuid.uuid4()), 'priceType':'PRICE_TYPE_POINT',
                      'confirmMarginTrade': True,
                  })
                  print('NEUTRALIZE', neutral.get('executionReportStatus'))
              print('RESULT PASS')
          run_section('TINVEST_SANDBOX', sandbox)
          db.close()
          PY
          echo '\n## SCHEDULER_TAIL'
          $SUDO docker compose --env-file /etc/signalai/.env logs --since 8h scheduler 2>&1 | grep -Ei 'scan|ingest|crypto|bybit|moex|forts|error|failed|ошиб|идей|бар' | tail -n 250 || true
          REMOTE
          exit 0

      - name: Post sanitized report to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/report.txt || echo 'PROBE_ERROR report missing' > /tmp/report.txt
          tail -c 55000 /tmp/report.txt > /tmp/report-tail.txt
          {
            echo '### PXU6 / Bybit / T-Invest production forensic report'
            echo '```text'
            cat /tmp/report-tail.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment 24 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_probe /tmp/report.txt /tmp/report-tail.txt /tmp/comment.md
