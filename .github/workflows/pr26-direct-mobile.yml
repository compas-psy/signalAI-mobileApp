name: PR26 direct mobile gate

on:
  pull_request:
    branches: [claude/release-y40hk5]
    paths:
      - lib/**
      - test/**
      - .github/workflows/pr26-direct-mobile.yml

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.32.8'

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
