name: Apply control/backtest patch

on:
  push:
    branches: [fix/bybit-visibility-backtest-progress]
    paths: [.github/workflows/apply-control-backtest-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bybit-visibility-backtest-progress
          fetch-depth: 0
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          # Heavy scheduler owns entry-backtest readiness/work.
          p = 'server/app/scheduler/p0_runtime.py'
          replace_once(p,
              'def build_default_scheduler(*args, **kwargs):\n',
              '''def _add_entry_backtest_job(scheduler) -> None:\n    def run(session) -> str:\n        from ..backtest.runtime import run_entry_backtest_cycle\n\n        return run_entry_backtest_cycle(session)\n\n    scheduler.add(\n        "entry-backtest",\n        _minutes_from_env("SIGNALAI_ENTRY_BACKTEST_EVERY_MINUTES", 60),\n        run,\n    )\n\n\ndef build_default_scheduler(*args, **kwargs):\n''')
          replace_once(p,
              '    _add_capital_job(scheduler)\n    apply_scheduler_lane(\n',
              '    _add_capital_job(scheduler)\n    _add_entry_backtest_job(scheduler)\n    apply_scheduler_lane(\n')

          # Control API exposes honest venue data readiness alongside a run.
          p = 'server/app/control/dashboard.py'
          replace_once(p,
              'from ..config import EngineConfig, get_config\n',
              'from ..backtest.readiness import load_venue_readiness\nfrom ..config import EngineConfig, get_config\n')
          replace_once(p,
              '''def _backtest_snapshot(\n    session: Session,\n    *,\n    market_marker: str,\n    cfg: EngineConfig,\n) -> dict[str, Any]:\n''',
              '''def _backtest_snapshot(\n    session: Session,\n    *,\n    venue: ExternalVenue,\n    market_marker: str,\n    cfg: EngineConfig,\n    now: datetime,\n) -> dict[str, Any]:\n''')
          replace_once(p,
              '''    return {\n        "latest": _serialize_backtest(latest),\n        "walk_forward": dict(cfg.get("backtest.walk_forward")),\n''',
              '''    readiness = load_venue_readiness(session, venue, now=now, cfg=cfg)\n    return {\n        "latest": _serialize_backtest(latest),\n        "data_readiness": readiness.as_json(),\n        "walk_forward": dict(cfg.get("backtest.walk_forward")),\n''')
          replace_once(p,
              '''        "backtest": _backtest_snapshot(\n            session,\n            market_marker=market_marker,\n            cfg=config,\n        ),\n''',
              '''        "backtest": _backtest_snapshot(\n            session,\n            venue=venue,\n            market_marker=market_marker,\n            cfg=config,\n            now=moment,\n        ),\n''')

          # Flutter parser keeps readiness as read-only JSON; no trading math on device.
          p = 'lib/data/api/control_dashboard_client.dart'
          replace_once(p,
              '''  const ControlBacktestSnapshot({\n    required this.latest,\n    required this.walkForward,\n''',
              '''  const ControlBacktestSnapshot({\n    required this.latest,\n    required this.dataReadiness,\n    required this.walkForward,\n''')
          replace_once(p,
              '''  final BacktestRunSummary? latest;\n  final Map<String, dynamic> walkForward;\n''',
              '''  final BacktestRunSummary? latest;\n  final Map<String, dynamic> dataReadiness;\n  final Map<String, dynamic> walkForward;\n''')
          replace_once(p,
              '''        latest: json['latest'] == null\n            ? null\n            : BacktestRunSummary.fromJson(\n                _requiredMap(json['latest'], 'backtest.latest'),\n              ),\n        walkForward: _requiredMap(json['walk_forward'], 'backtest.walk_forward'),\n''',
              '''        latest: json['latest'] == null\n            ? null\n            : BacktestRunSummary.fromJson(\n                _requiredMap(json['latest'], 'backtest.latest'),\n              ),\n        dataReadiness: _requiredMap(\n          json['data_readiness'],\n          'backtest.data_readiness',\n        ),\n        walkForward: _requiredMap(json['walk_forward'], 'backtest.walk_forward'),\n''')

          # UI: exact N/40 + remaining, and explicit historical readiness.
          p = 'lib/ui/screens/server_control_screen.dart'
          replace_once(p,
              "import '../../data/api/control_dashboard_client.dart';\n",
              "import '../../data/api/control_dashboard_client.dart';\nimport '../../data/api/control_progress.dart';\n")
          replace_once(p,
              '              _CompetitionCard(candidate: candidate),\n',
              '''              _CompetitionCard(\n                candidate: candidate,\n                requiredSample: snapshot.competition.minComparableSample,\n              ),\n''')
          replace_once(p,
              '''class _CompetitionCard extends StatelessWidget {\n  const _CompetitionCard({required this.candidate});\n\n  final CompetitionCandidateSummary candidate;\n''',
              '''class _CompetitionCard extends StatelessWidget {\n  const _CompetitionCard({\n    required this.candidate,\n    required this.requiredSample,\n  });\n\n  final CompetitionCandidateSummary candidate;\n  final int requiredSample;\n''')
          replace_once(p,
              '''    final paper = candidate.paper;\n    final comparable = paper.comparablePairs;\n    return InsetBox(\n''',
              '''    final paper = candidate.paper;\n    final comparable = paper.comparablePairs;\n    final progress = ComparableSampleProgress(\n      comparable: comparable,\n      required: requiredSample,\n    );\n    return InsetBox(\n''')
          replace_once(p,
              '''          if (comparable == 0)\n            Text(\n              'Сравнимых исходов пока нет · control: ${_r(paper.controlMeanNetR)} · кандидат: ${_r(paper.candidateMeanNetR)}',\n              style: T.body(10.8, color: C.muted, height: 1.45),\n            )\n          else\n            Text(\n              'N $comparable · control ${_r(paper.controlMeanNetR)} · кандидат ${_r(paper.candidateMeanNetR)} · Δ ${_r(paper.deltaMeanNetR)}',\n              style: T.mono(10.8, color: C.textSecondary),\n            ),\n''',
              '''          Text(\n            progress.label,\n            style: T.mono(10.8, color: progress.adequate ? C.green : C.warning),\n          ),\n          const SizedBox(height: 4),\n          Text(\n            comparable == 0\n                ? 'Сравнимых исходов пока нет · control ${_r(paper.controlMeanNetR)} · кандидат ${_r(paper.candidateMeanNetR)}'\n                : 'control ${_r(paper.controlMeanNetR)} · кандидат ${_r(paper.candidateMeanNetR)} · Δ ${_r(paper.deltaMeanNetR)}',\n            style: T.body(10.8, color: C.textSecondary, height: 1.45),\n          ),\n''')
          replace_once(p,
              '''  Widget _backtest(ControlBacktestSnapshot snapshot) {\n    final run = snapshot.latest;\n    return SectionCard(\n''',
              '''  Widget _backtest(ControlBacktestSnapshot snapshot) {\n    final run = snapshot.latest;\n    final readiness = snapshot.dataReadiness;\n    final readinessStatus = readiness['status']?.toString() ?? 'UNKNOWN';\n    final d1Months = readiness['available_d1_months'] ?? 0;\n    final h1Months = readiness['available_h1_months'] ?? 0;\n    final requiredMonths = readiness['required_months'] ??\n        snapshot.walkForward['min_history_months'] ??\n        '—';\n    return SectionCard(\n''')
          replace_once(p,
              '''          if (run == null)\n            Text(\n              'Для $_venueName нет сохранённого серверного бэктеста.',\n              style: T.body(11.5, color: C.muted, height: 1.45),\n            )\n''',
              '''          if (run == null)\n            Text(\n              readinessStatus == 'INSUFFICIENT_HISTORY'\n                  ? 'Бэктест заблокирован честно: истории недостаточно · D1 $d1Months/$requiredMonths мес · H1 $h1Months/$requiredMonths мес.'\n                  : 'Для $_venueName нет сохранённого серверного бэктеста · данные: $readinessStatus.',\n              style: T.body(11.5, color: C.warning, height: 1.45),\n            )\n''')

          # Self-remove so this operational patcher cannot run again.
          Path('.github/workflows/apply-control-backtest-patch.yml').unlink()
          PY
      - name: Sanity-check patched source
        run: |
          python -m py_compile server/app/backtest/readiness.py server/app/backtest/runtime.py server/app/control/dashboard.py server/app/scheduler/p0_runtime.py server/app/scheduler/lanes.py
          grep -q "осталось" lib/ui/screens/server_control_screen.dart
          grep -q "data_readiness" lib/data/api/control_dashboard_client.dart
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: expose N40 and venue backtest readiness"
          git push origin HEAD:fix/bybit-visibility-backtest-progress
