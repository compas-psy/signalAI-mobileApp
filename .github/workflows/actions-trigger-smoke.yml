name: Actions trigger smoke

on:
  push:
    branches:
      - claude/release-y40hk5
    paths:
      - .github/workflows/actions-trigger-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Comment on PR 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '{"body":"Actions push-trigger smoke: OK"}' > /tmp/comment.json
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/11/comments" \
            --data-binary @/tmp/comment.json >/dev/null
