name: One-shot investment evidence builder patch

on:
  push:
    branches:
      - feature/investment-evidence-bridge

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/investment-evidence-bridge
          fetch-depth: 0
      - name: Apply surgical builder patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/app/portfolio/build.py')
          text = path.read_text()

          replacements = [
              (
                  '    score: float\n    expected_return: float\n',
                  '    score: float\n    expected_return: float\n    evidence: dict = field(default_factory=dict)\n',
              ),
              (
                  '    horizons: tuple[int, ...] = (1, 5),\n) -> BuildReport:\n',
                  '    horizons: tuple[int, ...] = (1, 5),\n    as_of: datetime | None = None,\n) -> BuildReport:\n',
              ),
              (
                  '    cfg = get_config()\n    report = BuildReport()\n',
                  '    cfg = get_config()\n    report = BuildReport()\n    now = as_of or datetime.now(UTC)\n',
              ),
              (
                  '        session, universe, min_history_days=min_history, fetch=fetch\n',
                  '        session, universe, min_history_days=min_history, fetch=fetch, as_of=now\n',
              ),
              (
                  '                expected_return=float(mu_annual[i]),\n            )\n',
                  '                expected_return=float(mu_annual[i]),\n                evidence=card.evidence_json,\n            )\n',
              ),
              (
                  '    now = datetime.now(UTC)\n    for profile_key in profiles:\n',
                  '    for profile_key in profiles:\n',
              ),
              (
                  '                expected_return=Decimal(str(round(position.expected_return, 6))),\n            )\n',
                  '                expected_return=Decimal(str(round(position.expected_return, 6))),\n                evidence_json=position.evidence,\n            )\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one builder match, got {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)

          workflow = Path('.github/workflows/oneshot-investment-evidence-build-patch.yml')
          workflow.unlink()
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/app/portfolio/build.py .github/workflows/oneshot-investment-evidence-build-patch.yml
          git commit -m "feat: persist research evidence through portfolio build"
          git push origin HEAD:feature/investment-evidence-bridge
