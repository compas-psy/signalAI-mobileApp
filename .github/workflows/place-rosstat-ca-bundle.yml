name: Place Rosstat CA bundle

on:
  push:
    branches:
      - fix/4-rosstat-live-reachability

permissions:
  contents: write

jobs:
  move:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4-rosstat-live-reachability
          fetch-depth: 1
      - name: Move public CA bundle to adapter-owned path
        run: |
          set -euo pipefail
          mkdir -p server/app/research/adapters/certs
          git mv \
            server/app/research/certs/rosstat-russian-trusted-ca.crt \
            server/app/research/adapters/certs/rosstat-russian-trusted-ca.crt
          rmdir server/app/research/certs || true
      - name: Remove one-shot workflow and push surgical move
        run: |
          rm .github/workflows/place-rosstat-ca-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: place Rosstat CA bundle beside adapter'
          git push origin HEAD:fix/4-rosstat-live-reachability
