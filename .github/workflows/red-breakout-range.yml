name: RED breakout raw-range regression

on:
  push:
    branches:
      - 'red/breakout-range-20260831'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen --extra test
      - name: Run breakout raw-range regression
        run: .venv/bin/python -m pytest -q tests/strategies/test_breakout_retest_range_source.py
