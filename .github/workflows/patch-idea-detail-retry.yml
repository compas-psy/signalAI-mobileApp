name: Apply idea detail hydration fix

on:
  push:
    branches:
      - fix/idea-detail-retry-20260814
    paths:
      - .github/workflows/patch-idea-detail-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idea-detail-retry-20260814
      - name: Patch hydration and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/state/app_controller.dart')
          text = path.read_text()
          old = """    final full = await _engine.detail(id);\n    if (full == null) return;\n"""
          new = """    var full = await _engine.detail(id);\n    if (full == null) {\n      // `/ideas/today` намеренно не несёт TradePlan. Один краткий сбой\n      // detail не должен превращать хороший серверный сигнал в карточку без\n      // Entry/SL/TP и кнопки подтверждения до следующего открытия экрана.\n      // Повторяем только чтение уже созданного плана; генерацию сигнала,\n      // триггер и торговые уровни здесь не пересчитываем.\n      full = await _engine.detail(id);\n    }\n    if (full == null) {\n      if (_selectedSignalId == id) {\n        showToast(\n          'Не удалось загрузить торговый план. Закройте и откройте идею, '\n          'чтобы повторить.',\n          tone: ToastTone.warning,\n        );\n      }\n      return;\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one hydration target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/patch-idea-detail-retry.yml
          git diff --check
      - name: Commit surgical fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: retry failed server idea detail hydration"
          git push origin HEAD:fix/idea-detail-retry-20260814
