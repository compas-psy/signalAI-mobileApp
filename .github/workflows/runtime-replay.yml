name: Runtime 48h replay

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact default-branch commit used for replay provenance'
        required: true
        type: string

permissions:
  contents: read

jobs:
  replay:
    name: Replay canonical Crypto/FORTS scanner over 48h
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify diagnostic provenance
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          [ "$actual_sha" = "$EXPECTED_SHA" ] || {
            echo "::error::requested $EXPECTED_SHA, checked out $actual_sha"
            exit 1
          }
          python -m py_compile .github/scripts/runtime_replay_48h.py

      - name: Verify SSH inputs
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -eu
          test -n "$HOST"
          test -n "$KEY"
          test -n "$HOST_KEY_SHA256"

      - name: Prepare pinned SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Run read-only 48h replay in production API container
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_deploy \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$USER_NAME@$HOST" \
            'set -euo pipefail; SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo; $SUDO docker compose --env-file /etc/signalai/.env -f "$HOME/signalai/server/docker-compose.yml" exec -T api python -' \
            < .github/scripts/runtime_replay_48h.py

      - name: Remove SSH key
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
