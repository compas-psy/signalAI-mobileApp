name: Verify one-shot sideload publish

on:
  push:
    branches:
      - claude/release-y40hk5
    paths:
      - .github/workflows/verify-sideload-once.yml

concurrency:
  group: signalai-sideload-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download stable sideload metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sideload
          gh release download sideload --repo "$GITHUB_REPOSITORY" \
            --pattern signalai-sideload.json --dir /tmp/sideload --clobber
          test -s /tmp/sideload/signalai-sideload.json
          cat /tmp/sideload/signalai-sideload.json

      - name: Comment sideload verification on PR 11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/sideload/signalai-sideload.json', encoding='utf-8'))
          body = (
              'Sideload publish verification:\n\n'
              f"- source_sha: `{data.get('source_sha')}`\n"
              f"- build_number: `{data.get('build_number')}`\n"
              f"- mode: `{data.get('mode')}`\n"
              f"- built_at: `{data.get('built_at')}`\n"
              f"- apk_sha256: `{data.get('apk_sha256')}`\n"
              f"- signer_sha256: `{data.get('signer_certificate_sha256')}`"
          )
          with open('/tmp/comment.json', 'w', encoding='utf-8') as f:
              json.dump({'body': body}, f)
          PY
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/11/comments" \
            --data-binary @/tmp/comment.json >/dev/null
