name: PXU6 resilient production probe

on:
  pull_request_target:
    branches: [claude/release-y40hk5]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  probe:
    if: github.event.pull_request.number == 23
    runs-on: ubuntu-latest
    steps:
      - name: Run trusted server probe
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set +e
          : > /tmp/probe.txt
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo 'PROBE_ERROR production SSH secret missing' >> /tmp/probe.txt
          else
            umask 077
            mkdir -p ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/id_probe
            chmod 600 ~/.ssh/id_probe
            ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            ssh -i ~/.ssh/id_probe -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" 'bash -s' >> /tmp/probe.txt 2>&1 <<'REMOTE'
          set +e
          cd "$HOME/signalai/server" || { echo 'PROBE_ERROR no server dir'; exit 0; }
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO docker compose --env-file /etc/signalai/.env exec -T api python - <<'PY'
          import json, traceback, uuid
          from collections import Counter
          from datetime import UTC, datetime, timedelta
          from decimal import Decimal
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError
          from sqlalchemy import select, func
          from app.db import get_session_factory
          from app.integration_secrets import configured_slots, load_secret
          from app.models import Bar, IdeaEvent, Instrument, PaperTrade, TradeIdea
          from app.models.enums import Timeframe

          def val(x): return getattr(x,'value',str(x)) if x is not None else None
          def section(name, fn):
              print('\n###',name)
              try: fn()
              except Exception as e:
                  print('ERROR',type(e).__name__,str(e))
                  traceback.print_exc(limit=2)

          db=get_session_factory()(); now=datetime.now(UTC)
          print('NOW',now.isoformat())

          def integrations(): print('SLOTS',sorted(configured_slots(db)))
          section('INTEGRATIONS', integrations)

          latest_pxu6=[None]
          def pxu6():
              rows=db.execute(select(TradeIdea,Instrument).join(Instrument,Instrument.instrument_id==TradeIdea.instrument_id).where(Instrument.symbol=='PXU6').order_by(TradeIdea.signal_time.desc()).limit(5)).all()
              print('count',len(rows))
              for idea,inst in rows:
                  if latest_pxu6[0] is None: latest_pxu6[0]=(idea,inst)
                  exp=idea.explanation_json or {}
                  print('IDEA',{'id':str(idea.id),'time':idea.signal_time.isoformat(),'status':val(idea.status),'quality':val(idea.quality_status),'presented':idea.was_presented,'score':str(idea.score),'entry':str(idea.entry_reference),'stop':str(idea.stop),'tp1':str(idea.tp1),'tp2':str(idea.tp2),'tp3':str(idea.tp3),'quantity':str(idea.quantity),'risk_amount':str(idea.risk_amount),'risk_pct':str(idea.risk_pct),'risk_per_unit':str(idea.risk_per_unit),'sizing_note':exp.get('sizing_note'),'admission':exp.get('admission'),'admission_failed':exp.get('admission_failed'),'tick_size':str(inst.tick_size),'tick_value':str(inst.tick_value),'quantity_step':str(inst.quantity_step),'min_quantity':str(inst.min_quantity)})
                  events=db.execute(select(IdeaEvent).where(IdeaEvent.idea_id==idea.id).order_by(IdeaEvent.sequence)).scalars().all()
                  print('EVENTS',[{'seq':e.sequence,'new':val(e.new_status),'reason':e.reason_code,'detail':e.reason_detail,'at':e.occurred_at.isoformat()} for e in events])
                  trades=db.execute(select(PaperTrade).where(PaperTrade.idea_id==idea.id)).scalars().all()
                  print('PAPER',[{'id':str(t.id),'status':val(t.status),'entry':str(t.entry)} for t in trades])
          section('PXU6', pxu6)

          def venue_flow():
              since=now-timedelta(hours=48)
              rows=db.execute(select(TradeIdea,Instrument).join(Instrument,Instrument.instrument_id==TradeIdea.instrument_id).where(TradeIdea.signal_time>=since).order_by(TradeIdea.signal_time.desc())).all()
              counts=Counter(); presented=Counter(); live=Counter()
              terminal={'CLOSED','STOPPED','TARGET_REACHED','CANCELLED','REJECTED','MISSED','EXPIRED','TIMED_OUT','SKIPPED'}
              for idea,inst in rows:
                  kind='BYBIT' if idea.instrument_id.startswith('CRYPTO:') else ('FORTS' if idea.instrument_id.startswith('MOEX:FUT:') else val(inst.venue))
                  counts[kind]+=1
                  if idea.was_presented: presented[kind]+=1
                  if val(idea.status) not in terminal and idea.expires_at>now: live[kind]+=1
                  print('ROW',{'time':idea.signal_time.isoformat(),'symbol':inst.symbol,'kind':kind,'status':val(idea.status),'quality':val(idea.quality_status),'presented':idea.was_presented,'score':str(idea.score),'quantity':str(idea.quantity)})
              print('COUNTS',dict(counts)); print('PRESENTED',dict(presented)); print('LIVE',dict(live))
              for prefix,label in [('CRYPTO:%','BYBIT'),('MOEX:FUT:%','FORTS')]:
                  latest=db.execute(select(func.max(Bar.open_time)).where(Bar.instrument_id.like(prefix),Bar.timeframe==Timeframe.H1,Bar.is_closed.is_(True))).scalar_one_or_none()
                  fresh=db.execute(select(func.count()).select_from(Bar).where(Bar.instrument_id.like(prefix),Bar.timeframe==Timeframe.H1,Bar.is_closed.is_(True),Bar.open_time>=now-timedelta(hours=6))).scalar_one()
                  print('FRESHNESS',label,latest.isoformat() if latest else None,'bars6h',fresh)
          section('VENUE_FLOW_48H', venue_flow)

          def sandbox():
              secret=load_secret(db,'tinvest_sandbox')
              if not secret:
                  print('RESULT NOT_CONFIGURED'); return
              if latest_pxu6[0] is None:
                  print('RESULT NO_PXU6'); return
              idea,mi=latest_pxu6[0]; token=secret['token']
              base='https://sandbox-invest-public-api.tbank.ru/rest'
              def quo(v):
                  d=Decimal(str(v)); u=int(d); return {'units':str(u),'nano':int((d-Decimal(u))*Decimal(1000000000))}
              def post(path,body):
                  req=Request(base+path,data=json.dumps(body).encode(),method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json','Accept':'application/json','x-app-name':'signalai-personal'})
                  try:
                      with urlopen(req,timeout=25) as r:return json.loads(r.read().decode() or '{}')
                  except HTTPError as e: raise RuntimeError(f'HTTP {e.code}: '+e.read().decode(errors='replace')[:800])
              found=post('/tinkoff.public.invest.api.contract.v1.InstrumentsService/FindInstrument',{'query':'PXU6','instrumentKind':'INSTRUMENT_TYPE_FUTURES','apiTradeAvailableFlag':True})
              matches=[x for x in found.get('instruments',[]) if x.get('ticker')=='PXU6']
              print('FOUND',[{k:x.get(k) for k in ('ticker','classCode','uid','name','apiTradeAvailableFlag')} for x in matches])
              if not matches: print('RESULT NOT_FOUND'); return
              ins=matches[0]; iid=ins.get('uid') or f"{ins.get('ticker')}_{ins.get('classCode')}"
              accounts=post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxAccounts',{'status':'ACCOUNT_STATUS_OPEN'}).get('accounts',[])
              acct=next((a for a in accounts if (a.get('name') or '').startswith('SignalAI PXU6')),None); created=False
              if acct is None:
                  opened=post('/tinkoff.public.invest.api.contract.v1.SandboxService/OpenSandboxAccount',{'name':'SignalAI PXU6 tech-test'}); aid=opened.get('accountId') or opened.get('account_id'); created=True
              else: aid=acct.get('id') or acct.get('accountId')
              print('ACCOUNT',{'suffix':aid[-6:] if aid else None,'created':created})
              if not aid: raise RuntimeError('no sandbox account id')
              if created:
                  post('/tinkoff.public.invest.api.contract.v1.SandboxService/SandboxPayIn',{'accountId':aid,'amount':{'currency':'rub','units':'1000000','nano':0}}); print('PAYIN PASS')
              preview=post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxOrderPrice',{'accountId':aid,'instrumentId':iid,'price':quo(idea.entry_reference),'direction':'ORDER_DIRECTION_SELL','quantity':'1'})
              print('PRICE_CHECK',bool(preview))
              reqid=str(uuid.uuid4())
              placed=post('/tinkoff.public.invest.api.contract.v1.SandboxService/PostSandboxOrder',{'instrumentId':iid,'quantity':'1','price':quo(idea.entry_reference),'direction':'ORDER_DIRECTION_SELL','accountId':aid,'orderType':'ORDER_TYPE_LIMIT','orderId':reqid,'timeInForce':'TIME_IN_FORCE_DAY','priceType':'PRICE_TYPE_POINT','confirmMarginTrade':True})
              oid=placed.get('orderId') or placed.get('order_id') or reqid
              print('POST',{'status':placed.get('executionReportStatus'),'requested':placed.get('lotsRequested'),'executed':placed.get('lotsExecuted'),'oid_suffix':str(oid)[-8:]})
              state=post('/tinkoff.public.invest.api.contract.v1.SandboxService/GetSandboxOrderState',{'accountId':aid,'orderId':oid,'priceType':'PRICE_TYPE_POINT','orderIdType':'ORDER_ID_TYPE_EXCHANGE'})
              st=state.get('executionReportStatus'); print('STATE',{'status':st,'executed':state.get('lotsExecuted')})
              if st in {'EXECUTION_REPORT_STATUS_NEW','EXECUTION_REPORT_STATUS_PARTIALLYFILL'}:
                  post('/tinkoff.public.invest.api.contract.v1.SandboxService/CancelSandboxOrder',{'accountId':aid,'orderId':oid,'orderIdType':'ORDER_ID_TYPE_EXCHANGE'}); print('CANCEL PASS')
              elif st=='EXECUTION_REPORT_STATUS_FILL':
                  close=post('/tinkoff.public.invest.api.contract.v1.SandboxService/PostSandboxOrder',{'instrumentId':iid,'quantity':'1','direction':'ORDER_DIRECTION_BUY','accountId':aid,'orderType':'ORDER_TYPE_MARKET','orderId':str(uuid.uuid4()),'priceType':'PRICE_TYPE_POINT','confirmMarginTrade':True}); print('NEUTRALIZE',close.get('executionReportStatus'))
              print('RESULT PASS')
          section('TINVEST_SANDBOX', sandbox)
          db.close()
          PY
          REMOTE
          fi
          echo '--- end probe ---' >> /tmp/probe.txt
          exit 0

      - name: Publish probe result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/probe.txt')
          text=p.read_text(errors='replace') if p.exists() else 'PROBE_ERROR output missing'
          Path('/tmp/result.json').write_text(json.dumps({'output':text[-60000:]},ensure_ascii=False,indent=2))
          PY
          encoded="$(base64 -w0 /tmp/result.json)"
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/pxu6-lite-result.json?ref=claude/release-y40hk5" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/.github/pxu6-lite-result.json" -f message='ops: record resilient PXU6 probe' -f content="$encoded" -f branch='claude/release-y40hk5')
          [ -z "$current" ] || args+=(-f sha="$current")
          gh api "${args[@]}" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_probe /tmp/probe.txt /tmp/result.json
