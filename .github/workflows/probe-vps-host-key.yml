name: Probe VPS host key fingerprint

on:
  push:
    branches:
      - codex/restore-vps-deploy-compat
    paths:
      - '.github/workflows/probe-vps-host-key.yml'

permissions: {}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Print public SSH host-key fingerprints
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          if [ -n "$HOST_KEY_SHA256" ]; then
            echo 'Configured VPS_SSH_HOST_KEY_SHA256: present'
          else
            echo 'Configured VPS_SSH_HOST_KEY_SHA256: absent'
          fi
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          ssh-keyscan -T 10 "$HOST" > "$tmp" 2>/dev/null
          test -s "$tmp"
          ssh-keygen -lf "$tmp" -E sha256 | awk '{print $1, $2, $NF}'
