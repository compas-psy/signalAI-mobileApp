name: Check existing VPS device token

on:
  pull_request:
    branches:
      - claude/ux-prototype-dark-theme-sv0euq
    types:
      - synchronize

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'codex/thin-client-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Validate token already stored on VPS
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ENV_FILE=/etc/signalai/.env
          test -f "$ENV_FILE" || { echo 'VPS_TOKEN_STATUS=missing_env'; exit 1; }
          token="$(sed -n 's/^SIGNALAI_DEVICE_TOKEN=//p' "$ENV_FILE" | tail -1)"
          [ "${#token}" -ge 32 ] || { echo 'VPS_TOKEN_STATUS=missing_or_short'; exit 1; }
          case "$token" in
            *[!A-Za-z0-9._~-]*) echo 'VPS_TOKEN_STATUS=invalid_chars'; exit 1 ;;
          esac
          unset token
          echo 'VPS_TOKEN_STATUS=valid_existing_token'
          REMOTE

      - name: Cleanup
        if: always()
        run: shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
