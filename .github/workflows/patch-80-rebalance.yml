name: Apply rebalance model selection patch

on:
  push:
    branches:
      - feature/80-explicit-rebalance-model

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/80-explicit-rebalance-model
          fetch-depth: 0
      - name: Patch portfolio rebalance selection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/app/api/v1/portfolio.py')
          text = path.read_text()
          old_signature = '''def rebalance(
              session: Session = Depends(get_db),
              account_id: UUID | None = Query(default=None),
          ) -> RebalanceOut:'''
          new_signature = '''def rebalance(
              session: Session = Depends(get_db),
              account_id: UUID | None = Query(default=None),
              model_id: UUID | None = Query(default=None),
          ) -> RebalanceOut:'''
          if old_signature not in text:
              raise SystemExit('rebalance signature not found')
          text = text.replace(old_signature, new_signature, 1)

          old_selection = '''    holdings = latest_holdings(session, account.id)
              model = session.execute(
                  select(PortfolioModel).order_by(PortfolioModel.generated_at.desc()).limit(1)
              ).scalar_one_or_none()
              if model is None:
                  return RebalanceOut(reason="пакет ещё не посчитан — сравнивать не с чем")
          '''
          new_selection = '''    holdings = latest_holdings(session, account.id)
              if model_id is not None:
                  model = session.execute(
                      select(PortfolioModel).where(PortfolioModel.id == model_id)
                  ).scalar_one_or_none()
                  if model is None:
                      return RebalanceOut(
                          reason="пакет не найден — обновите список и выберите пакет снова"
                      )
              else:
                  models = list(
                      session.execute(
                          select(PortfolioModel)
                          .order_by(PortfolioModel.generated_at.desc())
                          .limit(2)
                      ).scalars()
                  )
                  if not models:
                      return RebalanceOut(
                          reason="пакет ещё не посчитан — сравнивать не с чем"
                      )
                  if len(models) > 1:
                      return RebalanceOut(
                          reason=(
                              "выберите пакет: для ребаланса нужен model_id "
                              "выбранного состава"
                          )
                      )
                  model = models[0]
          '''
          if old_selection not in text:
              raise SystemExit('rebalance selection block not found')
          text = text.replace(old_selection, new_selection, 1)
          path.write_text(text)
          PY
          rm .github/workflows/patch-80-rebalance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/app/api/v1/portfolio.py .github/workflows/patch-80-rebalance.yml
          git commit -m 'fix: bind rebalance to selected portfolio model'
          git push origin HEAD:feature/80-explicit-rebalance-model
