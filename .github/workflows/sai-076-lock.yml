name: SAI-076 lockfile refresh

on:
  pull_request:
    branches:
      - claude/release-y40hk5
    paths:
      - server/pyproject.toml
      - .github/workflows/sai-076-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/sai-076-lighter-sdk-transport'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'

      - name: Resolve exact server lock
        working-directory: server
        run: uv lock

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- server/uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock Lighter SDK for SAI-076'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
