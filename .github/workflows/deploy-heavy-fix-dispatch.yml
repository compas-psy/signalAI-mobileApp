name: Dispatch verified heavy scheduler production fix

on:
  push:
    branches:
      - deploy-heavy-fix-20260830

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-release.yml',
              ref: 'claude/release-y40hk5',
              inputs: {
                source_ref: '30997b3e059c4652a8c8d6fc178ddc43f9186993'
              }
            })
