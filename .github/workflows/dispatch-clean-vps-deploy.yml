name: Dispatch clean VPS release deployment

on:
  pull_request:
    branches:
      - claude/ux-prototype-dark-theme-sv0euq
    types:
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.head_ref == 'codex/thin-client-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical deployment for clean verified SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: 8d688718a90d39982978065469bc19daad20bcd2
        run: |
          set -euo pipefail
          gh workflow run deploy-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/thin-client-v1 \
            -f source_ref="$SOURCE_SHA"
          echo "Dispatched canonical deploy for $SOURCE_SHA"
