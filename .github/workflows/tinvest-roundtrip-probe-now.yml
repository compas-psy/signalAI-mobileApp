name: One-shot T-Invest RoundTrip probe

on:
  pull_request:
    branches:
      - 'claude/release-y40hk5'

permissions:
  contents: read
  issues: write

concurrency:
  group: signalai-tinvest-roundtrip-one-shot-probe-pr
  cancel-in-progress: true

jobs:
  probe:
    name: One-shot provider RoundTrip probe
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: 0ef78e4a5542fcea10e0bbf38e550ce5758b7860
      REPORT_ISSUE: '237'
    steps:
      - name: Check out exact released source
        uses: actions/checkout@v4
        with:
          ref: 0ef78e4a5542fcea10e0bbf38e550ce5758b7860
          fetch-depth: 1

      - name: Validate VPS inputs
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          [ -n "$HOST" ] || { echo '::error::VPS host is missing'; exit 1; }
          [ -n "$KEY" ] || { echo '::error::VPS SSH key is missing'; exit 1; }
          [ -n "$HOST_KEY_SHA256" ] || { echo '::error::VPS host-key pin is missing'; exit 1; }

      - name: Prepare pinned SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Run exact deployed T-Invest Sandbox acceptance
        id: acceptance
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          stdout_file="$RUNNER_TEMP/tinvest-probe.stdout"
          stderr_file="$RUNNER_TEMP/tinvest-probe.stderr"

          set +e
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
            "$USER_NAME@$HOST" \
            "SIGNALAI_SOURCE_SHA=$SOURCE_SHA bash -s" >"$stdout_file" 2>"$stderr_file" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="${SIGNALAI_SOURCE_SHA:?source SHA required}"
          DIR="$HOME/signalai"
          ENV_FILE='/etc/signalai/.env'
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'

          if [ ! -f "$DIR/.signalai-source-sha" ]; then
            printf '%s\n' '{"accepted":false,"error_code":"DEPLOY_ATTESTATION_MISSING"}'
            exit 2
          fi
          DEPLOYED_SHA="$(tr -d '\r\n' < "$DIR/.signalai-source-sha")"
          if [ "$DEPLOYED_SHA" != "$SOURCE_SHA" ]; then
            printf '%s\n' '{"accepted":false,"error_code":"DEPLOY_MISMATCH"}'
            exit 2
          fi
          if [ ! -f "$ENV_FILE" ]; then
            printf '%s\n' '{"accepted":false,"error_code":"SERVER_ENV_MISSING"}'
            exit 2
          fi
          cd "$DIR/server"
          if ! $SUDO docker compose --env-file "$ENV_FILE" ps --status running api | grep -q api; then
            printf '%s\n' '{"accepted":false,"error_code":"API_NOT_RUNNING"}'
            exit 2
          fi

          $SUDO docker compose --env-file "$ENV_FILE" exec -T api \
            python -m app.ops.tinvest_sandbox_acceptance
          REMOTE
          exit_code=$?
          set -e

          result_json="$(tail -n 1 "$stdout_file" | tr -d '\r')"
          sanitized="$(RESULT_JSON="$result_json" python - <<'PY' || true
          import json
          import os

          allowed = {
              'accepted', 'error_code', 'round_trip_complete', 'symbol',
              'account_suffix', 'buy_order_id', 'buy_status', 'buy_executed_lots',
              'sell_order_id', 'sell_status', 'sell_executed_lots',
              'position_flat', 'readiness_proof_id', 'promotion_ready',
          }
          try:
              value = json.loads(os.environ.get('RESULT_JSON', ''))
              if not isinstance(value, dict) or not set(value).issubset(allowed):
                  raise ValueError
              if not isinstance(value.get('accepted'), bool):
                  raise ValueError
              print(json.dumps(value, ensure_ascii=False, separators=(',', ':')))
          except Exception:
              pass
          PY
          )"
          if [ -z "$sanitized" ]; then
            sanitized='{"accepted":false,"error_code":"PROBE_TRANSPORT_OR_OUTPUT_FAILED"}'
          fi

          printf 'exit_code=%s\n' "$exit_code" >> "$GITHUB_OUTPUT"
          printf 'result_b64=%s\n' "$(printf '%s' "$sanitized" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Report sanitized result
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_B64: ${{ steps.acceptance.outputs.result_b64 }}
          ACCEPTANCE_EXIT: ${{ steps.acceptance.outputs.exit_code }}
        with:
          script: |
            let result = {accepted: false, error_code: 'PROBE_PRECHECK_BLOCKED'};
            try {
              if (process.env.RESULT_B64) {
                result = JSON.parse(Buffer.from(process.env.RESULT_B64, 'base64').toString('utf8'));
              }
            } catch (_) {
              result = {accepted: false, error_code: 'PROBE_RESULT_DECODE_FAILED'};
            }
            const ok = result.accepted === true && process.env.ACCEPTANCE_EXIT === '0';
            const body = [
              '### One-shot T-Invest Sandbox RoundTrip probe',
              '',
              `Released SHA: \`${process.env.SOURCE_SHA}\``,
              '',
              '```json',
              JSON.stringify(result, null, 2),
              '```',
              '',
              ok ? '✅ BUY FILL → SELL FILL → FLAT confirmed.' : '❌ RoundTrip not confirmed.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.REPORT_ISSUE),
              body,
            });

      - name: Enforce acceptance
        if: always()
        env:
          ACCEPTANCE_EXIT: ${{ steps.acceptance.outputs.exit_code }}
        run: |
          [ "${ACCEPTANCE_EXIT:-}" = '0' ] || exit 1
