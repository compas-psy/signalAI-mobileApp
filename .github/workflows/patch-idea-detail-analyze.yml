name: Apply analyzer-safe idea detail retry

on:
  push:
    branches:
      - fix/idea-detail-retry-20260814
    paths:
      - .github/workflows/patch-idea-detail-analyze.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/idea-detail-retry-20260814
      - name: Make retry analyzer-safe and remove helper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/state/app_controller.dart')
          text = path.read_text()
          old = """    var full = await _engine.detail(id);\n    if (full == null) {\n      // `/ideas/today` намеренно не несёт TradePlan. Один краткий сбой\n      // detail не должен превращать хороший серверный сигнал в карточку без\n      // Entry/SL/TP и кнопки подтверждения до следующего открытия экрана.\n      // Повторяем только чтение уже созданного плана; генерацию сигнала,\n      // триггер и торговые уровни здесь не пересчитываем.\n      full = await _engine.detail(id);\n    }\n"""
          new = """    var full = await _engine.detail(id);\n    // `/ideas/today` намеренно не несёт TradePlan. Один краткий сбой\n    // detail не должен превращать хороший серверный сигнал в карточку без\n    // Entry/SL/TP и кнопки подтверждения до следующего открытия экрана.\n    // Повторяем только чтение уже созданного плана; генерацию сигнала,\n    // триггер и торговые уровни здесь не пересчитываем.\n    full ??= await _engine.detail(id);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one analyzer target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/patch-idea-detail-analyze.yml
          git diff --check
      - name: Commit surgical lint fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: satisfy analyzer in idea detail retry"
          git push origin HEAD:fix/idea-detail-retry-20260814
