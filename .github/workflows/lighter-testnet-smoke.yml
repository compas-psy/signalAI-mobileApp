name: Lighter testnet smoke
run-name: Lighter testnet smoke · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact current default-branch commit deployed to the VPS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signalai-lighter-testnet-smoke
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable smoke source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate current default head
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/scripts/validate_release_source.py \
            --source-ref "$SOURCE_REF" \
            --repository "${{ github.repository }}" \
            --github-token "$GH_TOKEN"
          echo "source_sha=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  smoke:
    name: Owner-authorized testnet create → cancel
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify smoke workflow provenance
        env:
          EXPECTED_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate SSH prerequisites
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          test -n "$HOST" || { echo '::error::VPS host is missing'; exit 1; }
          test -n "$KEY" || { echo '::error::VPS SSH key is missing'; exit 1; }
          test -n "$HOST_KEY_SHA256" || { echo '::error::VPS host-key pin is missing'; exit 1; }

      - name: Prepare pinned SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Execute evidence-gated smoke on deployed VPS
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_SOURCE_SHA='$SOURCE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="${SIGNALAI_SOURCE_SHA:?source SHA is required}"
          DIR="$HOME/signalai"
          ENV_FILE='/etc/signalai/.env'
          EVIDENCE_FILE='/etc/signalai/lighter-testnet-smoke.json'
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'

          test -f "$DIR/.signalai-source-sha" || {
            echo 'SAI077_BLOCKED: deployed source marker is missing' >&2
            exit 2
          }
          deployed_sha="$(tr -d '[:space:]' < "$DIR/.signalai-source-sha")"
          [ "$deployed_sha" = "$SOURCE_SHA" ] || {
            echo "SAI077_BLOCKED: VPS has $deployed_sha, requested $SOURCE_SHA" >&2
            exit 2
          }
          test -f "$ENV_FILE" || {
            echo 'SAI077_BLOCKED: server env file is missing' >&2
            exit 2
          }
          $SUDO test -s "$EVIDENCE_FILE" || {
            echo 'SAI077_BLOCKED: /etc/signalai/lighter-testnet-smoke.json is missing' >&2
            exit 2
          }

          cd "$DIR/server"
          $SUDO docker compose --env-file "$ENV_FILE" ps --status running api \
            | grep -q api || {
              echo 'SAI077_BLOCKED: API container is not running' >&2
              exit 2
            }

          # The evidence file never leaves the VPS and is streamed directly into
          # the container. The CLI emits only redacted status/tx identifiers.
          $SUDO cat "$EVIDENCE_FILE" \
            | $SUDO docker compose --env-file "$ENV_FILE" exec -T api \
                python -m app.execution.venues.lighter_testnet_smoke_cli
          REMOTE

      - name: Remove SSH key
        if: always()
        run: |
          if [ -f ~/.ssh/id_deploy ]; then
            shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          fi
