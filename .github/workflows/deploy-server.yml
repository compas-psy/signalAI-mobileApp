name: Развернуть сервер на VPS

# Только по кнопке. Ни push, ни pull_request здесь быть не должно:
#
#   * push — потому что развёртывание боевого сервера не может быть побочным
#     эффектом коммита;
#   * pull_request — потому что на публичном репозитории это открыло бы
#     доступ к секретам любому, кто пришлёт PR. GitHub не отдаёт секреты
#     форкам, но полагаться на это, имея root на сервере с торговым
#     доступом, нельзя.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Домен сервера (пусто — без TLS, телефон не подключится)'
        required: false
        default: ''
      admin_ip:
        description: 'IP, с которого вы ходите по SSH (firewall оставит 22 только ему)'
        required: true
      ssh_user:
        description: 'Пользователь SSH (если секрета VPS_USER нет)'
        required: false
        default: 'root'
      host_override:
        description: 'Адрес сервера, если в секрете устарел (хостер сменил IP)'
        required: false
        default: ''
      acme_email:
        description: "Почта для Let's Encrypt"
        required: false
        default: ''
      action:
        description: 'Что сделать'
        required: true
        default: 'bootstrap'
        type: choice
        options:
          - bootstrap      # первичная установка
          - update         # обновить код и перезапустить
          - health         # только проверить состояние
          - logs           # показать последние логи
          - tls            # разобраться с сертификатом и выпустить его
          - caddy          # выдать домен через Caddy, который держит 80/443

# Два развёртывания одновременно — это гонка за один и тот же docker-compose.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Права минимальны: workflow ничего не пишет в репозиторий.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что секреты заданы
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing VPS_HOST|SERVER_HOST"
          [ -n "$USER_NAME" ] || missing="$missing VPS_USER (или задайте ssh_user при запуске)"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY|SSH_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты:$missing"
            echo "Задать: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "Секреты на месте. Значения не печатаются намеренно."

      - name: Подготовить ключ
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Отпечаток хоста берётся сейчас и фиксируется: без этого первое
          # соединение согласится на любой ключ, включая подменённый.
          if ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && \
             [ -s ~/.ssh/known_hosts ]; then
            echo "Отпечаток хоста записан."
          else
            # Не обрываем прогон здесь: следующий шаг даст понятную ошибку
            # соединения вместо загадочного отказа сканера ключей.
            echo "::warning::ssh-keyscan не получил ключ от $HOST — хост может быть недоступен"
            echo "StrictHostKeyChecking=accept-new" >> ~/.ssh/config
          fi

      - name: Первичная установка
        if: ${{ inputs.action == 'bootstrap' }}
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
          DOMAIN: ${{ inputs.domain }}
          ADMIN_IP: ${{ inputs.admin_ip }}
          ACME_EMAIL: ${{ inputs.acme_email }}
        run: |
          # Скрипт передаётся ФАЙЛОМ, а не потоком в `bash -s`.
          #
          # Первая версия отправляла его через heredoc на стандартный ввод
          # ssh. Любая команда внутри — git, apt — наследует тот же ввод и
          # может съесть остаток собственного скрипта. Именно это и вышло:
          # клонирование прошло, а дальше обрыв с кодом 1 и без единой
          # строки объяснения. Отладить такое почти невозможно, поэтому
          # чинится не симптом, а способ передачи.
          cat > /tmp/remote.sh <<'REMOTE'
          set -euxo pipefail
          REPO=https://github.com/compas-psy/signalAI-mobileApp.git
          BRANCH=claude/release-y40hk5
          DIR="$HOME/signalai"

          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            command -v sudo >/dev/null || { echo "нужен sudo либо вход под root"; exit 1; }
            SUDO="sudo"
          fi

          if ! command -v git >/dev/null; then
            $SUDO apt-get update -qq </dev/null
            $SUDO apt-get install -y -qq --no-install-recommends git </dev/null
          fi

          if [ -d "$DIR/.git" ]; then
            git -C "$DIR" fetch --depth 1 origin "$BRANCH" </dev/null
            git -C "$DIR" reset --hard FETCH_HEAD </dev/null
          else
            rm -rf "$DIR"
            git clone --depth 1 -b "$BRANCH" "$REPO" "$DIR" </dev/null
          fi

          test -f "$DIR/server/deploy/bootstrap.sh" || {
            echo "в клоне нет server/deploy/bootstrap.sh — ветка или репозиторий не те"
            ls -la "$DIR" || true
            exit 1
          }

          cd "$DIR/server"
          $SUDO env SIGNALAI_DOMAIN="${SIGNALAI_DOMAIN:-}" \
                    SIGNALAI_ADMIN_IP="${SIGNALAI_ADMIN_IP:-}" \
                    SIGNALAI_ACME_EMAIL="${SIGNALAI_ACME_EMAIL:-}" \
                    bash deploy/bootstrap.sh </dev/null
          REMOTE

          scp -i ~/.ssh/id_deploy -o BatchMode=yes /tmp/remote.sh "$USER_NAME@$HOST:/tmp/signalai-deploy.sh"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_DOMAIN='$DOMAIN' SIGNALAI_ADMIN_IP='$ADMIN_IP' SIGNALAI_ACME_EMAIL='$ACME_EMAIL' bash /tmp/signalai-deploy.sh"

      - name: Обновить код и перезапустить
        if: ${{ inputs.action == 'update' }}
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          cd "$HOME/signalai"
          git fetch --depth 1 origin claude/release-y40hk5
          git reset --hard FETCH_HEAD
          cd server
          # Миграции до перезапуска: сервер не должен стартовать на схеме,
          # которой ещё нет.
          $SUDO docker compose --env-file /etc/signalai/.env run --rm api alembic upgrade head
          $SUDO docker compose --env-file /etc/signalai/.env up -d --build
          REMOTE

      - name: Сертификат
        if: ${{ inputs.action == 'tls' }}
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
          DOMAIN: ${{ inputs.domain }}
          ACME_EMAIL: ${{ inputs.acme_email }}
        run: |
          # Сначала показать, что есть, и только потом чинить. Снаружи видно
          # лишь «handshake failed»; причина всегда внутри конфигурации.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_DOMAIN='$DOMAIN' SIGNALAI_ACME_EMAIL='$ACME_EMAIL' bash -s" <<'REMOTE'
          set -uo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          DOMAIN="${SIGNALAI_DOMAIN:-}"
          [ -n "$DOMAIN" ] || { echo "::error::нужен параметр domain"; exit 1; }

          echo "──────── кто держит 80 и 443 ────────"
          # Главный вопрос. Пока он без ответа, любая правка nginx —
          # угадывание: системный nginx может быть не при делах вовсе, а
          # порты держать другой веб-сервер, в том числе в контейнере.
          $SUDO ss -tlnp 2>/dev/null | grep -E ':(80|443)\s' | sed 's/^/  /' \
            || echo "  ss недоступен"
          echo
          echo "· systemd nginx:"
          $SUDO systemctl is-active nginx 2>/dev/null | sed 's/^/  /'
          echo "· контейнеры с публикацией портов:"
          $SUDO docker ps --format '  {{.Names}} | {{.Image}} | {{.Ports}}' 2>/dev/null \
            || echo "  docker недоступен"
          echo
          echo "· другие веб-серверы:"
          for s in apache2 caddy traefik httpd; do
            state="$($SUDO systemctl is-active "$s" 2>/dev/null || true)"
            [ "$state" = "active" ] && echo "  $s: активен"
          done

          echo
          echo "──────── что сейчас ────────"
          echo "· сайты nginx:"
          $SUDO ls -1 /etc/nginx/sites-enabled/ 2>/dev/null || echo "  каталога нет"
          echo
          echo "· server_name, которые знает nginx:"
          $SUDO nginx -T 2>/dev/null | grep -E "server_name|ssl_certificate " | sed 's/^/  /' || true
          echo
          echo "· сертификаты certbot:"
          $SUDO certbot certificates 2>/dev/null | sed 's/^/  /' || echo "  certbot не установлен"
          echo
          echo "· конфигурация валидна?"
          $SUDO nginx -t 2>&1 | sed 's/^/  /'
          echo
          echo "· блок нашего домена:"
          $SUDO cat /etc/nginx/sites-available/signalai 2>/dev/null | sed 's/^/  /' \
            || echo "  файла нет — сайт не создавался"

          echo
          echo "──────── чиню ────────"

          # Порты держит не системный nginx — значит правкой его конфигурации
          # ничего не изменится, а перезапуск ещё и уронил бы чужой сайт.
          # Останавливаемся и говорим, кто владелец: гадать на боевом сервере
          # владельца дороже, чем сделать второй заход.
          OWNER="$($SUDO ss -tlnp 2>/dev/null | grep -E ':80\s' | head -1)"
          if [ -n "$OWNER" ] && ! printf '%s' "$OWNER" | grep -q nginx; then
            echo "::error::порт 80 держит не nginx: $OWNER"
            echo "Сертификат нужно выпускать там же, где стоит этот сервер."
            exit 1
          fi
          if [ "$($SUDO systemctl is-active nginx 2>/dev/null)" != "active" ] && [ -n "$OWNER" ]; then
            echo "::error::системный nginx не работает, но порт 80 занят: $OWNER"
            exit 1
          fi

          $SUDO apt-get install -y -qq --no-install-recommends certbot python3-certbot-nginx </dev/null >/dev/null 2>&1 || true

          # Битый ssl-блок ломает handshake для своего SNI и при этом
          # оставляет остальные сайты рабочими — снаружи это неотличимо от
          # «сертификата нет». Сносим его до HTTP и выпускаем заново.
          if $SUDO grep -q "ssl_certificate" /etc/nginx/sites-available/signalai 2>/dev/null \
             && ! $SUDO test -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"; then
            echo "· в конфигурации есть ssl_certificate, а файла сертификата нет — вот причина handshake failed"
          fi

          $SUDO tee /etc/nginx/sites-available/signalai >/dev/null <<NGINX
          server {
              listen 80;
              listen [::]:80;
              server_name $DOMAIN;

              # ACME-путь обслуживает сам nginx с диска. Проксировать его в
              # приложение нельзя: приложение ответит 404, и подтверждение
              # домена не пройдёт.
              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/html;
                  default_type "text/plain";
              }

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 120s;
              }
          }
          NGINX
          $SUDO mkdir -p /var/www/html/.well-known/acme-challenge
          $SUDO ln -sf /etc/nginx/sites-available/signalai /etc/nginx/sites-enabled/signalai
          $SUDO nginx -t && $SUDO systemctl reload nginx
          echo "· HTTP-блок пересобран и загружен"

          EMAIL_ARG="--register-unsafely-without-email"
          [ -n "${SIGNALAI_ACME_EMAIL:-}" ] && EMAIL_ARG="-m ${SIGNALAI_ACME_EMAIL}"
          $SUDO certbot --nginx -d "$DOMAIN" --agree-tos --non-interactive \
            --redirect $EMAIL_ARG 2>&1 | tail -30

          echo
          echo "──────── что стало ────────"
          $SUDO certbot certificates 2>/dev/null | grep -A3 "$DOMAIN" | sed 's/^/  /' || true
          $SUDO nginx -t 2>&1 | sed 's/^/  /'
          echo "· проверка изнутри:"
          curl -sS --max-time 15 -o /dev/null -w "  https код %{http_code}\n" "https://$DOMAIN/health" \
            || echo "  https изнутри не отвечает"
          REMOTE

      - name: Домен через Caddy
        if: ${{ inputs.action == 'caddy' }}
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
          DOMAIN: ${{ inputs.domain }}
        run: |
          # Порты 80 и 443 держит контейнер Caddy из прежнего стека владельца.
          # Caddy сам получает сертификаты Let's Encrypt, поэтому правильный
          # ход — не отбирать у него порты, а добавить один блок сайта.
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -uo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          DOMAIN="${SIGNALAI_DOMAIN:-}"
          [ -n "$DOMAIN" ] || { echo "::error::нужен параметр domain"; exit 1; }
          BACKUP=""

          WEB="$($SUDO docker ps --filter publish=443 --format '{{.Names}}' | head -1)"
          [ -n "$WEB" ] || { echo "::error::контейнера с портом 443 нет"; exit 1; }
          echo "· порты 80/443 держит контейнер: $WEB"

          CADDYFILE="$($SUDO docker inspect "$WEB" \
            --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}')"
          [ -n "$CADDYFILE" ] || { echo "::error::Caddyfile не смонтирован снаружи — правку негде хранить"; exit 1; }
          echo "· конфигурация: $CADDYFILE"
          echo
          echo "──────── Caddyfile сейчас ────────"
          $SUDO cat "$CADDYFILE" | sed 's/^/  /'

          if $SUDO grep -q "^$DOMAIN" "$CADDYFILE"; then
            echo
            echo "· блок для $DOMAIN уже есть — ничего не добавляю"
          else
            # Резервная копия до правки: конфигурация фронта чужого рабочего
            # сайта, и откат должен быть в одну команду.
            BACKUP="$CADDYFILE.bak-$(date +%Y%m%d-%H%M%S)"
            $SUDO cp "$CADDYFILE" "$BACKUP"
            echo "· копия: $BACKUP"

            # Caddy живёт в своей сети и до 127.0.0.1:8000 хоста не достаёт:
            # порт опубликован только на петлю. Подключаем контейнер к сети
            # движка и ходим по имени сервиса — публиковать API наружу ради
            # этого было бы шагом назад по §21.
            NET="$($SUDO docker inspect server-api-1 \
              --format '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' | awk '{print $1}')"
            $SUDO docker network connect "$NET" "$WEB" 2>/dev/null \
              && echo "· $WEB подключён к сети $NET" \
              || echo "· $WEB уже в сети $NET"

            $SUDO tee -a "$CADDYFILE" >/dev/null <<CADDY

          # Движок SignalAI. TLS Caddy получает сам; отдельный certbot не нужен.
          $DOMAIN {
              reverse_proxy server-api-1:8000
          }
          CADDY
            echo "· блок добавлен"
          fi

          echo
          echo "──────── проверка и перезагрузка ────────"
          # validate до reload: битая конфигурация не должна уронить сайт.
          # Статус берётся у самого validate, а не у конвейера: `| tail`
          # успешен всегда, и проверка стала бы декоративной.
          VALIDATION="$($SUDO docker exec "$WEB" caddy validate --config /etc/caddy/Caddyfile 2>&1)"
          VALID=$?
          printf '%s\n' "$VALIDATION" | tail -5 | sed 's/^/  /'
          if [ "$VALID" -eq 0 ]; then
            $SUDO docker exec "$WEB" caddy reload --config /etc/caddy/Caddyfile 2>&1 | tail -5 | sed 's/^/  /'
            echo "· конфигурация перезагружена"
          else
            echo "::error::конфигурация невалидна"
            if [ -n "$BACKUP" ]; then
              $SUDO cp "$BACKUP" "$CADDYFILE"
              echo "· откатил на $BACKUP"
            fi
            exit 1
          fi

          echo
          echo "· выпуск сертификата занимает до минуты, проверяю:"
          for i in 1 2 3 4 5 6; do
            code="$(curl -sS --max-time 20 -o /tmp/probe.json -w '%{http_code}' "https://$DOMAIN/health" 2>/dev/null || echo 000)"
            echo "  попытка $i: код $code"
            [ "$code" = "200" ] && { head -c 300 /tmp/probe.json; echo; break; }
            sleep 10
          done
          REMOTE

      - name: Состояние сервера
        if: ${{ always() && inputs.action != 'logs' }}
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            'curl -fsS http://127.0.0.1:8000/health' > health.json 2>/dev/null \
            || { echo "::error::сервер не отвечает на /health"; exit 1; }

          # Секретов в ответе нет: health отдаёт версии, режим и отпечаток
          # конфигурации, но не адреса и не токены.
          python3 - <<'PY'
          import json
          data = json.load(open("health.json"))
          print("Движок:        ", data["engine_version"])
          print("Конфигурация:  ", data["config_hash"][:16], "…")
          print("Режим:         ", data["execution_mode"])
          print("paper_only:    ", data["paper_only"])
          print("Kill switch:   ", data["kill_switch"])
          print("База:          ", data["database"])
          print("Состояние:     ", data["status"])
          for note in data.get("notes", []):
              print("  замечание:", note)
          PY

          if [ "$(python3 -c 'import json;print(json.load(open("health.json"))["paper_only"])')" != "True" ]; then
            echo "::warning::paper_only выключен — боевые заявки разрешены"
          fi

      - name: Логи
        if: ${{ inputs.action == 'logs' || failure() }}
        env:
          HOST: ${{ inputs.host_override || secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || inputs.ssh_user }}
        run: |
          # Разбор статуса — отдельным файлом, а не строкой в -c: кавычки
          # внутри вложенного heredoc внутри ssh экранируются трижды, и
          # первая же попытка стоила прогона.
          cat > /tmp/show_status.py <<'PY'
          import json, sys

          d = json.load(sys.stdin)
          print("инструментов:", d["instruments_total"],
                "| во вселенной:", d["in_universe"],
                "| допущено:", d["tradable"],
                "| с данными:", d["with_data"])
          print("самый свежий бар:", d["last_bar_time"])
          for r in d["instruments"][:12]:
              print("  {:26} 1d={:>5} 1h={:>5}  {}".format(
                  r["instrument_id"], r["daily_bars"], r["hourly_bars"],
                  r["universe_note"][:70]))
          for e in d["recent_quality_events"][:8]:
              print("  ! {}: {}".format(e["flag"], e["detail"][:90]))
          PY
          scp -i ~/.ssh/id_deploy -o BatchMode=yes /tmp/show_status.py "$USER_NAME@$HOST:/tmp/show_status.py"

          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE' \
            || echo "логи получить не удалось"
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          COMPOSE="$SUDO docker compose --env-file /etc/signalai/.env -f $HOME/signalai/server/docker-compose.yml"

          echo "──────── контейнеры ────────"
          # Первый вопрос — существует ли контейнер вообще. Пустые логи у
          # незапущенного сервиса выглядят точно так же, как у молчащего.
          $COMPOSE ps -a

          echo
          echo "──────── API ────────"
          $COMPOSE logs --tail 25 api

          echo
          echo "──────── планировщик ────────"
          # Ради этих строк логи и смотрят: по ним видно, дошла ли загрузка
          # до биржи и что именно она принесла.
          out="$($COMPOSE logs --tail 60 scheduler 2>&1)"
          [ -n "$out" ] && printf '%s\n' "$out" || echo "контейнера планировщика нет"

          echo
          echo "──────── что загружено ────────"
          curl -fsS --max-time 20 http://127.0.0.1:8000/api/v1/market/status 2>/dev/null \
            > /tmp/status.json && python3 /tmp/show_status.py < /tmp/status.json \
            || echo "статус недоступен"
          REMOTE

      - name: Убрать ключ
        if: always()
        run: shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
