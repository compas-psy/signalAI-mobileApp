name: Fix chart retry placement
on:
  push:
    branches: [fix/chart-retry-current-20260814]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-retry-current-20260814
      - name: Patch exact loadIdeaChart location
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/state/app_controller.dart')
          s = p.read_text()
          fn = '  Future<void> loadIdeaChart(Idea idea) async {'
          start = s.index(fn)
          prefix = s[:start].replace('    if (failed) notifyListeners();\n', '')
          body = s[start:]
          marker = '    await Future<void>.microtask(() {});\n'
          pos = body.index(marker)
          insert_at = pos + len(marker)
          if not body[insert_at:].startswith('    if (failed) notifyListeners();\n'):
              body = body[:insert_at] + '    if (failed) notifyListeners();\n' + body[insert_at:]
          s = prefix + body
          assert s.count('    if (failed) notifyListeners();\n') == 1
          p.write_text(s)
          PY
          git diff --check
          grep -n "if (failed) notifyListeners" lib/state/app_controller.dart
      - name: Commit
        shell: bash
        run: |
          git config user.name signalai-ci
          git config user.email actions@users.noreply.github.com
          git add lib/state/app_controller.dart
          git rm .github/workflows/fix-chart-retry-placement.yml
          git commit -m "fix: place chart retry notification after chart yield"
          git push origin HEAD:fix/chart-retry-current-20260814
