name: Runtime logs snapshot

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact default-branch commit used for diagnostic provenance'
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    name: Read production runtime state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify diagnostic provenance
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          [ "$actual_sha" = "$EXPECTED_SHA" ] || {
            echo "::error::requested $EXPECTED_SHA, checked out $actual_sha"
            exit 1
          }

      - name: Verify SSH inputs
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -eu
          test -n "$HOST"
          test -n "$KEY"
          test -n "$HOST_KEY_SHA256"

      - name: Prepare pinned SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Runtime snapshot
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          COMPOSE="$SUDO docker compose --env-file /etc/signalai/.env -f $HOME/signalai/server/docker-compose.yml"

          echo "──────── containers ────────"
          $COMPOSE ps -a

          echo
          echo "──────── api logs (30h) ────────"
          $COMPOSE logs --since 30h --tail 250 api

          echo
          echo "──────── scheduler logs (30h) ────────"
          $COMPOSE logs --since 30h --tail 600 scheduler scheduler-heavy

          echo
          echo "──────── canonical scan funnel (read-only) ────────"
          $COMPOSE exec -T api python - <<'PYSCAN'
          from collections import Counter
          from datetime import UTC, datetime
          from decimal import Decimal

          from sqlalchemy import select

          from app.config import get_config
          from app.db import get_session_factory
          from app.market.economic_events import EconomicEventCalendar
          from app.models import Instrument
          from app.pipeline.scan import scan_instrument
          from app.risk.sizing import RiskState

          session = get_session_factory()()
          try:
              instruments = list(
                  session.execute(
                      select(Instrument).where(
                          Instrument.in_universe.is_(True),
                          Instrument.is_tradable.is_(True),
                      )
                  ).scalars()
              )
              cfg = get_config()
              now = datetime.now(UTC)
              calendar = EconomicEventCalendar((), source_available=False)
              risk_state = RiskState(risk_equity=Decimal("100000"))

              stage_counts = Counter()
              reason_counts = Counter()
              venue_counts = Counter()
              outcome_counts = Counter()
              samples: dict[tuple[str, str], list[str]] = {}

              for instrument in instruments:
                  venue = instrument.venue.value
                  venue_counts[venue] += 1
                  try:
                      idea, skipped, rejections = scan_instrument(
                          session,
                          instrument,
                          cfg=cfg,
                          risk_state=risk_state,
                          now=now,
                          event_calendar=calendar,
                      )
                  except Exception as exc:
                      stage = "exception"
                      reason = f"{type(exc).__name__}: {exc}"
                      stage_counts[(venue, stage)] += 1
                      reason_counts[(venue, stage, reason)] += 1
                      samples.setdefault((venue, stage), []).append(instrument.instrument_id)
                      continue

                  if skipped:
                      for item in skipped:
                          stage_counts[(venue, item.stage)] += 1
                          reason_counts[(venue, item.stage, item.reason)] += 1
                          samples.setdefault((venue, item.stage), []).append(item.instrument_id)
                      continue

                  if idea is not None:
                      outcome_counts[(venue, f"idea:{idea.quality_status.value}")] += 1
                  elif rejections:
                      outcome_counts[(venue, "strategy_rejected")] += 1
                  else:
                      outcome_counts[(venue, "no_outcome")] += 1

              print(f"instruments={len(instruments)} by_venue={dict(sorted(venue_counts.items()))}")
              print("early_stages:")
              for (venue, stage), count in sorted(stage_counts.items()):
                  sample = samples.get((venue, stage), [])[:5]
                  print(f"  {venue} / {stage}: {count}; sample={sample}")
              print("exact_reasons:")
              for (venue, stage, reason), count in reason_counts.most_common(30):
                  print(f"  {count}x {venue} / {stage}: {reason}")
              print("post_early_gate_outcomes:")
              for (venue, outcome), count in sorted(outcome_counts.items()):
                  print(f"  {venue} / {outcome}: {count}")
          finally:
              session.rollback()
              session.close()
          PYSCAN

          echo
          echo "──────── public health ────────"
          curl -fsS --max-time 20 http://127.0.0.1:8000/health
          echo

          echo "──────── protected API boundary ────────"
          status="$(curl -sS --max-time 20 -o /tmp/signalai-market-status.out -w '%{http_code}' \
            http://127.0.0.1:8000/api/v1/market/status)"
          rm -f /tmp/signalai-market-status.out
          [ "$status" = "401" ] || {
            echo "protected market status returned HTTP $status; expected 401 without device credential" >&2
            exit 1
          }
          echo "market/status correctly rejects unauthenticated diagnostics with HTTP 401"
          REMOTE

      - name: Remove SSH key
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
