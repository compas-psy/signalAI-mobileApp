name: Build release sideload APK

on:
  push:
    branches:
      - 'claude/release-y40hk5'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: signalai-sideload-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Подготовить адрес и токен движка
        env:
          EXPLICIT_URL: ${{ secrets.SIGNALAI_API_BASE_URL }}
          EXPLICIT_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -eu

          if [ -n "$EXPLICIT_URL" ]; then
            api_url="$EXPLICIT_URL"
          else
            [ -n "$HOST" ] && [ -n "$KEY" ] || {
              echo '::error::нет SIGNALAI_API_BASE_URL и невозможно прочитать домен с VPS'
              exit 1
            }
            install -d -m 700 ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
            ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

            cat > /tmp/signalai-public-url.sh <<'REMOTE'
            set -euo pipefail
            SUDO=''
            [ "$(id -u)" -eq 0 ] || SUDO='sudo'
            file='/etc/nginx/sites-available/signalai'
            [ -f "$file" ] || {
              echo 'конфигурация публичного домена SignalAI не найдена' >&2
              exit 1
            }
            domain="$($SUDO awk '
              $1 == "server_name" {
                gsub(/;/, "", $2)
                if ($2 != "_") { print $2; exit }
              }
            ' "$file")"
            [ -n "$domain" ] || {
              echo 'server_name SignalAI пуст' >&2
              exit 1
            }
            printf 'https://%s' "$domain"
            REMOTE
            scp -i ~/.ssh/id_deploy -o BatchMode=yes \
              /tmp/signalai-public-url.sh "$USER_NAME@$HOST:/tmp/"
            api_url="$(ssh -i ~/.ssh/id_deploy -o BatchMode=yes \
              "$USER_NAME@$HOST" 'bash /tmp/signalai-public-url.sh')"
          fi

          case "$api_url" in
            https://*) ;;
            *) echo '::error::API приложения обязан использовать HTTPS'; exit 1 ;;
          esac

          if [ -n "$EXPLICIT_TOKEN" ]; then
            token="$EXPLICIT_TOKEN"
          else
            [ -n "$KEY" ] || {
              echo '::error::нет ни SIGNALAI_DEVICE_TOKEN, ни SSH-секрета'
              exit 1
            }
            token="$(printf '%s' "$KEY" | openssl dgst -sha256 \
              -hmac 'signalai-device-token-v1' | awk '{print $2}')"
          fi
          echo "::add-mask::$token"
          printf 'RUNTIME_API_BASE_URL=%s\n' "$api_url" >> "$GITHUB_ENV"
          printf 'RUNTIME_DEVICE_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          unset token
          echo "Публичный HTTPS-адрес движка определён."

      - name: Определить источник ключа подписи
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo 'from_secrets=true' >> "$GITHUB_OUTPUT"
          else
            echo 'from_secrets=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Кэш постоянного sideload-ключа
        if: steps.signing.outputs.from_secrets == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.signalai-sideload
          key: sideload-keystore-v1

      - name: Подготовить подпись
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -eu
          KEY_DIR="$HOME/.signalai-sideload"
          KEYSTORE="$KEY_DIR/sideload.jks"
          mkdir -p "$KEY_DIR"

          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            ALIAS="$KEY_ALIAS"
          else
            STORE_PASS='sideload'
            KEY_PASS='sideload'
            ALIAS='sideload'
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair -v \
                -keystore "$KEYSTORE" \
                -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
                -alias "$ALIAS" \
                -keyalg RSA -keysize 4096 -validity 10000 \
                -dname 'CN=SignalAI Sideload, OU=Personal, O=SignalAI, C=RU'
            fi
          fi

          cat > android/key.properties <<PROPS
          storeFile=$KEYSTORE
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          PROPS

      - name: Собрать APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SIGNALAI_API_BASE_URL="$RUNTIME_API_BASE_URL" \
            --dart-define=SIGNALAI_DEVICE_TOKEN="$RUNTIME_DEVICE_TOKEN"
          rm -f android/key.properties

      - name: Проверить подпись
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)"
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Опубликовать APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk signalai-sideload.apk
          gh release view sideload >/dev/null 2>&1 || \
            gh release create sideload \
              --prerelease \
              --title 'SignalAI sideload' \
              --notes 'Персональная sideload-сборка SignalAI. Устанавливается поверх предыдущей при неизменной подписи.'
          gh release upload sideload signalai-sideload.apk --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: signalai-sideload-${{ github.run_number }}
          path: signalai-sideload.apk
          retention-days: 7

      - name: Записать итог сборки
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then icon='✅'; else icon='❌'; fi
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "$icon **Sideload APK: $RESULT**

          Commit: \`$GITHUB_SHA\`
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          APK: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/sideload"
