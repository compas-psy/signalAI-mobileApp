name: Runtime release command

on:
  issue_comment:
    types:
      - created

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    name: Dispatch owner release command
    if: >-
      github.event.issue.number == 1 &&
      github.actor == github.repository_owner &&
      (github.event.comment.body == '/build-apk' ||
       github.event.comment.body == '/release-full' ||
       github.event.comment.body == '/apk-status' ||
       github.event.comment.body == '/telegram-sample' ||
       github.event.comment.body == '/runtime-logs' ||
       github.event.comment.body == '/lighter-testnet-smoke')
    runs-on: ubuntu-latest
    steps:
      - name: Run owner release command
        uses: actions/github-script@v7
        env:
          COMMAND: ${{ github.event.comment.body }}
        with:
          script: |
            const command = process.env.COMMAND;

            if (command === '/apk-status') {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'android-sideload.yml',
                per_page: 5,
              });
              const runs = response.data.workflow_runs;
              const lines = runs.length
                ? runs.map((run) => [
                    `- run \`${run.id}\`: **${run.status}** / ${run.conclusion ?? 'pending'}`,
                    `  source: \`${run.head_sha}\``,
                    `  event: \`${run.event}\` · ${run.html_url}`,
                  ].join('\n')).join('\n')
                : '- no Android sideload runs found';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 1,
                body: `🔎 **APK workflow status**\n\n${lines}`,
              });
              return;
            }

            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const defaultBranch = repo.data.default_branch;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: defaultBranch,
            });
            const sourceSha = branch.data.commit.sha;
            let runtimeLogsRun = null;

            if (command === '/build-apk') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'android-sideload.yml',
                ref: defaultBranch,
                inputs: {
                  source_ref: sourceSha,
                  mode: 'thin',
                  api_base_url: '',
                  backup_api_base_url: '',
                },
              });
            } else if (command === '/release-full') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'release-cumulative.yml',
                ref: defaultBranch,
                inputs: { source_ref: sourceSha },
              });
            } else if (command === '/telegram-sample') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'telegram-sample.yml',
                ref: defaultBranch,
                inputs: { source_ref: sourceSha },
              });
            } else if (command === '/runtime-logs') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'runtime-logs.yml',
                ref: defaultBranch,
                inputs: { source_ref: sourceSha },
              });

              for (let attempt = 0; attempt < 6 && !runtimeLogsRun; attempt += 1) {
                await new Promise((resolve) => setTimeout(resolve, 2000));
                const response = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'runtime-logs.yml',
                  event: 'workflow_dispatch',
                  branch: defaultBranch,
                  per_page: 10,
                });
                runtimeLogsRun = response.data.workflow_runs.find(
                  (run) => run.head_sha === sourceSha,
                ) ?? null;
              }
            } else if (command === '/lighter-testnet-smoke') {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'lighter-testnet-smoke.yml',
                ref: defaultBranch,
                inputs: { source_ref: sourceSha },
              });
            } else {
              core.setFailed(`Unsupported command: ${command}`);
              return;
            }

            const runtimeLine = command === '/runtime-logs'
              ? runtimeLogsRun
                ? `\nRuntime logs workflow: \`${runtimeLogsRun.id}\` · ${runtimeLogsRun.html_url}`
                : '\nRuntime logs workflow: dispatched; run link not visible yet'
              : '';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: `🚀 **Release command accepted**\n\nCommand: \`${command}\`\nSource: \`${sourceSha}\`${runtimeLine}`,
            });
