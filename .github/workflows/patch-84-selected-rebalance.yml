name: Apply selected package rebalance mobile patch

on:
  push:
    branches:
      - feature/84-selected-package-rebalance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/84-selected-package-rebalance
          fetch-depth: 0
      - name: Patch mobile selected-package rebalance
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1. Domain model.
          path = Path('lib/domain/portfolio/package.dart')
          text = path.read_text()
          addition = r'''

/// Одна ручная корректировка текущего счёта к выбранному серверному пакету.
class PortfolioRebalanceAction {
  const PortfolioRebalanceAction({
    required this.instrumentId,
    required this.symbol,
    required this.side,
    required this.targetWeight,
    required this.actualWeight,
    required this.amountRub,
    required this.reason,
  });

  final String instrumentId;
  final String symbol;
  final String side;
  final double targetWeight;
  final double actualWeight;
  final double amountRub;
  final String reason;
}

/// Advisory-only сверка текущего инвестиционного счёта с одним пакетом.
///
/// Здесь намеренно нет executable/order id: инвестиционный ребаланс остаётся
/// подсказкой для ручного решения владельца, а не торговой командой.
class PortfolioRebalance {
  const PortfolioRebalance({
    required this.modelId,
    required this.needed,
    required this.urgent,
    required this.reason,
    required this.maxDrift,
    required this.totalValue,
    required this.actions,
    this.unavailableReason,
  });

  const PortfolioRebalance.unavailable(String reason)
      : modelId = '',
        needed = false,
        urgent = false,
        reason = '',
        maxDrift = 0,
        totalValue = 0,
        actions = const [],
        unavailableReason = reason;

  final String modelId;
  final bool needed;
  final bool urgent;
  final String reason;
  final double maxDrift;
  final double totalValue;
  final List<PortfolioRebalanceAction> actions;
  final String? unavailableReason;

  bool get isAvailable => unavailableReason == null;
}
'''
          if 'class PortfolioRebalance {' not in text:
              text += addition
              path.write_text(text)

          # 2. Contract parser.
          path = Path('lib/data/api/engine_contract.dart')
          text = path.read_text()
          anchor = '  static String symbolOf(String instrumentId) {'
          method = r'''  /// Разбор advisory-only ребаланса выбранного пакета.
  static PortfolioRebalance portfolioRebalance(Map<String, dynamic> json) {
    final actions = <PortfolioRebalanceAction>[];
    final rawActions = json['actions'];
    if (rawActions is List) {
      for (final raw in rawActions) {
        if (raw is! Map<String, dynamic>) continue;
        actions.add(
          PortfolioRebalanceAction(
            instrumentId: '${raw['instrument_id'] ?? ''}',
            symbol: '${raw['symbol'] ?? ''}',
            side: '${raw['side'] ?? ''}',
            targetWeight: _num(raw['target_weight']),
            actualWeight: _num(raw['actual_weight']),
            amountRub: _num(raw['amount_rub']),
            reason: '${raw['reason'] ?? ''}',
          ),
        );
      }
    }
    return PortfolioRebalance(
      modelId: '${json['model_id'] ?? ''}',
      needed: json['needed'] == true,
      urgent: json['urgent'] == true,
      reason: '${json['reason'] ?? ''}',
      maxDrift: _num(json['max_drift']),
      totalValue: _num(json['total_value']),
      actions: actions,
    );
  }

'''
          if 'static PortfolioRebalance portfolioRebalance' not in text:
              if anchor not in text:
                  raise SystemExit('engine contract anchor not found')
              text = text.replace(anchor, method + anchor, 1)
              path.write_text(text)

          # 3. Engine client selected-model request and mismatch guard.
          path = Path('lib/data/api/engine_client.dart')
          text = path.read_text()
          anchor = '  /// Ранние сигналы: гипотезы и готовность источников.\n'
          method = r'''  /// Сверить текущий инвестиционный счёт с выбранным пакетом.
  ///
  /// GET остаётся advisory-only: клиент не получает ни order id, ни флага
  /// исполнения и не может превратить ответ в заявку.
  Future<PortfolioRebalance> portfolioRebalance(String modelId) async {
    final selected = modelId.trim();
    if (selected.isEmpty) {
      return const PortfolioRebalance.unavailable('Пакет не выбран.');
    }
    if (!isConfigured) {
      return const PortfolioRebalance.unavailable(_noAddress);
    }
    try {
      final raw = await _api.get(
        '$_base/portfolio/rebalance?model_id=${Uri.encodeQueryComponent(selected)}',
      );
      final result = EngineContract.portfolioRebalance(raw);
      if (result.modelId.isNotEmpty && result.modelId != selected) {
        return const PortfolioRebalance.unavailable(
          'Движок вернул ребаланс другого пакета. Обновите пакеты и повторите.',
        );
      }
      return result;
    } catch (error) {
      return PortfolioRebalance.unavailable(_reason(error));
    }
  }

'''
          if 'Future<PortfolioRebalance> portfolioRebalance' not in text:
              if anchor not in text:
                  raise SystemExit('engine client anchor not found')
              text = text.replace(anchor, method + anchor, 1)
              path.write_text(text)

          # 4. Controller state, exact-model loading and stale-response guard.
          path = Path('lib/state/app_controller.dart')
          text = path.read_text()
          fields_anchor = '''  PortfolioState? _portfolio;\n  bool _portfolioLoading = false;\n'''
          fields = '''  PortfolioState? _portfolio;\n  bool _portfolioLoading = false;\n  PortfolioRebalance? _portfolioRebalance;\n  String? _portfolioRebalanceModelId;\n  String? _portfolioRebalanceLoadingModelId;\n'''
          if '_portfolioRebalanceModelId' not in text:
              if fields_anchor not in text:
                  raise SystemExit('controller fields anchor not found')
              text = text.replace(fields_anchor, fields, 1)

          getters_anchor = '''  PortfolioState? get portfolio => _portfolio;\n  bool get portfolioLoading => _portfolioLoading;\n'''
          getters = '''  PortfolioState? get portfolio => _portfolio;\n  bool get portfolioLoading => _portfolioLoading;\n  PortfolioRebalance? get portfolioRebalance => _portfolioRebalance;\n  String? get portfolioRebalanceModelId => _portfolioRebalanceModelId;\n  String? get portfolioRebalanceLoadingModelId => _portfolioRebalanceLoadingModelId;\n'''
          if 'get portfolioRebalance =>' not in text:
              if getters_anchor not in text:
                  raise SystemExit('controller getters anchor not found')
              text = text.replace(getters_anchor, getters, 1)

          method_anchor = '  // ── Ранние сигналы ──────────────────────────────────────────────────────\n'
          method = r'''  /// Сверить счёт именно с выбранным серверным пакетом.
  ///
  /// Снимок текущих позиций отправляется непосредственно перед сравнением.
  /// При быстром переключении пакетов поздний ответ старого запроса
  /// отбрасывается и не может появиться под карточкой нового состава.
  Future<void> loadPortfolioRebalance(
    EnginePackage package, {
    bool force = false,
  }) async {
    final modelId = package.id.trim();
    if (modelId.isEmpty) {
      _portfolioRebalanceModelId = '';
      _portfolioRebalance = const PortfolioRebalance.unavailable(
        'Пакет не выбран.',
      );
      notifyListeners();
      return;
    }
    if (_portfolioRebalanceLoadingModelId == modelId) return;
    if (!force &&
        _portfolioRebalanceModelId == modelId &&
        _portfolioRebalance != null) {
      return;
    }

    _portfolioRebalanceModelId = modelId;
    _portfolioRebalance = null;
    _portfolioRebalanceLoadingModelId = modelId;
    await Future<void>.microtask(() {});
    notifyListeners();
    try {
      await _engineReady;
      await _syncHoldings();
      final result = await _engine.portfolioRebalance(modelId);
      if (_portfolioRebalanceModelId == modelId) {
        _portfolioRebalance = result;
      }
    } finally {
      if (_portfolioRebalanceLoadingModelId == modelId) {
        _portfolioRebalanceLoadingModelId = null;
        notifyListeners();
      }
    }
  }

'''
          if 'Future<void> loadPortfolioRebalance' not in text:
              if method_anchor not in text:
                  raise SystemExit('controller method anchor not found')
              text = text.replace(method_anchor, method + method_anchor, 1)
          path.write_text(text)

          # 5. Package screen: selected package -> advisory actions/reason.
          path = Path('lib/ui/screens/capital_screen.dart')
          text = path.read_text()
          evidence = '''          _PackageEvidence(package: package),\n'''
          replacement = '''          _PackageEvidence(package: package),\n          const SizedBox(height: 12),\n          _SelectedPackageRebalance(\n            controller: controller,\n            package: package,\n          ),\n'''
          if '_SelectedPackageRebalance(' not in text:
              if evidence not in text:
                  raise SystemExit('package evidence anchor not found')
              text = text.replace(evidence, replacement, 1)

          class_anchor = '/// Шапка пакета: диапазон доходности, риск, полоса состава.\n'
          widget = r'''/// Ручные действия для приведения текущего счёта к выбранному пакету.
class _SelectedPackageRebalance extends StatefulWidget {
  const _SelectedPackageRebalance({
    required this.controller,
    required this.package,
  });

  final AppController controller;
  final EnginePackage package;

  @override
  State<_SelectedPackageRebalance> createState() =>
      _SelectedPackageRebalanceState();
}

class _SelectedPackageRebalanceState
    extends State<_SelectedPackageRebalance> {
  @override
  void initState() {
    super.initState();
    _load();
  }

  @override
  void didUpdateWidget(covariant _SelectedPackageRebalance oldWidget) {
    super.didUpdateWidget(oldWidget);
    if (oldWidget.package.id != widget.package.id) _load();
  }

  void _load() {
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) return;
      widget.controller.loadPortfolioRebalance(widget.package);
    });
  }

  @override
  Widget build(BuildContext context) {
    final controller = widget.controller;
    final modelId = widget.package.id;
    final active = controller.portfolioRebalanceModelId == modelId;
    final loading = controller.portfolioRebalanceLoadingModelId == modelId;
    final rebalance = active ? controller.portfolioRebalance : null;

    if (loading || rebalance == null) {
      return _PackagesNote(
        title: 'Мой счёт → этот пакет',
        text: 'Сверяю текущие позиции с выбранным составом…',
        busy: true,
      );
    }
    if (!rebalance.isAvailable) {
      return _PackagesNote(
        title: 'Ребаланс недоступен',
        text: rebalance.unavailableReason!,
        onRetry: () => controller.loadPortfolioRebalance(
          widget.package,
          force: true,
        ),
      );
    }

    return SectionCard(
      child: Column(
        crossAxisAlignment: CrossAxisAlignment.start,
        children: [
          Row(
            children: [
              const Expanded(child: SectionLabel('МОЙ СЧЁТ → ЭТОТ ПАКЕТ')),
              OutlineBadge(
                label: rebalance.urgent
                    ? 'срочно'
                    : (rebalance.needed ? 'нужно поправить' : 'в норме'),
                color: rebalance.needed ? C.warning : C.success,
                borderColor:
                    rebalance.needed ? C.warningBorder : C.successBorder,
                background:
                    rebalance.needed ? C.warningFaint : C.successFaint,
                fontWeight: 700,
              ),
            ],
          ),
          const SizedBox(height: 8),
          Text(
            rebalance.reason.isNotEmpty
                ? rebalance.reason
                : (rebalance.needed
                    ? 'Есть отклонения от выбранного состава.'
                    : 'Отклонения ниже порога ребаланса.'),
            style: T.body(11.5, color: C.muted, height: 1.45),
          ),
          if (rebalance.actions.isNotEmpty) ...[
            const SizedBox(height: 10),
            for (final action in rebalance.actions) ...[
              Row(
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          action.symbol.isEmpty
                              ? action.instrumentId
                              : action.symbol,
                          style: T.body(12.5, weight: 700),
                        ),
                        const SizedBox(height: 2),
                        Text(
                          '${(action.actualWeight * 100).toStringAsFixed(1)}% → '
                          '${(action.targetWeight * 100).toStringAsFixed(1)}% · '
                          '${action.reason}',
                          style: T.mono(10.5, color: C.muted),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(width: 10),
                  Text(
                    '${action.side == 'BUY' ? 'Купить' : 'Сократить'} '
                    '${action.amountRub.round()} ₽',
                    style: T.mono(
                      11.5,
                      weight: 700,
                      color: action.side == 'BUY' ? C.success : C.warning,
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 8),
            ],
          ],
          const SizedBox(height: 2),
          Text(
            'Только подсказка для ручного исполнения — заявок этот экран не отправляет.',
            style: T.mono(9.5, color: C.faint, height: 1.35),
          ),
        ],
      ),
    );
  }
}

'''
          if 'class _SelectedPackageRebalance extends' not in text:
              if class_anchor not in text:
                  raise SystemExit('package head anchor not found')
              text = text.replace(class_anchor, widget + class_anchor, 1)
          path.write_text(text)

          # 6. Fix fake client to override the actual ApiClient GET contract.
          path = Path('test/portfolio_rebalance_client_test.dart')
          text = path.read_text()
          text = text.replace(
              'Future<Map<String, dynamic>> getJson(String path) async {',
              'Future<Map<String, dynamic>> get(String path) async {',
          )
          path.write_text(text)
          PY
          rm .github/workflows/patch-84-selected-rebalance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/domain/portfolio/package.dart lib/data/api/engine_contract.dart lib/data/api/engine_client.dart lib/state/app_controller.dart lib/ui/screens/capital_screen.dart test/portfolio_rebalance_client_test.dart .github/workflows/patch-84-selected-rebalance.yml
          git commit -m 'feat: show selected package rebalance in mobile app'
          git push origin HEAD:feature/84-selected-package-rebalance
