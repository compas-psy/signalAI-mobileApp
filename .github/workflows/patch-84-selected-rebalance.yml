name: Apply selected package rebalance mobile patch

on:
  push:
    branches:
      - feature/84-selected-package-rebalance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/84-selected-package-rebalance
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch84.py
      - name: Commit patch and remove helpers
        run: |
          rm .github/patch84.py .github/workflows/patch-84-selected-rebalance.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: show selected package rebalance in mobile app'
          git push origin HEAD:feature/84-selected-package-rebalance
