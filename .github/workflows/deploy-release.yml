name: Deploy release to VPS

# Каноническое обновление VPS. Только вручную и только из явно выбранного ref,
# который один раз разрешается в commit SHA до QA и деплоя.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact branch, tag or commit to deploy'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: signalai-production-deploy
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve deployment source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - name: Reject an empty source ref
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test -n "$SOURCE_REF" || {
            echo '::error::source_ref must not be empty'
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
      - name: Pin source to an immutable commit
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse --verify HEAD^{commit})"
          test "${#source_sha}" -eq 40
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          {
            echo '### Production deployment source'
            echo
            echo "- requested ref: \`$SOURCE_REF\`"
            echo "- resolved commit: \`$source_sha\`"
            echo '- Quality gate and VPS deploy receive this exact SHA.'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality gate for deployment SHA
    needs: resolve
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.resolve.outputs.source_sha }}

  deploy:
    needs:
      - resolve
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out the QA-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1

      - name: Verify local deployment provenance
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          [ "$actual_sha" = "$EXPECTED_SHA" ] || {
            echo "::error::QA verified $EXPECTED_SHA, deploy checked out $actual_sha"
            exit 1
          }
          echo "Deploying QA-verified commit $actual_sha"

      - name: Проверить секреты
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          DEVICE_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
        run: |
          set -eu
          missing=''
          [ -n "$HOST" ] || missing="$missing VPS_HOST|SERVER_HOST"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY|SSH_SECRET"
          [ -n "$DEVICE_TOKEN" ] || missing="$missing SIGNALAI_DEVICE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты:$missing"
            exit 1
          fi

      - name: Подготовить SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo '::error::не удалось получить SSH host key сервера'
            exit 1
          fi

      - name: Подготовить закрытые файлы деплоя
        env:
          DEVICE_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
        run: |
          set -eu
          umask 077
          test -n "$DEVICE_TOKEN"
          case "$DEVICE_TOKEN" in
            *[!A-Za-z0-9._~-]*)
              echo '::error::SIGNALAI_DEVICE_TOKEN must be one line of URL-safe characters'
              exit 1
              ;;
          esac
          [ "${#DEVICE_TOKEN}" -ge 32 ] || {
            echo '::error::SIGNALAI_DEVICE_TOKEN must contain at least 32 characters'
            exit 1
          }
          # Значение не печатается и не передаётся через argv. Владелец вводит
          # тот же сохранённый у себя token один раз в приложении.
          printf '%s' "$DEVICE_TOKEN" | base64 -w0 > /tmp/signalai-device-token.b64

          cat > /tmp/signalai-update.sh <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="${SIGNALAI_SOURCE_SHA:?deployment source SHA is required}"
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo 'invalid deployment source SHA' >&2; exit 1 ;;
          esac
          [ "${#SOURCE_SHA}" -eq 40 ] || { echo 'source SHA must have 40 hex characters' >&2; exit 1; }
          DIR="$HOME/signalai"
          ENV_FILE='/etc/signalai/.env'
          TOKEN_FILE='/tmp/signalai-device-token.b64'
          cleanup_token() {
            rm -f "$TOKEN_FILE"
            unset token 2>/dev/null || true
          }
          trap cleanup_token EXIT
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'

          test -s "$TOKEN_FILE"
          token="$(base64 -d < "$TOKEN_FILE")"
          rm -f "$TOKEN_FILE"

          cd "$DIR"
          git fetch --depth 1 origin "$SOURCE_SHA" </dev/null
          git reset --hard FETCH_HEAD </dev/null
          deployed_sha="$(git rev-parse --verify HEAD^{commit})"
          [ "$deployed_sha" = "$SOURCE_SHA" ] || {
            echo "fetched $deployed_sha instead of requested $SOURCE_SHA" >&2
            exit 1
          }
          echo "── исходный commit ── $deployed_sha"

          test -f "$ENV_FILE"
          $SUDO sed -i '/^SIGNALAI_DEVICE_TOKEN=/d' "$ENV_FILE"
          printf 'SIGNALAI_DEVICE_TOKEN=%s\n' "$token" | $SUDO tee -a "$ENV_FILE" >/dev/null
          unset token
          $SUDO chmod 600 "$ENV_FILE"

          cd server

          # Локальная модель критика (ТЗ §26.2). Включается один раз и
          # только если на диске есть запас: веса весят гигабайты, а сервер
          # с забитым диском ломается целиком, а не частично.
          #
          # Строки дописываются, только если ключа ещё нет. Так позднейшая
          # правка владельца выигрывает у выкладки — иначе каждый деплой
          # молча возвращал бы настройки к своим.
          LLM_PROFILE=''
          FREE_GB="$(df --output=avail -BG / | tail -1 | tr -dc '0-9')"
          echo "── место на диске ── ${FREE_GB}G свободно"
          if [ "${FREE_GB:-0}" -lt 12 ]; then
            echo 'модель не включается: меньше 12G свободно'
          else
            $SUDO sed -i 's/^SIGNALAI_LLM_MEMORY_LIMIT=5g$/SIGNALAI_LLM_MEMORY_LIMIT=3g/' "$ENV_FILE"
            grep -q '^SIGNALAI_LLM_BASE_URL=' "$ENV_FILE" || printf '%s\n' \
              'SIGNALAI_LLM_BASE_URL=http://ollama:11434' \
              'SIGNALAI_LLM_MODEL=qwen3.5:4b' \
              'SIGNALAI_LLM_NUM_CTX=4096' \
              'SIGNALAI_LLM_TIMEOUT_SECONDS=180' \
              'SIGNALAI_LLM_MEMORY_LIMIT=3g' \
              | $SUDO tee -a "$ENV_FILE" >/dev/null
            LLM_PROFILE='--profile llm'
          fi

          $SUDO docker compose --env-file "$ENV_FILE" $LLM_PROFILE config >/dev/null

          # Порядок здесь принципиален, и раньше он был неверным.
          #
          # `run --rm api alembic upgrade head` запускается на том образе,
          # который уже лежит на машине, — то есть на ПРЕДЫДУЩЕЙ версии кода.
          # Новой миграции в нём ещё нет, и alembic честно сообщает, что
          # применять нечего. Именно так и выглядел лог деплоя 31.07: две
          # строки INFO и ни одной «Running upgrade», хотя ревизия 0005 была
          # в коммите. Схему спасала только собственная команда контейнера
          # api (`alembic upgrade head && uvicorn`), выполнявшаяся уже после
          # пересборки, — то есть правильный результат получался случайно, а
          # в логе деплоя его не было видно вовсе.
          #
          # Теперь образ собирается первым, и миграция идёт на нём. В логе
          # прогона видно, какая ревизия применилась, — а это единственное
          # место, где вообще можно это проверить.
          $SUDO docker compose --env-file "$ENV_FILE" build api scheduler </dev/null
          $SUDO docker compose --env-file "$ENV_FILE" run --rm -T api alembic upgrade head </dev/null
          $SUDO docker compose --env-file "$ENV_FILE" $LLM_PROFILE \
            up -d --remove-orphans </dev/null

          # Веса тянутся один раз и живут в томе. Загрузка идёт в фоне и не
          # держит выкладку: несколько гигабайт по сети — не повод считать
          # деплой неудавшимся, а первый прогон разведки всё равно позже.
          if [ -n "$LLM_PROFILE" ]; then
            model="$(grep '^SIGNALAI_LLM_MODEL=' "$ENV_FILE" | cut -d= -f2-)"
            if $SUDO docker compose --env-file "$ENV_FILE" $LLM_PROFILE \
                 exec -T ollama ollama list 2>/dev/null | grep -q "${model%%:*}"; then
              echo "── модель ── ${model} уже загружена"
            else
              echo "── модель ── тяну ${model} в фоне"
              $SUDO docker compose --env-file "$ENV_FILE" $LLM_PROFILE \
                exec -dT ollama ollama pull "$model" 2>&1 | tail -3 \
                || echo 'загрузка не запустилась: смотрите логи ollama'
            fi
          fi

          echo '── ревизия схемы ──'
          $SUDO docker compose --env-file "$ENV_FILE" run --rm -T api alembic current </dev/null

          echo '── контейнеры ──'
          $SUDO docker compose --env-file "$ENV_FILE" $LLM_PROFILE ps

          echo '── health ──'
          ok=''
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              ok=1
              echo
              break
            fi
            sleep 2
          done
          [ -n "$ok" ] || {
            $SUDO docker compose --env-file "$ENV_FILE" logs --tail=150 api scheduler
            exit 1
          }

          # Последние строки планировщика печатаются всегда, а не только при
          # падении. Это единственное место, откуда видно, что делает движок:
          # сколько бумаг во вселенной, сколько баров загружено, дал ли скан
          # идеи и чем закончилась сборка пакетов. Без этого «на экране
          # пусто» приходится объяснять рассуждением вместо факта.
          # Планировщик только что стартовал, и первый цикл идёт не мгновенно:
          # тайл сразу после старта показывал одну строку приветствия и ничего
          # больше — то есть раздел, заведённый ради «что делает движок», не
          # показывал ничего. Ждём первую задачу, но не дольше двух минут:
          # деплой не должен зависеть от того, дал ли рынок новые бары.
          echo '── планировщик ──'
          for _ in $(seq 1 24); do
            if $SUDO docker compose --env-file "$ENV_FILE" logs --no-color scheduler \
                 | grep -qE 'universe:|ingest:|review:|supervise:|scan:|portfolio:'; then
              break
            fi
            sleep 5
          done
          $SUDO docker compose --env-file "$ENV_FILE" logs --tail=40 --no-color scheduler

          # Доступность источников ранних сигналов.
          #
          # Разрешить сбор и суметь его сделать — разные вещи. Правовой шлюз
          # может пропускать, а исходящий доступ с сервера быть закрыт, и
          # снаружи это выглядит одинаково: гипотез нет. Раньше различить их
          # можно было только войдя на сервер руками.
          #
          # Проверка идёт из контейнера, а не с хоста: ходить в источники
          # будет он, и его сеть с хостовой совпадает не всегда. Проба
          # уважает правовой шлюз — к запрещённому источнику она не уходит
          # вовсе, и это видно в ответе.
          #
          # Деплой на этом не падает. Закрытый исходящий доступ — не поломка
          # выкладки, а отдельная задача владельца, и валить из-за неё
          # выкатку значило бы связать две независимые вещи.
          echo '── доступность источников ──'
          curl --fail --silent --show-error --max-time 90 \
            http://127.0.0.1:8000/api/v1/research/sources/reachability \
            || echo 'проба не ответила: смотрите логи api'
          echo

          # Сводка разведки: коротко, числами. Полная диагностика
          # источников (plan-check, каталоги, пофазные пробы) своё дело
          # сделала — адреса установлены и проверены; гонять её каждый
          # деплой значит тратить три минуты и мегабайты лога на ответ,
          # который уже известен. Если сбор снова замолчит, причина будет
          # в строке research планировщика — она печатается выше.
          echo '── разведка: сводка ──'
          curl --fail --silent --max-time 60 \
            http://127.0.0.1:8000/api/v1/research/hypotheses \
            | head -c 2000 || echo 'сводка не ответила'
          echo

          # Модель критика. Три разных «нет» выглядят снаружи одинаково:
          # не настроена, не отвечает, установлена другая. Последнее
          # коварнее прочих — опечатка в теге неотличима от молчания.
          echo '── модель критика ──'
          curl --fail --silent --show-error --max-time 30 \
            http://127.0.0.1:8000/api/v1/research/model \
            || echo 'состояние модели не получено: смотрите логи api'
          echo

          echo '── память хоста ──'
          free -h
          $SUDO docker stats --no-stream --format \
            'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' 2>/dev/null | head -8 || true
          echo

          # Старые образы копятся с каждой пересборкой и съедают диск
          # молча: каждый деплой оставляет прежний слой безымянным. Чистка
          # трогает только безымянные и неиспользуемые — работающие
          # контейнеры и веса модели не задевает.
          echo '── чистка старых образов ──'
          $SUDO docker image prune -f 2>/dev/null | tail -1 || true
          $SUDO docker builder prune -f --keep-storage 2GB 2>/dev/null | tail -1 || true
          echo

          echo '── исходящие правила хоста ──'
          $SUDO iptables -S OUTPUT 2>/dev/null | head -5 || echo 'iptables недоступен'
          $SUDO iptables -S DOCKER-USER 2>/dev/null | head -5 || true
          REMOTE

      - name: Обновить код и контейнеры
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          set -eu
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            /tmp/signalai-update.sh \
            /tmp/signalai-device-token.b64 \
            "$USER_NAME@$HOST:/tmp/"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_SOURCE_SHA='$SOURCE_SHA' bash /tmp/signalai-update.sh"

      - name: Записать итог деплоя
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          SOURCE_REF: ${{ needs.resolve.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: |
          if [ "$RESULT" = success ]; then icon='✅'; else icon='❌'; fi
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "$icon **VPS deploy: $RESULT**

          Source: \`$SOURCE_REF\`
          Commit: \`$SOURCE_SHA\`
          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Убрать локальные секреты
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          shred -u /tmp/signalai-device-token.b64 2>/dev/null \
            || rm -f /tmp/signalai-device-token.b64
