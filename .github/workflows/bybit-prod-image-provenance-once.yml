name: One-shot Bybit production image provenance

on:
  push:
    branches: [diag/bybit-image-provenance-20260831]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          PIN: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 "$HOST" > ~/.ssh/known_hosts.raw 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts.raw -E sha256 | awk '{print $2}' | grep -Fxq "$PIN"
          mv ~/.ssh/known_hosts.raw ~/.ssh/known_hosts
      - name: Inspect running scheduler image and code
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          echo "SOURCE_FILE=$(cat "$HOME/signalai/.signalai-source-sha")"
          echo '=== CONTAINER ==='
          docker inspect -f 'image={{.Image}} status={{.State.Status}} restarts={{.RestartCount}} started={{.State.StartedAt}}' server-scheduler-heavy-1
          echo '=== IMAGE ==='
          IMAGE_ID="$(docker inspect -f '{{.Image}}' server-scheduler-heavy-1)"
          docker image inspect "$IMAGE_ID" -f 'id={{.Id}} created={{.Created}} labels={{json .Config.Labels}}'
          echo '=== BUILD DEFAULT SCHEDULER IN IMAGE ==='
          docker run --rm --entrypoint python "$IMAGE_ID" -c 'import inspect,hashlib,app.version; from app.scheduler.runner import build_default_scheduler; print("ENGINE_VERSION=" + app.version.ENGINE_VERSION); print("RUNNER_SHA=" + hashlib.sha256(inspect.getsource(build_default_scheduler).encode()).hexdigest()); print("RUNNER_SIGNATURE=" + str(inspect.signature(build_default_scheduler))); print(inspect.getsource(build_default_scheduler))'
          echo '=== HEAVY SOURCE IN IMAGE ==='
          docker run --rm --entrypoint python "$IMAGE_ID" -c 'from pathlib import Path; print(Path("/srv/app/scheduler/heavy.py").read_text())'
          echo '=== HEAVY LOG ==='
          docker compose --env-file /etc/signalai/.env logs --tail=12 --no-color scheduler-heavy 2>&1
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/known_hosts
