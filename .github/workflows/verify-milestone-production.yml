name: Verify milestone production
on:
  push:
    branches: [ops/verify-milestone-db012078]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Inspect deployed scheduler and universe
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          EXPECTED_SHA: db0120784d759d0cd219cff1f23e58747af720e0
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "root@$HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE=/etc/signalai/.env

          echo '=== DEPLOYED SHA ==='
          deployed="$(cat "$HOME/signalai/.signalai-source-sha")"
          echo "$deployed"
          test "$deployed" = "$EXPECTED_SHA"

          echo '=== SCHEDULER STATUS ==='
          docker compose --env-file "$ENV_FILE" ps scheduler
          docker top server-scheduler-1 -eo pid,ppid,etime,pcpu,pmem,args || true

          echo '=== RAW SCHEDULER LOGS SINCE RESTART ==='
          logs="$(docker compose --env-file "$ENV_FILE" logs --since 20m --no-color scheduler 2>&1)"
          printf '%s\n' "$logs" | tail -n 240

          echo '=== COMPLETED JOBS ==='
          printf '%s\n' "$logs" | grep -E 'scheduler-1.*(universe|ingest|review|supervise|trigger|paper-live|paper|scan|portfolio|research): (ок|ОТКАЗ)' || true
          universe_done="$(printf '%s\n' "$logs" | grep -cE 'scheduler-1.*universe: (ок|ОТКАЗ)' || true)"
          ingest_done="$(printf '%s\n' "$logs" | grep -cE 'scheduler-1.*ingest: (ок|ОТКАЗ)' || true)"
          review_done="$(printf '%s\n' "$logs" | grep -cE 'scheduler-1.*review: (ок|ОТКАЗ)' || true)"
          scan_done="$(printf '%s\n' "$logs" | grep -cE 'scheduler-1.*scan: (ок|ОТКАЗ)' || true)"
          echo "COMPLETED universe=$universe_done ingest=$ingest_done review=$review_done scan=$scan_done"

          echo '=== RECENT SCHEDULER FAILURES ==='
          printf '%s\n' "$logs" | grep -E 'задача .* упала|тик планировщика упал целиком|: ОТКАЗ' || true

          echo '=== UNIVERSE COUNTS: asset_class|in_universe|tradable ==='
          printf '%s\n' \
            "SELECT asset_class, count(*) FILTER (WHERE in_universe), count(*) FILTER (WHERE is_tradable) FROM instruments GROUP BY asset_class ORDER BY asset_class;" \
            | docker compose --env-file "$ENV_FILE" exec -T postgres sh -c \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "${POSTGRES_DB:-signalai}" -F "|" -At'

          echo '=== REQUIRED SYMBOLS: symbol|asset_class|in_universe|tradable ==='
          printf '%s\n' \
            "SELECT symbol, asset_class, in_universe, is_tradable FROM instruments WHERE upper(symbol) IN ('GKU6','BTCUSDT','DOGEUSDT') ORDER BY symbol;" \
            | docker compose --env-file "$ENV_FILE" exec -T postgres sh -c \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "${POSTGRES_DB:-signalai}" -F "|" -At'

          forts_in="$(printf '%s\n' \
            "SELECT count(*) FROM instruments WHERE asset_class = 'FUTURES' AND in_universe;" \
            | docker compose --env-file "$ENV_FILE" exec -T postgres sh -c \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "${POSTGRES_DB:-signalai}" -At' \
            | tr -d '[:space:]')"
          required_count="$(printf '%s\n' \
            "SELECT count(*) FROM instruments WHERE upper(symbol) IN ('GKU6','BTCUSDT','DOGEUSDT') AND in_universe;" \
            | docker compose --env-file "$ENV_FILE" exec -T postgres sh -c \
              'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "${POSTGRES_DB:-signalai}" -At' \
            | tr -d '[:space:]')"
          echo "FORTS_IN_UNIVERSE=$forts_in"
          echo "REQUIRED_IN_UNIVERSE=$required_count"

          # Regression guard: the broken state admitted ~176 structural FORTS
          # roots into sequential ingest. Keep the threshold deliberately loose
          # so this checks boundedness rather than today's exact market count.
          test "$forts_in" -lt 120
          test "$required_count" -eq 3
          test "$universe_done" -ge 1
          test "$ingest_done" -ge 1
          test "$review_done" -ge 1
          test "$scan_done" -ge 1
          REMOTE

      - name: Remove SSH key
        if: always()
        shell: bash
        run: shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
