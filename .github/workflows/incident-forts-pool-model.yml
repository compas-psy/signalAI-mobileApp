name: Model bounded FORTS discovery pool

on:
  push:
    branches:
      - ops/verify-forts-hotfix-20260814

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_model
          chmod 600 ~/.ssh/id_model
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Model read-only discovery rule
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_model -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE='/etc/signalai/.env'
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'
          $SUDO docker compose --env-file "$ENV_FILE" exec -T scheduler python - <<'PY'
          from decimal import Decimal
          from sqlalchemy import select
          from app.config import get_config
          from app.db import get_session_factory
          from app.market import moex
          from app.models import Instrument
          from app.models.enums import AssetClass, Venue

          session = get_session_factory()()
          try:
              cfg = get_config()
              full_floor = cfg.decimal('universe.futures.min_median_daily_notional_rub')
              discovery_floor = full_floor / 10
              rows, _ = moex.forts_board()
              board = {r.sec_id: r for r in rows}
              existing = list(session.execute(select(Instrument).where(
                  Instrument.venue == Venue.MOEX,
                  Instrument.asset_class == AssetClass.FUTURES,
                  Instrument.in_universe.is_(True),
              )).scalars())
              retained = []
              reasons = {'snapshot': 0, 'history': 0, 'both': 0}
              for item in existing:
                  row = board.get(item.symbol)
                  snapshot = (row.turnover if row is not None else None) or Decimal(0)
                  measured = (item.metadata_json or {}).get('admission') or {}
                  raw_hist = measured.get('median_daily_notional_rub')
                  try:
                      hist = Decimal(str(raw_hist)) if raw_hist is not None else Decimal(0)
                  except Exception:
                      hist = Decimal(0)
                  by_snapshot = snapshot >= discovery_floor
                  by_history = hist >= full_floor
                  if by_snapshot or by_history:
                      retained.append((item.instrument_id, snapshot, hist, item.is_tradable))
                      key = 'both' if by_snapshot and by_history else 'snapshot' if by_snapshot else 'history'
                      reasons[key] += 1
              print(f'current_in_universe={len(existing)} retained={len(retained)} discovery_floor={discovery_floor} history_floor={full_floor}')
              print('reasons=' + repr(reasons))
              print('retained_tradable=' + str(sum(1 for *_, tradable in retained if tradable)))
              print('history_only=' + ','.join(x[0] for x in retained if x[1] < discovery_floor and x[2] >= full_floor))
          finally:
              session.rollback()
              session.close()
          PY
          REMOTE
