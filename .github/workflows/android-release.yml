name: Android release

# Подписанная релизная сборка SignalAI.
#
# Ключ подписи хранится в GitHub Secrets, а не в репозитории:
#   ANDROID_KEYSTORE_BASE64  — upload-keystore.jks в base64 (tool/make_keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_PASSWORD
#   ANDROID_KEY_ALIAS        — signalai-upload
#   SIGNALAI_API_BASE_URL    — адрес гейтвея; без секрета берётся рабочий сервер
#
# Сборка без секретов не выполняется: подписать релиз отладочным ключом
# означает получить блокировку Play Protect на устройстве.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Проверка наличия секретов подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Секрет ANDROID_KEYSTORE_BASE64 не задан — см. docs/ANDROID_SIGNING.md"
            exit 1
          fi

      - name: Восстановление keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=${RUNNER_TEMP}/upload-keystore.jks
          EOF

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - name: Сборка AAB (для Play Console)
        run: |
          flutter build appbundle --release \
            --dart-define=SIGNALAI_API_BASE_URL=${{ secrets.SIGNALAI_API_BASE_URL || 'https://api.ilyamartynov.ru' }}

      - name: Сборка APK (для установки на своё устройство)
        run: |
          flutter build apk --release \
            --dart-define=SIGNALAI_API_BASE_URL=${{ secrets.SIGNALAI_API_BASE_URL || 'https://api.ilyamartynov.ru' }}

      - name: Проверка подписи APK
        run: |
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort -r | head -1)
          "$APKSIGNER" verify --print-certs --verbose build/app/outputs/flutter-apk/app-release.apk
          # Отладочная подпись (CN=Android Debug) означала бы блокировку Play Protect.
          if "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q "CN=Android Debug"; then
            echo "::error::APK подписан отладочным ключом"
            exit 1
          fi

      - name: Удаление ключа из рабочей директории
        if: always()
        run: rm -f android/key.properties "${RUNNER_TEMP}/upload-keystore.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: signalai-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
