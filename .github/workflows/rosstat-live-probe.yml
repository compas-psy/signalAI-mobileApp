name: Rosstat live probe

on:
  push:
    branches:
      - probe/4-rosstat-live

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Inspect Rosstat TLS chain without disabling verification
        working-directory: .
        run: |
          set -u
          for host in rosstat.gov.ru www.rosstat.gov.ru; do
            echo "=== OPENSSL $host ==="
            (echo | openssl s_client -connect "$host:443" -servername "$host" -showcerts 2>&1 || true) \
              | grep -E '^(depth=|verify error:|subject=|issuer=|Verify return code:|-----BEGIN CERTIFICATE-----|-----END CERTIFICATE-----)' || true
            echo "=== CURL $host ==="
            curl --head --silent --show-error --max-time 12 "https://$host/statistics/price" >/dev/null \
              && echo "CURL_OK $host" \
              || echo "CURL_FAIL $host exit=$?"
          done
      - name: Install locked server dependencies
        run: |
          uv lock --check
          uv sync --frozen
      - name: Probe current producer-price workbook
        env:
          PYTHONPATH: .
        run: .venv/bin/python scripts/probe_rosstat_prices.py
