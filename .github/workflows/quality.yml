name: Quality gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Optional branch, tag or commit to verify (empty = selected workflow ref)'
        required: false
        default: ''
  workflow_call:
    inputs:
      source_ref:
        description: 'Branch, tag or commit to verify'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  statuses: read

concurrency:
  group: quality-${{ github.event.pull_request.number || inputs.source_ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'
  PYTHON_VERSION: '3.11'

jobs:
  attest:
    name: Reuse exact green release attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - name: Check whether this exact SHA already passed the release QA
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || '' }}
          CALLER_WORKFLOW: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo 'reuse=false' >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = 'pull_request' ] || [ -z "$SOURCE_REF" ]; then
            exit 0
          fi
          case "$CALLER_WORKFLOW" in
            'Deploy release to VPS'|'Android sideload APK') ;;
            *) exit 0 ;;
          esac
          case "$SOURCE_REF" in
            *[!0-9a-f]*|'') exit 0 ;;
          esac
          [ "${#SOURCE_REF}" -eq 40 ] || exit 0
          count="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_REF/status" --jq '[.statuses[] | select(.context == "signalai/release-qa" and .state == "success")] | length')"
          if [ "$count" -gt 0 ]; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
            echo "Exact SHA $SOURCE_REF already has signalai/release-qa=success; heavy QA is reused."
          fi

  secrets:
    name: Tracked secret scan
    needs: attest
    if: ${{ needs.attest.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - name: Scan tracked files without external services
        run: |
          python3 tool/ci_secret_scan.py
          python3 tool/validate_delivery_workflows.py

  server:
    name: Server imports, migrations and pytest
    needs: attest
    if: ${{ needs.attest.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signalai
          POSTGRES_PASSWORD: signalai_local_dev
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalai -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.33'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install exactly the locked server and test dependencies
        run: |
          set -euo pipefail
          lock_before="$(sha256sum uv.lock | awk '{print $1}')"
          uv lock --check
          uv sync --frozen --extra test
          lock_after="$(sha256sum uv.lock | awk '{print $1}')"
          test "$lock_before" = "$lock_after"
          git diff --exit-code -- uv.lock
      - name: Compile and import application
        env:
          SIGNALAI_DATABASE_URL: postgresql+psycopg://signalai:signalai_local_dev@127.0.0.1:5432/postgres
          SIGNALAI_DEVICE_TOKEN: ci-device-token
        run: |
          .venv/bin/python -m compileall -q app alembic
          .venv/bin/python -c 'from app.main import app; assert app is not None'
      - name: Validate migration graph and model parity
        env:
          SIGNALAI_DATABASE_URL: postgresql+psycopg://signalai:signalai_local_dev@127.0.0.1:5432/postgres
        run: |
          set -euo pipefail
          heads="$(.venv/bin/alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          .venv/bin/alembic upgrade head
          .venv/bin/alembic current
          .venv/bin/alembic check
      - name: Run server tests against PostgreSQL
        env:
          SIGNALAI_ADMIN_DSN: postgresql+psycopg://signalai:signalai_local_dev@127.0.0.1:5432/postgres
          SIGNALAI_DEVICE_TOKEN: ci-device-token
        run: .venv/bin/python -m pytest

  mobile:
    name: Flutter analyze and tests
    needs: attest
    if: ${{ needs.attest.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  release:
    name: Release exact green SHA
    needs:
      - attest
      - secrets
      - server
      - mobile
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'codex/thin-client-v1' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
      statuses: write
    steps:
      - name: Check explicit release marker
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Attest, deploy VPS and publish one permanent-signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          ISSUE_NUMBER: '6'
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%B)"
          if ! printf '%s' "$message" | grep -Fq '[release]'; then
            echo 'No [release] marker in HEAD commit; QA only.'
            exit 0
          fi
          actual_sha="$(git rev-parse HEAD)"
          [ "$actual_sha" = "$SOURCE_SHA" ]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" -f state='success' -f context='signalai/release-qa' -f description='Full PR server, Flutter and secret QA passed'
          jq -n --arg ref "$TARGET_REF" --arg sha "$SOURCE_SHA" '{ref:$ref, inputs:{source_ref:$sha}}' > /tmp/deploy.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-release.yml/dispatches" --input /tmp/deploy.json
          jq -n --arg ref "$TARGET_REF" --arg sha "$SOURCE_SHA" '{ref:$ref, inputs:{source_ref:$sha, mode:"thin", api_base_url:"", backup_api_base_url:""}}' > /tmp/sideload.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-sideload.yml/dispatches" --input /tmp/sideload.json

          find_run() {
            workflow="$1"
            for _ in $(seq 1 30); do
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --event workflow_dispatch --branch "$TARGET_REF" --limit 20 --json databaseId,headSha,status,conclusion,url,createdAt --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | @json" | head -1)"
              if [ -n "$run" ]; then
                printf '%s' "$run"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          deploy="$(find_run deploy-release.yml)" || { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Release gate could not observe deploy-release for source \`$SOURCE_SHA\`."; exit 1; }
          sideload="$(find_run android-sideload.yml)" || { gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Release gate could not observe android-sideload for source \`$SOURCE_SHA\`."; exit 1; }
          deploy_id="$(printf '%s' "$deploy" | jq -r .databaseId)"
          deploy_url="$(printf '%s' "$deploy" | jq -r .url)"
          sideload_id="$(printf '%s' "$sideload" | jq -r .databaseId)"
          sideload_url="$(printf '%s' "$sideload" | jq -r .url)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
Release dispatch started for exact green source \`$SOURCE_SHA\`.

- VPS deploy run: $deploy_id — $deploy_url
- signed sideload run: $sideload_id — $sideload_url
EOF
          )"
          set +e
          gh run watch "$deploy_id" --repo "$GITHUB_REPOSITORY" --exit-status
          deploy_rc=$?
          gh run watch "$sideload_id" --repo "$GITHUB_REPOSITORY" --exit-status
          sideload_rc=$?
          set -e
          deploy_conclusion="$(gh run view "$deploy_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          sideload_conclusion="$(gh run view "$sideload_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$(cat <<EOF
Release dispatch finished for \`$SOURCE_SHA\`.

- VPS deploy: **$deploy_conclusion** — $deploy_url
- signed sideload: **$sideload_conclusion** — $sideload_url
EOF
          )"
          [ "$deploy_rc" -eq 0 ] && [ "$sideload_rc" -eq 0 ]
