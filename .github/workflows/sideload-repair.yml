name: Sideload repair
run-name: Sideload repair · ${{ github.sha }}

on:
  push:
    branches:
      - codex/thin-client-v1
  pull_request:
    branches:
      - claude/ux-prototype-dark-theme-sv0euq
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: signalai-sideload-publish
  cancel-in-progress: true

jobs:
  build:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.44.8'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Restore permanent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          keystore="${RUNNER_TEMP}/signalai-sideload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<PROPERTIES
          storeFile=$keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build thin release APK
        env:
          API_BASE_URL: ${{ secrets.SIGNALAI_API_BASE_URL || 'https://api.ilyamartynov.ru' }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=SIGNALAI_MODE=thin \
            --dart-define=SIGNALAI_API_BASE_URL="$API_BASE_URL"

      - name: Verify signer and prepare artifacts
        id: artifact
        run: |
          set -euo pipefail
          source_apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$source_apk"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -r | head -1)"
          signer="$($apksigner verify --verbose --print-certs "$source_apk")"
          printf '%s\n' "$signer"
          if printf '%s\n' "$signer" | grep -q 'CN=Android Debug'; then
            echo '::error::APK was signed with the debug key'
            exit 1
          fi
          signer_sha256="$(printf '%s\n' "$signer" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}')"
          test -n "$signer_sha256"
          expected='3873f2578229b454d1359311b6d014fe6839280b741c806c46a4c43850730b60'
          if [ "$signer_sha256" != "$expected" ]; then
            echo "::error::Unexpected signer $signer_sha256"
            exit 1
          fi
          cp "$source_apk" signalai-sideload.apk
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          exact="signalai-sideload-${source_sha:0:12}.apk"
          cp "$source_apk" "$exact"
          apk_sha256="$(sha256sum signalai-sideload.apk | awk '{print $1}')"
          cat > signalai-sideload.json <<JSON
          {
            "schema_version": 1,
            "channel": "sideload",
            "source_sha": "$source_sha",
            "mode": "thin",
            "bearer_token_compiled": false,
            "apk_sha256": "$apk_sha256",
            "signer_certificate_sha256": "$signer_sha256",
            "traceable_apk": "$exact"
          }
          JSON
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$signer_sha256" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Publish stable sideload release
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT: ${{ steps.artifact.outputs.exact }}
          APK_SHA256: ${{ steps.artifact.outputs.apk_sha256 }}
          SIGNER_SHA256: ${{ steps.artifact.outputs.signer_sha256 }}
          SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          SignalAI personal sideload.

          - source commit: \`$SOURCE_SHA\`
          - mode: \`thin\`
          - APK SHA-256: \`$APK_SHA256\`
          - signer SHA-256: \`$SIGNER_SHA256\`
          - bearer token compiled into APK: \`false\`
          NOTES
          if gh release view sideload >/dev/null 2>&1; then
            gh release edit sideload --prerelease --title 'SignalAI sideload' --notes-file release-notes.md
          else
            gh release create sideload --target "$SOURCE_SHA" --prerelease --title 'SignalAI sideload' --notes-file release-notes.md
          fi
          gh release upload sideload signalai-sideload.apk "$EXACT" signalai-sideload.json --clobber

      - name: Report successful publication on PR 3
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.artifact.outputs.apk_sha256 }}
          SIGNER_SHA256: ${{ steps.artifact.outputs.signer_sha256 }}
          EXACT: ${{ steps.artifact.outputs.exact }}
          SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
        run: |
          gh pr comment 3 --body "Sideload repair succeeded for \`$SOURCE_SHA\`. Stable asset: \`signalai-sideload.apk\`; traceable asset: \`$EXACT\`; APK SHA-256: \`$APK_SHA256\`; signer SHA-256: \`$SIGNER_SHA256\`."

      - uses: actions/upload-artifact@v4
        with:
          name: signalai-sideload-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            signalai-sideload.apk
            ${{ steps.artifact.outputs.exact }}
            signalai-sideload.json
          retention-days: 3

      - name: Remove signing material
        if: always()
        run: |
          rm -f android/key.properties
          shred -u "${RUNNER_TEMP}/signalai-sideload.jks" 2>/dev/null || rm -f "${RUNNER_TEMP}/signalai-sideload.jks"

      - name: Report repair failure on PR 3
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 3 --body "Sideload repair failed for \`${{ github.event.pull_request.head.sha || github.sha }}\`. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
