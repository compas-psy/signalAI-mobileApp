name: Verify production trading-account capital 8fa7

on:
  push:
    branches:
      - 'claude/verify-prod-trading-capital-8fa7'

permissions:
  contents: read

jobs:
  verify-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_verify
          chmod 600 ~/.ssh/id_verify
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Inspect futures margin truth in production
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_verify -o BatchMode=yes root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE='/etc/signalai/.env'
          EXPECTED_SHA='8fa7f919abe15a04e352f1639531aeec55f6f0e4'

          test "$(cat "$HOME/signalai/.signalai-source-sha")" = "$EXPECTED_SHA"
          curl --fail --silent --show-error http://127.0.0.1:8000/health | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d["status"]=="ok"
          assert d["execution_mode"]=="PAPER"
          assert d["paper_only"] is True
          assert d["kill_switch"] is False
          assert d["database"]=="ok"
          '

          docker compose --env-file "$ENV_FILE" exec -T api python - <<'PY'
          import json
          from app.db import session_scope
          from app.capital import runtime
          from app.integration_secrets import load_secret

          def money(raw):
              if not isinstance(raw, dict):
                  return None
              units = int(raw.get("units") or 0)
              nano = int(raw.get("nano") or 0)
              return {"value": units + nano / 1_000_000_000, "currency": str(raw.get("currency") or "").upper()}

          with session_scope() as db:
              trade = load_secret(db, "tinvest_trade")
              read = load_secret(db, "tinvest_invest_read")
              assert trade and trade.get("token")
              assert read and read.get("token")
              accounts = runtime._tinvest_post(
                  trade["token"], "UsersService", "GetAccounts", {"status": "ACCOUNT_STATUS_OPEN"}
              ).get("accounts") or []
              assert len(accounts) == 1, accounts
              account = accounts[0]
              account_id = str(account.get("id") or "")
              margin = runtime._tinvest_post(
                  read["token"], "UsersService", "GetMarginAttributes", {"accountId": account_id}
              )
              portfolio = runtime._tinvest_post(
                  read["token"], "OperationsService", "GetPortfolio", {"accountId": account_id, "currency": "RUB"}
              )
              print("ACCOUNT", {"name": account.get("name"), "type": account.get("type"), "accessLevel": account.get("accessLevel")})
              print("MARGIN", json.dumps({
                  "liquidPortfolio": money(margin.get("liquidPortfolio")),
                  "startingMargin": money(margin.get("startingMargin")),
                  "minimalMargin": money(margin.get("minimalMargin")),
                  "amountOfMissingFunds": money(margin.get("amountOfMissingFunds")),
                  "correctedMargin": money(margin.get("correctedMargin")),
                  "guaranteeForFutures": money(margin.get("guaranteeForFutures")),
                  "fundsSufficiencyLevel": margin.get("fundsSufficiencyLevel"),
              }, ensure_ascii=False))
              print("PORTFOLIO", json.dumps({
                  "totalAmountPortfolio": money(portfolio.get("totalAmountPortfolio")),
                  "totalAmountFutures": money(portfolio.get("totalAmountFutures")),
                  "expectedYield": portfolio.get("expectedYield"),
              }, ensure_ascii=False))
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: shred -u ~/.ssh/id_verify 2>/dev/null || rm -f ~/.ssh/id_verify
