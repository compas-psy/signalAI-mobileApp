name: Verify production trading-account capital 8fa7

on:
  push:
    branches:
      - 'claude/verify-prod-trading-capital-8fa7'

permissions:
  contents: read

jobs:
  verify-vps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          test -n "$KEY"
          test -n "$HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_verify
          chmod 600 ~/.ssh/id_verify
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Inspect futures account money truth in production
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_verify -o BatchMode=yes root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE='/etc/signalai/.env'
          EXPECTED_SHA='8fa7f919abe15a04e352f1639531aeec55f6f0e4'
          test "$(cat "$HOME/signalai/.signalai-source-sha")" = "$EXPECTED_SHA"

          docker compose --env-file "$ENV_FILE" exec -T api python - <<'PY'
          import json
          from app.db import session_scope
          from app.capital import runtime
          from app.integration_secrets import load_secret

          def money(raw):
              if not isinstance(raw, dict):
                  return None
              return {
                  "value": int(raw.get("units") or 0) + int(raw.get("nano") or 0) / 1_000_000_000,
                  "currency": str(raw.get("currency") or "").upper(),
              }

          def money_list(rows):
              return [money(row) for row in rows if isinstance(row, dict)] if isinstance(rows, list) else []

          with session_scope() as db:
              trade = load_secret(db, "tinvest_trade")
              read = load_secret(db, "tinvest_invest_read")
              assert trade and trade.get("token") and read and read.get("token")
              accounts = runtime._tinvest_post(
                  trade["token"], "UsersService", "GetAccounts", {"status": "ACCOUNT_STATUS_OPEN"}
              ).get("accounts") or []
              assert len(accounts) == 1, accounts
              account = accounts[0]
              account_id = str(account.get("id") or "")
              positions = runtime._tinvest_post(
                  read["token"], "OperationsService", "GetPositions", {"accountId": account_id}
              )
              withdraw = runtime._tinvest_post(
                  read["token"], "OperationsService", "GetWithdrawLimits", {"accountId": account_id}
              )
              print("ACCOUNT", {"name": account.get("name"), "type": account.get("type"), "accessLevel": account.get("accessLevel")})
              print("POSITIONS", json.dumps({
                  "money": money_list(positions.get("money")),
                  "blocked": money_list(positions.get("blocked")),
                  "futuresCount": len(positions.get("futures") or []),
                  "optionsCount": len(positions.get("options") or []),
                  "limitsLoadingInProgress": positions.get("limitsLoadingInProgress"),
              }, ensure_ascii=False))
              print("WITHDRAW", json.dumps({
                  "money": money_list(withdraw.get("money")),
                  "blocked": money_list(withdraw.get("blocked")),
                  "blockedGuarantee": money_list(withdraw.get("blockedGuarantee")),
              }, ensure_ascii=False))
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: shred -u ~/.ssh/id_verify 2>/dev/null || rm -f ~/.ssh/id_verify
