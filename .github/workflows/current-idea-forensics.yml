name: Current idea forensics

on:
  push:
    branches:
      - claude/release-y40hk5
    paths:
      - .github/workflows/current-idea-forensics.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
        run: |
          set -euo pipefail
          test -n "$HOST"; test -n "$KEY"
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_forensics
          chmod 600 ~/.ssh/id_forensics
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Inspect production ideas
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_forensics -o BatchMode=yes -o StrictHostKeyChecking=accept-new "$USER_NAME@$HOST" 'bash -s' > /tmp/current-ideas.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          echo '--- RECEIPT ---'
          for p in SOURCE_SHA DEPLOYED_SHA .source-sha .deployed-sha; do
            [ -f "$p" ] && { printf '%s=' "$p"; cat "$p"; echo; }
          done
          $SUDO docker compose --env-file /etc/signalai/.env exec -T api python - <<'PY'
          from datetime import UTC, datetime
          from sqlalchemy import select
          from app.db import get_session_factory
          from app.models import IdeaEvent, Instrument, PaperTrade, TradeIdea
          from app.api.v1.ideas import today, get_idea

          SYMBOLS = ('BTCUSDT', 'DOGEUSDT', 'GKU6')
          TERMINAL = {'CLOSED','STOPPED','TARGET_REACHED','CANCELLED','REJECTED','MISSED','EXPIRED','TIMED_OUT','SKIPPED'}

          def val(x):
              return getattr(x, 'value', str(x)) if x is not None else None

          db = get_session_factory()()
          now = datetime.now(UTC)
          try:
              print('NOW', now.isoformat())
              daily = today(db)
              print('TODAY_TRADE_NOW', [
                  {'id': str(x.id), 'symbol': x.symbol, 'instrument_id': x.instrument_id,
                   'status': val(x.status), 'quality': val(x.quality_status), 'score': str(x.score)}
                  for x in daily.trade_now
              ])
              print('TODAY_WAIT', [
                  {'id': str(x.id), 'symbol': x.symbol, 'instrument_id': x.instrument_id,
                   'status': val(x.status), 'quality': val(x.quality_status), 'score': str(x.score)}
                  for x in daily.wait_for_trigger
              ])
              print('TODAY_REASON', daily.no_trade_reason)

              for symbol in SYMBOLS:
                  rows = db.execute(
                      select(TradeIdea, Instrument)
                      .join(Instrument, Instrument.instrument_id == TradeIdea.instrument_id)
                      .where(Instrument.symbol == symbol)
                      .order_by(TradeIdea.signal_time.desc())
                      .limit(5)
                  ).all()
                  print('SYMBOL', symbol, 'COUNT', len(rows))
                  for idea, inst in rows:
                      exp = idea.explanation_json or {}
                      raw = {
                          'id': str(idea.id), 'time': idea.signal_time.isoformat(),
                          'expires': idea.expires_at.isoformat(), 'status': val(idea.status),
                          'quality': val(idea.quality_status), 'presented': idea.was_presented,
                          'rank': idea.presentation_rank, 'score': str(idea.score),
                          'entry_low': str(idea.entry_low), 'entry_high': str(idea.entry_high),
                          'entry_reference': str(idea.entry_reference), 'stop': str(idea.stop),
                          'tp1': str(idea.tp1), 'tp2': str(idea.tp2), 'tp3': str(idea.tp3),
                          'quantity': str(idea.quantity), 'risk_amount': str(idea.risk_amount),
                          'risk_per_unit': str(idea.risk_per_unit),
                          'quote_currency': exp.get('quote_currency'),
                          'quote_rate_rub': exp.get('quote_rate_rub'),
                          'sizing_note': exp.get('sizing_note'),
                          'admission': exp.get('admission'),
                          'admission_failed': exp.get('admission_failed'),
                      }
                      print('RAW', raw)
                      try:
                          detail = get_idea(idea.id, db)
                          d = detail.model_dump(mode='json')
                          print('DETAIL', {
                              'id': str(idea.id),
                              'plan': d.get('plan'),
                              'sizing': d.get('sizing'),
                              'evidence_count': len(d.get('evidence') or []),
                              'annotation_count': len(d.get('annotations') or []),
                              'closing_reason': d.get('closing_reason'),
                          })
                      except Exception as exc:
                          print('DETAIL_ERROR', {'id': str(idea.id), 'type': type(exc).__name__, 'message': str(exc)})
                      events = db.execute(
                          select(IdeaEvent)
                          .where(IdeaEvent.idea_id == idea.id)
                          .order_by(IdeaEvent.sequence)
                      ).scalars().all()
                      print('EVENTS', [
                          {'seq': e.sequence, 'new': val(e.new_status), 'reason': e.reason_code,
                           'detail': e.reason_detail, 'at': e.occurred_at.isoformat()}
                          for e in events
                      ])
                      papers = db.execute(
                          select(PaperTrade).where(PaperTrade.idea_id == idea.id)
                      ).scalars().all()
                      print('PAPER', [
                          {'id': str(p.id), 'status': val(p.status), 'entry': str(p.entry),
                           'quantity': str(p.quantity)} for p in papers
                      ])
          finally:
              db.close()
          PY
          REMOTE

      - name: Publish sanitized result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/current-ideas.txt').read_text(errors='replace')
          Path('/tmp/result.json').write_text(json.dumps({'production': text[-100000:]}, ensure_ascii=False, indent=2))
          PY
          encoded="$(base64 -w0 /tmp/result.json)"
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/current-idea-forensics-result.json?ref=claude/release-y40hk5" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/.github/current-idea-forensics-result.json" -f message='ops: record current idea forensics' -f content="$encoded" -f branch='claude/release-y40hk5')
          [ -z "$current" ] || args+=(-f sha="$current")
          gh api "${args[@]}" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_forensics /tmp/current-ideas.txt /tmp/result.json
