name: Diagnose capital runtime

on:
  push:
    branches:
      - 'claude/debug-screenshot-capital'

permissions:
  contents: read

jobs:
  probe-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostics
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_diag
          chmod 600 ~/.ssh/id_diag
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Read deployed runtime state
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_diag -o BatchMode=yes root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd "$HOME/signalai/server"
          ENV_FILE='/etc/signalai/.env'
          TOKEN="$(sed -n 's/^SIGNALAI_DEVICE_TOKEN=//p' "$ENV_FILE" | tail -1)"
          test -n "$TOKEN"
          echo '--- capital API ---'
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            http://127.0.0.1:8000/api/v1/capital \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [(print(s.get("source"), s.get("status"), s.get("equity_by_currency"), s.get("note"))) for s in d.get("sources",[])]'
          echo '--- live paper API ---'
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" \
            'http://127.0.0.1:8000/api/v1/paper/trades?live_only=true&limit=20' \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin); print("count", len(rows)); [print(r.get("id"), r.get("idea_id"), r.get("instrument_id"), r.get("status"), r.get("opened_at")) for r in rows]'
          unset TOKEN
          REMOTE

      - name: Cleanup
        if: always()
        run: shred -u ~/.ssh/id_diag 2>/dev/null || rm -f ~/.ssh/id_diag
