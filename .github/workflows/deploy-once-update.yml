name: One-shot production server update

on:
  push:
    branches:
      - claude/release-y40hk5
    paths:
      - .github/workflows/deploy-once-update.yml

concurrency:
  group: signalai-production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate before one-shot update
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ github.sha }}

  deploy:
    name: Update VPS and record receipt
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate deployment secrets
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          DEVICE_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "$HOST" ] || missing="$missing VPS_HOST|SERVER_HOST"
          [ -n "$USER_NAME" ] || missing="$missing VPS_USER"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY|SSH_SECRET"
          [ -n "$DEVICE_TOKEN" ] || missing="$missing SIGNALAI_DEVICE_TOKEN"
          [ -z "$missing" ] || { echo "::error::missing:$missing"; exit 1; }
          [ "${#DEVICE_TOKEN}" -ge 32 ] || { echo '::error::device token too short'; exit 1; }
          case "$DEVICE_TOKEN" in
            *[!A-Za-z0-9._~-]*) echo '::error::device token must be URL-safe'; exit 1 ;;
          esac

      - name: Prepare SSH and device token
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          DEVICE_TOKEN: ${{ secrets.SIGNALAI_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ]; then
            echo 'Host fingerprint recorded.'
          else
            echo "::warning::ssh-keyscan did not return a key for $HOST"
            echo 'StrictHostKeyChecking=accept-new' >> ~/.ssh/config
          fi
          printf '%s' "$DEVICE_TOKEN" | base64 -w0 > /tmp/signalai-device-token.b64

      - name: Update server to this immutable source
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            /tmp/signalai-device-token.b64 \
            "$USER_NAME@$HOST:/tmp/signalai-device-token.b64"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "SIGNALAI_SOURCE_SHA='$SOURCE_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE_SHA="${SIGNALAI_SOURCE_SHA:?deployment source SHA is required}"
          ENV_FILE='/etc/signalai/.env'
          TOKEN_FILE='/tmp/signalai-device-token.b64'
          cleanup_token() { rm -f "$TOKEN_FILE"; unset token 2>/dev/null || true; }
          trap cleanup_token EXIT
          case "$SOURCE_SHA" in
            *[!0-9a-f]*|'') echo 'invalid deployment source SHA' >&2; exit 1 ;;
          esac
          [ "${#SOURCE_SHA}" -eq 40 ] || { echo 'source SHA must have 40 hex characters' >&2; exit 1; }
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO="sudo"
          cd "$HOME/signalai"
          git fetch --depth 1 origin "$SOURCE_SHA" </dev/null
          git reset --hard FETCH_HEAD </dev/null
          deployed_sha="$(git rev-parse --verify HEAD^{commit})"
          [ "$deployed_sha" = "$SOURCE_SHA" ] || { echo "fetched $deployed_sha instead of $SOURCE_SHA" >&2; exit 1; }
          echo "deployed source: $deployed_sha"
          cd server

          test -s "$TOKEN_FILE"
          token="$(base64 -d < "$TOKEN_FILE")"
          rm -f "$TOKEN_FILE"
          $SUDO sed -i '/^SIGNALAI_DEVICE_TOKEN=/d' "$ENV_FILE"
          printf 'SIGNALAI_DEVICE_TOKEN=%s\n' "$token" | $SUDO tee -a "$ENV_FILE" >/dev/null
          unset token
          $SUDO chmod 600 "$ENV_FILE"

          $SUDO docker compose --env-file "$ENV_FILE" run --rm -T api alembic upgrade head </dev/null
          $SUDO docker compose --env-file "$ENV_FILE" up -d --build </dev/null
          $SUDO docker compose --env-file "$ENV_FILE" ps </dev/null
          curl -fsS --max-time 30 http://127.0.0.1:8000/health
          REMOTE

      - name: Verify health and save deployment receipt
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            'curl -fsS --max-time 30 http://127.0.0.1:8000/health' > /tmp/health.json
          python3 - <<'PY'
          import json, os
          from datetime import UTC, datetime
          health = json.load(open('/tmp/health.json', encoding='utf-8'))
          if health.get('status') != 'ok':
              raise SystemExit(f"health status is {health.get('status')!r}")
          receipt = {
              'source_sha': os.environ['SOURCE_SHA'],
              'deployed_at': datetime.now(UTC).isoformat(),
              'health': health,
          }
          with open('/tmp/deploy-last-success.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, ensure_ascii=False, indent=2)
              f.write('\n')
          print('health:', health.get('status'), 'paper_only:', health.get('paper_only'))
          PY

          git fetch origin claude/release-y40hk5
          git checkout -B claude/release-y40hk5 origin/claude/release-y40hk5
          cp /tmp/deploy-last-success.json .github/deploy-last-success.json
          git config user.name 'signalai-deploy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deploy-last-success.json
          git commit -m "ops: record successful server deploy $SOURCE_SHA"
          git push origin HEAD:claude/release-y40hk5

      - name: Remove sensitive material
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          shred -u /tmp/signalai-device-token.b64 2>/dev/null || rm -f /tmp/signalai-device-token.b64
