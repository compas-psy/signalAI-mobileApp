name: Dispatch verified Bybit attribution production fix

on:
  push:
    branches:
      - deploy-bybit-attribution-20260830

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-release.yml',
              ref: 'claude/release-y40hk5',
              inputs: {
                source_ref: '8cb86dceaa322ca63d24a52045ed8c172ceacc0f'
              }
            })
