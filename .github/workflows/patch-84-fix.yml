name: Apply selected rebalance token fix

on:
  push:
    branches:
      - feature/84-selected-package-rebalance

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/84-selected-package-rebalance
          fetch-depth: 0
      - name: Apply patch
        run: python .github/patch84fix.py
      - name: Commit patch and remove helpers
        run: |
          rm .github/patch84fix.py .github/workflows/patch-84-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: use existing portfolio status tokens'
          git push origin HEAD:feature/84-selected-package-rebalance
