name: Apply control/backtest patch v2

on:
  push:
    branches: [fix/bybit-visibility-backtest-progress]
    paths: [.github/workflows/apply-control-backtest-patch-v2.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bybit-visibility-backtest-progress
          fetch-depth: 0
      - name: Execute already-reviewed exact patch body
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          workflow = Path('.github/workflows/apply-control-backtest-patch.yml').read_text()
          body = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(dedent(body), {'__name__': '__main__'})
          Path('.github/workflows/apply-control-backtest-patch-v2.yml').unlink()
          PY
      - name: Sanity-check patched source
        run: |
          python -m py_compile server/app/backtest/readiness.py server/app/backtest/runtime.py server/app/control/dashboard.py server/app/scheduler/p0_runtime.py server/app/scheduler/lanes.py
          grep -q "progress.label" lib/ui/screens/server_control_screen.dart
          grep -q "data_readiness" lib/data/api/control_dashboard_client.dart
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: expose N40 and venue backtest readiness"
          git push origin HEAD:fix/bybit-visibility-backtest-progress
