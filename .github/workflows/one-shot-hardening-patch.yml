name: One-shot hardening patch

on:
  push:
    branches:
      - agent/equity-ranking-hardening
    paths:
      - .github/workflows/one-shot-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/equity-ranking-hardening
          fetch-depth: 1

      - name: Apply reviewed surgical edits
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/domain/idea/trade_plan.dart',
              '''    required this.entryLow,\n    required this.entryHigh,\n    required this.maxSlippagePercent,''',
              '''    required this.entryLow,\n    required this.entryHigh,\n    this.entryReference,\n    required this.maxSlippagePercent,''',
          )
          replace_once(
              'lib/domain/idea/trade_plan.dart',
              '''  final double entryLow;\n  final double entryHigh;\n\n  /// Допустимое проскальзывание''',
              '''  final double entryLow;\n  final double entryHigh;\n\n  /// Опорная цена, по которой сервер считает риск и создаёт заявку.\n  /// null допускается только для старого кэша/демо; тогда используем середину зоны.\n  final double? entryReference;\n\n  /// Допустимое проскальзывание''',
          )
          replace_once(
              'lib/domain/idea/trade_plan.dart',
              '''  /// Опорная цена входа — середина зоны.\n  double get entry => (entryLow + entryHigh) / 2;''',
              '''  /// Каноническая цена входа — ровно серверный `entry_reference`.\n  /// Середина зоны остаётся только fallback для старых сохранённых данных.\n  double get entry => entryReference ?? (entryLow + entryHigh) / 2;''',
          )
          replace_once(
              'lib/domain/idea/trade_plan.dart',
              '''        entryLow: entryLow,\n        entryHigh: entryHigh,\n        maxSlippagePercent: maxSlippagePercent,''',
              '''        entryLow: entryLow,\n        entryHigh: entryHigh,\n        entryReference: entryReference,\n        maxSlippagePercent: maxSlippagePercent,''',
          )

          replace_once(
              'lib/data/api/engine_contract.dart',
              '''      entryLow: _num(plan['entry_low']),\n      entryHigh: _num(plan['entry_high']),\n      maxSlippagePercent: 0.1,''',
              '''      entryLow: _num(plan['entry_low']),\n      entryHigh: _num(plan['entry_high']),\n      entryReference: _numOrNull(plan['entry_reference']),\n      maxSlippagePercent: 0.1,''',
          )
          replace_once(
              'lib/data/api/engine_contract.dart',
              '''    final entry = (_num(plan['entry_low']) + _num(plan['entry_high'])) / 2;\n    final stop = _num(plan['stop']);''',
              '''    final entry = _numOrNull(plan['entry_reference']) ??\n        (_num(plan['entry_low']) + _num(plan['entry_high'])) / 2;\n    final stop = _num(plan['stop']);''',
          )

          replace_once(
              'server/app/portfolio/fundamentals.py',
              '''    payments: list[tuple[date, Decimal]] = []\n    try:\n        kwargs = {"fetch": fetch} if fetch else {}\n        payments, _ = moex.dividends(instrument.symbol, **kwargs)\n    except (FetchError, ValueError):\n        payments = []\n\n    if price is None or price <= 0:''',
              '''    payments: list[tuple[date, Decimal]] = []\n    dividends_available = True\n    try:\n        kwargs = {"fetch": fetch} if fetch else {}\n        payments, _ = moex.dividends(instrument.symbol, **kwargs)\n    except (FetchError, ValueError):\n        dividends_available = False\n\n    if not dividends_available:\n        metrics.append(\n            Metric(\n                "dividend_yield",\n                "Дивидендная доходность",\n                Measure.MISSING,\n                text="источник дивидендов временно недоступен",\n            )\n        )\n    elif price is None or price <= 0:''',
          )

          Path('test/entry_reference_contract_test.dart').write_text('''import 'package:flutter_test/flutter_test.dart';\nimport 'package:signalai/data/api/engine_contract.dart';\n\nvoid main() {\n  test('engine preserves exact server entry_reference', () {\n    final idea = EngineContract.idea({\n      'id': '00000000-0000-0000-0000-000000000001',\n      'instrument_id': 'MOEX:FUT:TEST',\n      'symbol': 'TEST',\n      'direction': 'LONG',\n      'status': 'TRIGGERED',\n      'signal_time': '2026-08-10T12:00:00Z',\n      'expires_at': '2026-08-15T12:00:00Z',\n      'score': 70,\n      'plan': {\n        'order_intent': 'LIMIT_RETEST',\n        'entry_low': '10',\n        'entry_high': '12',\n        'entry_reference': '10.25',\n        'stop': '9',\n        'tp1': '13',\n        'tp2': '14',\n        'tp3': '15',\n        'invalidation': 'test',\n      },\n      'sizing': {\n        'quantity': '1',\n        'quantity_step': '1',\n        'risk_amount': '1000',\n        'risk_pct': '0.005',\n        'risk_per_unit': '1.25',\n        'quote_currency': 'RUB',\n      },\n    });\n\n    expect(idea.plan, isNotNull);\n    expect(idea.plan!.entryLow, 10);\n    expect(idea.plan!.entryHigh, 12);\n    expect(idea.plan!.entry, 10.25);\n    expect(EngineContract.signalFrom(idea).entry, 10.25);\n  });\n}\n''')
          PY

          rm .github/workflows/one-shot-hardening-patch.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve exact entry reference and honest dividend gaps'
          git push origin HEAD:agent/equity-ranking-hardening
