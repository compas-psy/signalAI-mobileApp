name: Runner probe

# Временная проверка: выдаётся ли раннер вообще.
#
# Сборка APK перестала стартовать — задача завершается за 2–8 секунд с
# пустым списком шагов и `runner_id: 0`, то есть раннер не назначается.
# Причина может быть на уровне аккаунта (квота, лимит трат) либо в самом
# workflow сборки. Этот прогон ничего не собирает и почти ничего не стоит:
# если он проходит, дело в workflow сборки, если падает так же — в аккаунте.
#
# Удаляется сразу после ответа.

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Раннер жив
        run: |
          echo "runner: $RUNNER_NAME на $RUNNER_OS"
          echo "дата: $(date -u)"
