name: Sync Telegram secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalai-production-deploy
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate required secrets
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "$HOST" ] || missing="$missing VPS_HOST|SERVER_HOST"
          [ -n "$KEY" ] || missing="$missing VPS_SSH_KEY|SSH_SECRET"
          [ -n "$HOST_KEY_SHA256" ] || missing="$missing VPS_SSH_HOST_KEY_SHA256"
          [ -n "$TELEGRAM_TOKEN" ] || missing="$missing TELEGRAM_TOKEN"
          [ -n "$TELEGRAM_CHATID" ] || missing="$missing TELEGRAM_CHATID"
          [ -z "$missing" ] || { echo "::error::missing secrets:$missing"; exit 1; }

      - name: Prepare private payload and SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHATID: ${{ secrets.TELEGRAM_CHATID }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"
          printf '%s' "$TELEGRAM_TOKEN" | base64 -w0 > /tmp/telegram-token.b64
          printf '%s' "$TELEGRAM_CHATID" | base64 -w0 > /tmp/telegram-chatid.b64
          cat > /tmp/sync-telegram.sh <<'REMOTE'
          set -euo pipefail
          ENV_FILE='/etc/signalai/.env'
          TOKEN_FILE='/tmp/telegram-token.b64'
          CHAT_FILE='/tmp/telegram-chatid.b64'
          SUDO=''
          [ "$(id -u)" -eq 0 ] || SUDO='sudo'
          cleanup() {
            rm -f "$TOKEN_FILE" "$CHAT_FILE"
            unset token chat_id 2>/dev/null || true
          }
          trap cleanup EXIT

          test -f "$ENV_FILE" || { echo 'SignalAI env file is missing' >&2; exit 1; }
          test -s "$TOKEN_FILE" && test -s "$CHAT_FILE"
          token="$(base64 -d < "$TOKEN_FILE")"
          chat_id="$(base64 -d < "$CHAT_FILE")"
          [ -n "$token" ] && [ -n "$chat_id" ]

          tmp_env="$(mktemp /tmp/signalai-env.XXXXXX)"
          $SUDO awk '!/^TELEGRAM_TOKEN=/ && !/^TELEGRAM_CHATID=/' "$ENV_FILE" > "$tmp_env"
          printf 'TELEGRAM_TOKEN=%s\nTELEGRAM_CHATID=%s\n' "$token" "$chat_id" >> "$tmp_env"
          $SUDO cp "$tmp_env" "$ENV_FILE"
          rm -f "$tmp_env"
          unset token chat_id
          $SUDO chmod 600 "$ENV_FILE"

          cd "$HOME/signalai/server"
          $SUDO docker compose --env-file "$ENV_FILE" config >/dev/null
          $SUDO docker compose --env-file "$ENV_FILE" up -d --force-recreate api scheduler >/dev/null

          ok=''
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { $SUDO docker compose --env-file "$ENV_FILE" logs --tail=120 api scheduler; exit 1; }

          # Verify the production image can render a real stored idea into PNG.
          $SUDO docker compose --env-file "$ENV_FILE" exec -T scheduler python - <<'PY'
          from sqlalchemy import select
          from app.db import get_session_factory
          from app.models import TradeIdea
          from app.telegram_chart import render_idea_chart

          session = get_session_factory()()
          try:
              ideas = list(session.execute(
                  select(TradeIdea).order_by(TradeIdea.signal_time.desc()).limit(20)
              ).scalars())
              for idea in ideas:
                  try:
                      image = render_idea_chart(session, idea)
                  except RuntimeError:
                      continue
                  assert image.startswith(b'\x89PNG\r\n\x1a\n')
                  assert len(image) > 1000
                  print(f'Telegram H1 chart OK: {idea.id}, {len(image)} bytes')
                  break
              else:
                  raise RuntimeError('no recent idea with H1 bars for Telegram chart test')
          finally:
              session.close()
          PY

          # A plain setup message proves the Bot token and Chat ID together.
          $SUDO docker compose --env-file "$ENV_FILE" exec -T scheduler python -c \
            'from app.telegram_notifications import send_test_message; send_test_message()'
          echo 'Telegram secret sync, chart render and Bot API test: OK'
          REMOTE

      - name: Sync to VPS and verify
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy -o BatchMode=yes \
            /tmp/sync-telegram.sh /tmp/telegram-token.b64 /tmp/telegram-chatid.b64 \
            "$USER_NAME@$HOST:/tmp/"
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            'bash /tmp/sync-telegram.sh'

      - name: Cleanup
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
          shred -u /tmp/telegram-token.b64 2>/dev/null || rm -f /tmp/telegram-token.b64
          shred -u /tmp/telegram-chatid.b64 2>/dev/null || rm -f /tmp/telegram-chatid.b64
          rm -f /tmp/sync-telegram.sh
