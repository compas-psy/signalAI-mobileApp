name: Dispatch verified breakout range production fix

on:
  push:
    branches:
      - deploy-breakout-range-20260831

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-release.yml',
              ref: 'claude/release-y40hk5',
              inputs: {
                source_ref: '2275a618003f5467ac0b4a5f588a8c3355a393ac'
              }
            })
