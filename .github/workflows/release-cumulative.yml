name: Cumulative production release
run-name: Release · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Accepted source ref to release'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: signalai-cumulative-production-release
  cancel-in-progress: false

jobs:
  quality:
    name: One full quality gate
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ inputs.source_ref }}

  dispatch:
    name: Dispatch one server and one APK delivery
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact source to canonical delivery workflows
        uses: actions/github-script@v7
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '');
            const sourceRef = process.env.SOURCE_REF;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-release.yml',
              ref,
              inputs: { source_ref: sourceRef },
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-sideload.yml',
              ref,
              inputs: {
                source_ref: sourceRef,
                mode: 'thin',
                api_base_url: '',
                backup_api_base_url: '',
              },
            });
