name: Cumulative production release
run-name: Release · ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Current default-branch lowercase 40-char commit SHA to release'
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: signalai-cumulative-production-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out release orchestrator
        uses: actions/checkout@v4
      - name: Resolve and validate current default head
        id: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/validate_release_source.py \
            --source-ref "$SOURCE_REF" \
            --repository "${{ github.repository }}" \
            --github-token "$GH_TOKEN"

  quality:
    name: One full quality gate
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      source_ref: ${{ needs.validate.outputs.source_sha }}

  dispatch:
    name: Dispatch one server and one APK delivery
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact source to canonical delivery workflows
        uses: actions/github-script@v7
        env:
          SOURCE_REF: ${{ needs.validate.outputs.source_sha }}
        with:
          script: |
            const ref = context.ref.replace('refs/heads/', '');
            const sourceRef = process.env.SOURCE_REF;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-release.yml',
              ref,
              inputs: { source_ref: sourceRef },
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'android-sideload.yml',
              ref,
              inputs: {
                source_ref: sourceRef,
                mode: 'thin',
                api_base_url: '',
                backup_api_base_url: '',
              },
            });
