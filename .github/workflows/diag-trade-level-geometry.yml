name: One-shot trade level geometry diagnostic

on:
  push:
    branches: [fix/trade-level-geometry-20260831]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$KEY" && test -n "$HOST_KEY_SHA256"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"
      - name: Inspect production idea geometry
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DIR="$HOME/signalai"; ENV_FILE='/etc/signalai/.env'
          cd "$DIR/server"
          PGUSER="$(sed -n 's/^POSTGRES_USER=//p' "$ENV_FILE" | tail -1)"
          PGDB="$(sed -n 's/^POSTGRES_DB=//p' "$ENV_FILE" | tail -1)"; [ -n "$PGDB" ] || PGDB=signalai
          echo '===== SOURCE ====='; printf 'source='; cat "$DIR/.signalai-source-sha" || true
          docker compose --env-file "$ENV_FILE" exec -T postgres psql -X -v ON_ERROR_STOP=1 -U "$PGUSER" -d "$PGDB" -P pager=off <<'SQL'
          \echo '===== ALEMBIC ====='
          select * from alembic_version;
          \echo '===== GEOMETRY CONSTRAINTS ====='
          select conname,convalidated,pg_get_constraintdef(oid) definition
          from pg_constraint
          where conrelid='trade_ideas'::regclass
            and (conname like '%stop_on_correct_side%' or conname like '%targets_ordered_by_direction%')
          order by conname;
          \echo '===== LINKUSDT IDEAS ====='
          select id,created_at,instrument_id,strategy,direction,status,entry_low,entry_high,entry_reference,stop,tp1,tp2,tp3,rr_tp1,rr_tp2
          from trade_ideas where instrument_id='CRYPTO:PERP:LINKUSDT'
          order by created_at desc limit 30;
          \echo '===== INVALID CRYPTO GEOMETRY ====='
          select id,created_at,instrument_id,strategy,direction,status,entry_low,entry_high,entry_reference,stop,tp1,tp2,tp3,rr_tp1,rr_tp2
          from trade_ideas
          where instrument_id like 'CRYPTO:PERP:%'
            and not ((direction='LONG' and stop < entry_low and tp1 > entry_high and tp2 > tp1)
                  or (direction='SHORT' and stop > entry_high and tp1 < entry_low and tp2 < tp1))
          order by created_at desc limit 100;
          SQL
          REMOTE
      - name: Remove SSH key
        if: always()
        run: shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
