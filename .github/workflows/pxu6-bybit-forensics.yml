name: Dispatch PXU6 runtime forensics

on:
  pull_request:
    branches: [claude/release-y40hk5]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/pxu6-bybit-forensics.yml]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Try dispatch
        run: |
          set +e
          output="$(gh workflow run pxu6-runtime-forensics.yml --repo "$GITHUB_REPOSITORY" --ref claude/release-y40hk5 2>&1)"
          code=$?
          printf 'exit=%s\n%s\n' "$code" "$output" > dispatch.txt
          exit 0
      - name: Upload dispatch result
        uses: actions/upload-artifact@v4
        with:
          name: pxu6-dispatch-result
          path: dispatch.txt
          if-no-files-found: error
