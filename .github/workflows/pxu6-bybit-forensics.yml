name: Dispatch PXU6 runtime forensics

on:
  pull_request:
    branches: [claude/release-y40hk5]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/pxu6-bybit-forensics.yml]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch trusted default-branch forensic workflow
        run: |
          set -euo pipefail
          gh workflow run pxu6-runtime-forensics.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref claude/release-y40hk5
          echo 'runtime forensics dispatched'

# synchronize event also triggers trusted pull_request_target forensics
