name: Dispatch PXU6 runtime forensics

on:
  pull_request:
    branches: [claude/release-y40hk5]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/pxu6-bybit-forensics.yml]

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch and record result
        run: |
          set +e
          output="$(gh workflow run pxu6-runtime-forensics.yml --repo "$GITHUB_REPOSITORY" --ref claude/release-y40hk5 2>&1)"
          code=$?
          printf 'exit=%s\n%s\n' "$code" "$output" > /tmp/dispatch.txt
          encoded="$(base64 -w0 /tmp/dispatch.txt)"
          current="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/pxu6-dispatch-result.txt?ref=agent/pxu6-bybit-forensics" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/.github/pxu6-dispatch-result.txt" -f message='ops: record PXU6 dispatch result' -f content="$encoded" -f branch='agent/pxu6-bybit-forensics')
          [ -z "$current" ] || args+=(-f sha="$current")
          gh api "${args[@]}" >/dev/null
          exit 0
