name: Risk v2 runner UI patch

on:
  push:
    branches:
      - agent/risk-exit-engine-v2-20260811

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/risk-exit-engine-v2-20260811
          fetch-depth: 0
      - name: Patch runner state into existing journal card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/ui/screens/server_journal_screen.dart')
          text = p.read_text()
          old = """                PaperPositionStatus.open =>\n                  'Позиция открыта. Взято целей ${trade.tpsTaken} из ${trade.tpsTotal}.',"""
          new = """                PaperPositionStatus.open => trade.runnerActive\n                    ? 'TP3 пройден. Остаток позиции ведёт trailing runner.'\n                    : 'Позиция открыта. Взято целей ${trade.tpsTaken} из ${trade.tpsTotal}.',"""
          if old not in text:
              raise SystemExit('open-position UI anchor not found')
          text = text.replace(old, new, 1)
          old_chip = """                if (trade.atBreakeven) const TagChip('стоп в БУ'),"""
          new_chip = """                if (trade.atBreakeven) const TagChip('стоп в БУ'),\n                if (trade.runnerActive) const TagChip('RUNNER · TRAILING'),"""
          if old_chip not in text:
              raise SystemExit('tag UI anchor not found')
          text = text.replace(old_chip, new_chip, 1)
          p.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/ui/screens/server_journal_screen.dart
          git diff --cached --check
          git commit -m "feat: show active trailing runner in journal"
          git push origin HEAD:agent/risk-exit-engine-v2-20260811
