name: Ops dispatch deploy Bybit audit

on:
  push:
    branches:
      - ops/deploy-73aa8b8-20260830
    paths:
      - .github/workflows/ops-dispatch-deploy-73aa8b8.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production deployment
        uses: actions/github-script@v7
        with:
          script: |
            const sourceRef = '19e9f8c3ac54758be9184f461b3f01f190d5e702';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-release.yml',
              ref: 'claude/release-y40hk5',
              inputs: { source_ref: sourceRef },
            });
            core.notice(`Production deploy dispatched for ${sourceRef}`);
