name: Apply current chart retry patch

on:
  push:
    branches:
      - fix/chart-retry-current-20260814

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-retry-current-20260814
          fetch-depth: 0
      - name: Apply surgical retry changes
        run: |
          set -euo pipefail
          git fetch origin agent/chart-retry-20260813:refs/remotes/origin/agent/chart-retry-20260813
          git show origin/agent/chart-retry-20260813:test/idea_chart_controller_retry_test.dart > test/idea_chart_controller_retry_test.dart
          git show origin/agent/chart-retry-20260813:test/idea_chart_retry_test.dart > test/idea_chart_retry_test.dart

          python - <<'PY'
          from pathlib import Path

          p = Path('lib/state/app_controller.dart')
          s = p.read_text()
          old = '''  /// Загрузить свечи для идеи на текущем таймфрейме. Повторный вызов ничего\n  /// не делает: разбор перестраивается на каждом кадре анимации, и запрос на\n  /// кадр положил бы и сервер, и батарею.\n'''
          new = '''  /// Загрузить свечи для идеи на текущем таймфрейме.\n  /// Успешный или уже идущий запрос дедуплицируется; после зафиксированного\n  /// отказа явный повтор разрешён и очищает старое сообщение об ошибке.\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    final key = _chartKey(idea.id, timeframe);\n    if (_ideaChartsAsked.contains(key)) return;\n    _ideaChartsAsked.add(key);\n'''
          new = '''    final key = _chartKey(idea.id, timeframe);\n    final failed = _ideaChartsFailed.contains(key);\n    if (_ideaChartsAsked.contains(key) && !failed) return;\n    _ideaChartsAsked.add(key);\n    if (failed) {\n      _ideaChartsFailed.remove(key);\n      _chartFailureReason.remove(key);\n      notifyListeners();\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/ui/widgets/idea_chart_card.dart')
          s = p.read_text()
          old = '''    this.failed = false,\n    this.failureReason = '',\n  });\n'''
          new = '''    this.failed = false,\n    this.failureReason = '',\n    this.liveSource,\n  });\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  final bool failed;\n  final String failureReason;\n  final SignalChart? chart;\n'''
          new = '''  final bool failed;\n  final String failureReason;\n  final LiveIdeaSource? liveSource;\n  final SignalChart? chart;\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''class _IdeaChartCardState extends State<IdeaChartCard> {\n  final LiveIdeaSource _liveSource = LiveIdeaSource();\n'''
          new = '''class _IdeaChartCardState extends State<IdeaChartCard> {\n  final LiveIdeaSource _defaultLiveSource = LiveIdeaSource();\n  LiveIdeaSource get _liveSource => widget.liveSource ?? _defaultLiveSource;\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                  'Разметка и уровни ниже считаны на ${_setupLabel()} и от '\n                  'таймфрейма картинки не зависят.',\n                )\n'''
          new = '''                  'Разметка и уровни ниже считаны на ${_setupLabel()} и от '\n                  'таймфрейма картинки не зависят.',\n                  onRetry: () => unawaited(_refreshLive()),\n                )\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''class _ChartPending extends StatelessWidget {\n  const _ChartPending(this.message);\n\n  final String message;\n'''
          new = '''class _ChartPending extends StatelessWidget {\n  const _ChartPending(this.message, {this.onRetry});\n\n  final String message;\n  final VoidCallback? onRetry;\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''              child: Text(\n                message,\n                textAlign: TextAlign.center,\n                style: T.body(11.5, color: C.dim, height: 1.5),\n              ),\n'''
          new = '''              child: Column(\n                mainAxisSize: MainAxisSize.min,\n                children: [\n                  Text(\n                    message,\n                    textAlign: TextAlign.center,\n                    style: T.body(11.5, color: C.dim, height: 1.5),\n                  ),\n                  if (onRetry != null) ...[\n                    const SizedBox(height: 12),\n                    SizedBox(\n                      width: 128,\n                      child: ActionButton(\n                        label: 'Повторить',\n                        onTap: onRetry,\n                        dense: true,\n                      ),\n                    ),\n                  ],\n                ],\n              ),\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/state/app_controller.dart lib/ui/widgets/idea_chart_card.dart test/idea_chart_controller_retry_test.dart test/idea_chart_retry_test.dart
          git commit -m "fix: retry failed idea chart loads"
          git push origin HEAD:fix/chart-retry-current-20260814
