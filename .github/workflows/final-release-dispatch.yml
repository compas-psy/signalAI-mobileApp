name: Final release dispatcher

on:
  push:
    branches:
      - 'claude/release-y40hk5'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, '[final-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical cumulative production release
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.sha }}
        with:
          script: |
            const sourceRef = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sourceRef)) {
              core.setFailed(`Invalid source SHA: ${sourceRef}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'release-cumulative.yml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: { source_ref: sourceRef },
            });
