name: Provision owner device pairing

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Exact deployed commit that must be running on the VPS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signalai-device-pairing
  cancel-in-progress: false

jobs:
  provision:
    name: Send one-time pairing code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1

      - name: Verify requested commit
        env:
          EXPECTED_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD^{commit})"
          [ "$actual_sha" = "$EXPECTED_SHA" ] || {
            echo "::error::source_ref must be an exact deployed commit SHA"
            exit 1
          }

      - name: Verify SSH inputs
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -eu
          test -n "$HOST"
          test -n "$KEY"
          test -n "$HOST_KEY_SHA256"

      - name: Prepare pinned SSH
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          KEY: ${{ secrets.VPS_SSH_KEY || secrets.SSH_SECRET }}
          HOST_KEY_SHA256: ${{ secrets.VPS_SSH_HOST_KEY_SHA256 || 'SHA256:cUfeWKyHoFIhKsV17Bpk076calxUaxd90XhuETb4vng' }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          bash .github/scripts/prepare_known_host.sh "$HOST" "$HOST_KEY_SHA256"

      - name: Provision and deliver owner code
        env:
          HOST: ${{ secrets.VPS_HOST || secrets.SERVER_HOST }}
          USER_NAME: ${{ secrets.VPS_USER || 'root' }}
          EXPECTED_SHA: ${{ inputs.source_ref }}
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$USER_NAME@$HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          DEPLOYED="$(cat "$HOME/signalai/.signalai-source-sha")"
          [ "$DEPLOYED" = "$EXPECTED_SHA" ] || {
            echo 'deployed source does not match requested pairing workflow commit' >&2
            exit 1
          }
          COMPOSE="$SUDO docker compose --env-file /etc/signalai/.env -f $HOME/signalai/server/docker-compose.yml"
          $COMPOSE exec -T api python -m app.ops.provision_device_pairing --minutes 15
          REMOTE

      - name: Remove SSH key
        if: always()
        run: |
          shred -u ~/.ssh/id_deploy 2>/dev/null || rm -f ~/.ssh/id_deploy
